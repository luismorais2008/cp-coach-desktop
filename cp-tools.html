+ (1\\u003c\\u003ck) \\u003c= n` (off-by-one no último bloco).\", \"Query: `k = log2(r-l+1)`, segundo bloco começa em `r-(1\\u003c\\u003ck)+1`, não em `l+(1\\u003c\\u003ck)`.\", \"Sparse table só serve para operações idempotentes (min/max/gcd/or/and); soma precisa de blocos disjuntos.\", \"2D: memória `log²·n·m` — verifica antes de alocar; indexar [kx][ky][i][j] de forma consistente.\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"713D Animals and Puzzle (2700)\", \"url\": \"https://codeforces.com/problemset/problem/713/D\", \"min\": 150, \"note\": \"Sparse 2D + busca binária; só se sobrar tempo.\"}]}, \"binlift\": {\"id\": \"binlift\", \"name\": \"Binary lifting / LCA\", \"group\": \"Árvores\", \"tpl\": \"up[LOG][n] + depth; k-ésimo ancestral; LCA; max/min de aresta no caminho\", \"bugs\": [\"Raiz: `up[0][root] = root` (ou 0 sentinela) — senão o salto cai fora do array.\", \"LCA: primeiro igualar profundidades do mais fundo; depois subir os dois enquanto `up[k][a] != up[k][b]`; resposta é `up[0][a]`, não `a`.\", \"LOG insuficiente para n (usar 18 para 2e5, 20 para 1e6) ou loop `for k from LOG-1 down to 0` esquecido ao contrário.\", \"k-ésimo ancestral com k > depth: devolver −1 em vez de dar a raiz silenciosamente.\", \"DFS recursivo em cadeia de 2e5 nós pode estourar a stack — usar iterativo ou BFS por ordem.\"], \"st\": [{\"judge\": \"CSES\", \"name\": \"Counting Paths\", \"url\": \"https://cses.fi/problemset/task/1136\", \"min\": 45, \"note\": \"LCA + diferenças na árvore.\"}, {\"judge\": \"Kattis\", \"name\": \"Tourists\", \"url\": \"https://open.kattis.com/problems/tourists\", \"min\": 40, \"note\": \"dist(x,y) com LCA; simples, bom para rever rápido.\"}]}, \"krt\": {\"id\": \"krt\", \"name\": \"Kruskal reconstruction tree\", \"group\": \"Árvores\", \"tpl\": \"Kruskal por peso; cada união cria nó novo com valor = peso; LCA no KRT dá o bottleneck; subárvore do nó = componente alcançável com peso ≤ w\", \"bugs\": [\"Alocar 2n−1 nós (os n originais + n−1 internos); arrays de profundidade/LCA dimensionados para 2n.\", \"Arestas que ligam nós já no mesmo componente não criam nó — mas continua a contá-las se o problema pede 'a partir de que peso'.\", \"Grafo desconexo → floresta: vários rootes; LCA entre componentes diferentes não existe.\", \"Ordenar por peso crescente para min-max (bottleneck) e decrescente para max-min — trocar a ordem é o erro clássico.\", \"Folhas (nós originais) têm valor neutro (−∞/+∞), não 0.\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"1706E Qpwoeirut and Vertices (2300)\", \"url\": \"https://codeforces.com/problemset/problem/1706/E\", \"min\": 120, \"note\": \"KRT + sparse table sobre LCA de intervalos — junta duas técnicas do plano.\"}, {\"judge\": \"UVa\", \"name\": \"12655 Trucks\", \"url\": \"https://onlinejudge.org/external/126/12655.pdf\", \"min\": 45, \"note\": \"Max-min path; igual ao Bond, para repetir.\"}]}, \"s2l\": {\"id\": \"s2l\", \"name\": \"Small to large merging\", \"group\": \"Árvores\", \"tpl\": \"DFS que devolve set/map; junta o menor no maior (swap de ponteiros); responde queries ao fechar o nó\", \"bugs\": [\"Juntar o maior no menor — fica O(n²). Faz sempre `if (a.size() \\u003c b.size()) swap(a,b)` e devolve `a`.\", \"Copiar o contentor em vez de mover/apontar (`vector\\u003cset\\u003cint>> s(n)` + `s[u] = s[v]` copia!). Usa ponteiros/índices ou `std::move`.\", \"Ao mover o índice (`id[u] = id[v]`), as queries de u têm de ser respondidas depois de todos os filhos serem fundidos, nunca antes.\", \"Map de 'valor→contagem' com actualizações de máximo: ao somar contagens o máximo pode mudar para um valor que não é o do elemento inserido.\", \"Recursão profunda: n=2e5 em cadeia — stack ou iterativo.\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"570D Tree Requests (2200)\", \"url\": \"https://codeforces.com/problemset/problem/570/D\", \"min\": 90, \"note\": \"Mesmo padrão com máscaras de paridade por profundidade.\"}]}, \"reroot\": {\"id\": \"reroot\", \"name\": \"Rerooting\", \"group\": \"Árvores\", \"tpl\": \"dp_down (DFS1) + dp_up por prefixo/sufixo dos irmãos (DFS2); funções combine/add_root explícitas\", \"bugs\": [\"'Remover' a contribuição do filho por divisão/subtracção quando a operação não é invertível (produto mod, max, gcd) — usa prefixo/sufixo.\", \"Esquecer que dp_up[v] combina dp_up[p] com os irmãos de v e depois aplica add_root — não com o próprio v.\", \"Folha vs raiz: o valor base de um nó sem filhos tem de ser o elemento neutro da combinação.\", \"Overflow em somas de tamanhos × distâncias (long long).\", \"Em grafos com n=1 ou árvore em linha, a segunda DFS tem de dar o mesmo que recalcular do zero — testa com brute force O(n²).\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"543D Road Improvement (2300)\", \"url\": \"https://codeforces.com/problemset/problem/543/D\", \"min\": 100, \"note\": \"Igual ao EDPC V mas com módulo primo que tenta seduzir-te a usar inverso (há zeros!).\"}, {\"judge\": \"Codeforces\", \"name\": \"1092F Tree with Maximum Cost (1900)\", \"url\": \"https://codeforces.com/problemset/problem/1092/F\", \"min\": 45, \"note\": \"Rerooting rápido para a semana final.\"}]}, \"centroid\": {\"id\": \"centroid\", \"name\": \"Centroid decomposition\", \"group\": \"Árvores\", \"tpl\": \"calc sizes → find centroid → processar caminhos que passam pelo centroid (contribuição total − contribuição por subárvore) → marcar e recursar\", \"bugs\": [\"Recalcular `sz` a partir do centroid actual antes de procurar o próximo (os tamanhos antigos incluem nós já removidos).\", \"Não marcar o centroid como removido antes de recursar → O(n²) ou loop infinito.\", \"Dupla contagem: caminhos cujos dois extremos estão na mesma subárvore do centroid — subtrai por subárvore (ou faz 'adiciona depois de contar').\", \"Limpar o array/BIT de profundidades por centroid só nas posições usadas (limpar tudo é O(n) por centroid → O(n²)).\", \"Profundidades até n: o array de contagens precisa de tamanho ≥ tamanho do componente actual; BIT 1-indexado com k=0.\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"914E Palindromes in a Tree (2400)\", \"url\": \"https://codeforces.com/problemset/problem/914/E\", \"min\": 120, \"note\": \"Contagem com máscaras de 20 bits através do centroid.\"}]}, \"bridges\": {\"id\": \"bridges\", \"name\": \"Tarjan: pontes e pontos de articulação\", \"group\": \"Grafos\", \"tpl\": \"tin/low numa DFS; ponte: low[v] > tin[u]; articulação: low[v] >= tin[u] (raiz: ≥2 filhos na DFS tree); multi-arestas por id da aresta\", \"bugs\": [\"Ignorar o pai pelo *vértice* em vez de pelo *id da aresta* → multi-arestas paralelas deixam de ser detectadas como não-ponte.\", \"`low[u] = min(low[u], tin[v])` para back edges (não `low[v]`), e `low[u] = min(low[u], low[v])` para tree edges.\", \"Articulação: condição `>=` (não `>`), e a raiz é articulação sse tem ≥ 2 filhos na árvore DFS.\", \"Grafo desconexo: correr a DFS de todos os vértices não visitados, com o timer global.\", \"Recursão: m, n até 2e5 — stack; se usares iterativo, guarda o índice da próxima aresta por vértice.\"], \"st\": [{\"judge\": \"CSES\", \"name\": \"Strongly Connected Edges\", \"url\": \"https://cses.fi/problemset/task/2177\", \"min\": 60, \"note\": \"Orientação forte: impossível sse há ponte; orientar pela DFS tree.\"}, {\"judge\": \"UVa\", \"name\": \"796 Critical Links\", \"url\": \"https://onlinejudge.org/external/7/796.pdf\", \"min\": 45, \"note\": \"Pontes com formato de output chato — bom para disciplina.\"}, {\"judge\": \"CSES\", \"name\": \"MST Edge Check\", \"url\": \"https://cses.fi/problemset/task/3407\", \"min\": 75, \"note\": \"Pontes por classe de peso no grafo comprimido pela DSU — aplicação menos óbvia.\"}]}, \"scc\": {\"id\": \"scc\", \"name\": \"Tarjan: SCC (+ 2-SAT)\", \"group\": \"Grafos\", \"tpl\": \"Tarjan SCC com stack e onStack; ordem topológica das componentes sai ao contrário; 2-SAT: x e ¬x na mesma SCC → impossível; valor = comp[x] \\u003c comp[¬x] (ordem de Tarjan)\", \"bugs\": [\"Esquecer `onStack` e usar só `visited` → low errado quando se encontra um vértice de uma SCC já fechada.\", \"A ordem em que Tarjan fecha componentes é topológica *inversa*; DP sobre a condensação tem de iterar pela ordem certa.\", \"2-SAT: índice da negação (`x^1`) trocado em alguma das duas implicações da cláusula (a∨b ⇒ ¬a→b e ¬b→a).\", \"Arestas da condensação duplicadas → se contas graus, usa set ou deduplica.\", \"Reinicializar timer, stack, comp[] entre casos de teste (UVa/Kattis multi-caso).\"], \"st\": [{\"judge\": \"CSES\", \"name\": \"Reachability Queries\", \"url\": \"https://cses.fi/problemset/task/2143\", \"min\": 75, \"note\": \"SCC + bitset em ordem topológica.\"}, {\"judge\": \"UVa\", \"name\": \"11504 Dominos\", \"url\": \"https://onlinejudge.org/external/115/11504.pdf\", \"min\": 40, \"note\": \"SCC + indegree 0; vários casos.\"}, {\"judge\": \"CSES\", \"name\": \"Flight Route Requests\", \"url\": \"https://cses.fi/problemset/task/1699\", \"min\": 75, \"note\": \"SCC + DAG.\"}]}, \"maxflow\": {\"id\": \"maxflow\", \"name\": \"Max flow (Edmonds-Karp)\", \"group\": \"Grafos\", \"tpl\": \"Lista de arestas emparelhadas (e, e^1) com cap e flow; BFS guarda a aresta de entrada; reconstruir corte mínimo pelos vértices alcançáveis no residual\", \"bugs\": [\"Aresta inversa com cap 0 e índice `e^1` — se adicionares arestas fora do par (ex.: não dirigidas com cap dos dois lados) o `^1` deixa de bater.\", \"BFS que não guarda a aresta de entrada (ou guarda o vértice) → impossível empurrar na aresta certa quando há arestas paralelas.\", \"Corte mínimo: a resposta são arestas *originais* u→v com u alcançável e v não — não arestas saturadas quaisquer.\", \"Reconstrução de caminhos: seguir arestas com flow>0 e decrementar ao usar; o fluxo pode ter ciclos (ignorar ou cancelar).\", \"Overflow da capacidade (soma de 1e9) — long long no fluxo total; INF sentinela consistente.\"], \"st\": [{\"judge\": \"Kattis\", \"name\": \"Avoiding the Apocalypse\", \"url\": \"https://open.kattis.com/problems/avoidingtheapocalypse\", \"min\": 90, \"note\": \"Grafo expandido no tempo — modelação.\"}, {\"judge\": \"Codeforces\", \"name\": \"546E Soldier and Traveling (2100)\", \"url\": \"https://codeforces.com/problemset/problem/546/E\", \"min\": 75, \"note\": \"Flow + reconstruir matriz de transferências.\"}, {\"judge\": \"UVa\", \"name\": \"820 Internet Bandwidth\", \"url\": \"https://onlinejudge.org/external/8/820.pdf\", \"min\": 30, \"note\": \"Arestas não dirigidas; repetição rápida.\"}]}, \"persist\": {\"id\": \"persist\", \"name\": \"Persistent segment tree\", \"group\": \"Estruturas\", \"tpl\": \"Nós em pool (vector/array estático); update devolve raiz nova copiando o caminho; versões por prefixo → k-ésimo / contagens em [l,r] = ver(r) − ver(l−1)\", \"bugs\": [\"Pool demasiado pequena: cada update cria ~log n + 1 nós (n·20 para 2e5 + margens).\", \"Update que altera o nó antigo em vez de criar cópia (modificar `t[v]` antes de clonar).\", \"Nó 0 como 'vazio' tem de ter filhos 0 e valor neutro, e nunca ser escrito.\", \"k-ésimo: comparar `cnt(left_r) − cnt(left_l)`, usando as duas raízes em paralelo.\", \"Versão 0 = árvore vazia; ao indexar versões por prefixo, query(l,r) usa raízes r e l−1.\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"1227D2 Optimal Subsequences (hard, 1800)\", \"url\": \"https://codeforces.com/problemset/problem/1227/D2\", \"min\": 60, \"note\": \"Versão k = depois de inserir os k melhores; query = k-ésimo índice presente.\"}, {\"judge\": \"Codeforces\", \"name\": \"893F Subtree Minimum Query (2300)\", \"url\": \"https://codeforces.com/problemset/problem/893/F\", \"min\": 90, \"note\": \"Persistência ao longo da profundidade + Euler tour; queries online com xor.\"}]}, \"mcmf\": {\"id\": \"mcmf\", \"name\": \"Min cost max flow (Bellman-Ford/SPFA)\", \"group\": \"Grafos\", \"tpl\": \"Mesmo grafo residual do max flow com cost e −cost; Bellman-Ford/SPFA por iteração; empurrar o bottleneck do caminho mais barato; parar quando dist[t] = INF (ou custo ≥ 0 se for min cost any flow)\", \"bugs\": [\"Aresta inversa com custo −c (não c) e cap 0.\", \"Ciclos negativos no residual não aparecem se nunca há ciclo negativo no grafo original e empurras sempre pelo caminho mais curto — mas aparecem se o grafo inicial já tem ciclo negativo.\", \"SPFA sem `inQueue` ou Bellman-Ford sem early-exit → TLE; e `dist` tem de ser long long.\", \"Confundir 'min cost *max* flow' com 'min cost flow de k unidades' (parar em k) ou 'min cost any flow' (parar quando custo do caminho ≥ 0).\", \"Arestas não dirigidas em MCMF precisam de 2 arestas (4 na lista), não de uma com cap nos dois sentidos.\"], \"st\": [{\"judge\": \"CSES\", \"name\": \"Task Assignment\", \"url\": \"https://cses.fi/problemset/task/2129\", \"min\": 60, \"note\": \"Assignment n=200 via MCMF; com Bellman-Ford puro pode ser apertado → SPFA ou Dijkstra com potenciais.\"}, {\"judge\": \"CSES\", \"name\": \"Distinct Routes II\", \"url\": \"https://cses.fi/problemset/task/2130\", \"min\": 60, \"note\": \"k caminhos aresta-disjuntos de custo mínimo + reconstrução.\"}, {\"judge\": \"Codeforces\", \"name\": \"863F Almost Permutation (2200)\", \"url\": \"https://codeforces.com/problemset/problem/863/F\", \"min\": 100, \"note\": \"Custos convexos = várias arestas paralelas com custo crescente.\"}]}, \"cht\": {\"id\": \"cht\", \"name\": \"Convex hull trick\", \"group\": \"Optimização de DP\", \"tpl\": \"Deque de rectas com declives monótonos; remover do fim por verificação de intersecção com cross-multiplication em __int128/long double; queries monótonas com ponteiro ou busca binária\", \"bugs\": [\"Declives repetidos: ao inserir uma recta com o mesmo declive, ficar com a de melhor intercepto (senão divisão por zero na intersecção).\", \"Teste de remoção `bad(l1,l2,l3)` com produto cruzado — overflow em long long (1e12·1e12); usa __int128 ou long double com cuidado.\", \"Sinal invertido: min vs max e declives crescentes vs decrescentes trocam todas as desigualdades. Deriva uma vez e escreve a convenção no topo do código.\", \"Ponteiro de query monótona nunca anda para trás; se as queries não são monótonas tens de usar busca binária (ou Li Chao).\", \"Quando o deque fica com 1 recta, não a removas (while size ≥ 2).\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"311B Cats Transport (2400)\", \"url\": \"https://codeforces.com/problemset/problem/311/B\", \"min\": 100, \"note\": \"CHT dentro de DP em camadas (p camadas); muito propenso a off-by-one.\"}, {\"judge\": \"UVa\", \"name\": \"12524 Arranging Heaps\", \"url\": \"https://onlinejudge.org/external/125/12524.pdf\", \"min\": 90, \"note\": \"DP O(nk) com CHT por camada.\"}]}, \"lichao\": {\"id\": \"lichao\", \"name\": \"Li Chao tree\", \"group\": \"Optimização de DP\", \"tpl\": \"Árvore sobre o domínio x (coordenadas comprimidas se preciso); insert de recta por descida com swap no meio; query desce comparando; versão com segmentos [l,r] insere em O(log²)\", \"bugs\": [\"Comparar a recta nova no `mid` *e* num extremo para decidir para que lado descer; descer para o lado errado perde rectas.\", \"Domínio: se x é real/grande, comprime as coordenadas das queries *antes* (offline) ou usa Li Chao dinâmico com nós alocados.\", \"Evaluar rectas em x com overflow: m·x com m,x até 1e9 → long long ok, mas 1e12·1e6 não.\", \"Nó vazio: inicializar com recta 'neutra' (0x + INF) em vez de flag — ou tratar flag em todos os ramos.\", \"Versão com segmentos: inserir nos O(log) nós e em cada um fazer o insert normal (O(log²)); esquecer de recursar para baixo após o swap.\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"1715E Long Way Home (2400)\", \"url\": \"https://codeforces.com/problemset/problem/1715/E\", \"min\": 120, \"note\": \"k rondas de Dijkstra + 'voo' com custo (u−v)² — Li Chao/CHT por ronda.\"}, {\"judge\": \"Luogu\", \"name\": \"P4097 李超线段树 (template)\", \"url\": \"https://www.luogu.com.cn/problem/P4097\", \"min\": 60, \"note\": \"Template chinês de segmentos; usa tradução automática.\"}]}, \"kmp\": {\"id\": \"kmp\", \"name\": \"KMP / prefix function / Z\", \"group\": \"Strings\", \"tpl\": \"prefix function π; Z-function; autómato KMP (próximo estado para cada letra) para DP\", \"bugs\": [\"π[i] usa `while (j > 0 && s[i] != s[j]) j = π[j-1]` — `π[j]` em vez de `π[j-1]` é o bug nº 1.\", \"Autómato: a transição do estado n (match completo) tem de ser calculada a partir de π[n−1], senão perdes matches sobrepostos.\", \"Concatenar `p + '#' + t` com um separador que não existe no alfabeto — sem separador, π pode exceder |p|.\", \"Z-function: manter [l,r] com r exclusivo ou inclusivo de forma consistente; z[0] indefinido.\", \"Contagem de ocorrências de cada prefixo: processar i de n−1 para 1 (cnt[π[i]−1] += cnt[i]) e somar 1 a todos.\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"346B Lucky Common Subsequence (2000)\", \"url\": \"https://codeforces.com/problemset/problem/346/B\", \"min\": 90, \"note\": \"LCS + autómato KMP com reconstrução.\"}, {\"judge\": \"UVa\", \"name\": \"11475 Extend to Palindrome\", \"url\": \"https://onlinejudge.org/external/114/11475.pdf\", \"min\": 30, \"note\": \"π de s$rev(s) — rápido.\"}, {\"judge\": \"Codeforces\", \"name\": \"471D MUH and Cube Walls (1800)\", \"url\": \"https://codeforces.com/problemset/problem/471/D\", \"min\": 40, \"note\": \"KMP sobre diferenças; cuidado com padrão de tamanho 1.\"}]}, \"trie\": {\"id\": \"trie\", \"name\": \"Tries (incl. trie binária de XOR)\", \"group\": \"Strings\", \"tpl\": \"Trie em arrays (nxt[node][26], cnt, end); trie binária de 30 bits com contagens para inserir/remover e max XOR\", \"bugs\": [\"Esquecer de inserir o prefixo vazio (0) na trie de xor de prefixos → subarrays que começam em 0 não contam.\", \"Número de nós: n·(bits+1) para trie binária; n·|alfabeto| de memória para trie de strings (26·1e6 ints = 104 MB!).\", \"Remoção por contagem: ao descer verifica `cnt[child] > 0` antes de ir para o ramo preferido.\", \"Reinicializar trie entre casos: só os nós usados (guarda `sz` e limpa até `sz`).\", \"Max XOR: ir do bit mais alto para o mais baixo e preferir o bit oposto — iterar os bits na ordem errada dá resultado errado só em alguns testes.\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"282E Sausage Maximization (2200)\", \"url\": \"https://codeforces.com/problemset/problem/282/E\", \"min\": 60, \"note\": \"xor de prefixo ⊕ xor de sufixo disjuntos; trie dos sufixos + varrer prefixos.\"}, {\"judge\": \"UVa\", \"name\": \"11362 Phone List\", \"url\": \"https://onlinejudge.org/external/113/11362.pdf\", \"min\": 25, \"note\": \"Prefix-free; vários casos — resetar a trie (não `memset` de 1e7 por caso!).\"}]}, \"hash\": {\"id\": \"hash\", \"name\": \"Hashing (Rabin-Karp)\", \"group\": \"Strings\", \"tpl\": \"Hash polinomial com 2 módulos (ou mod 2^61−1), prefixos e potências; hash de substring; hash invertido para palíndromos; hash em segment tree para updates\", \"bugs\": [\"Base \\u003c tamanho do alfabeto ou base fixa e módulo 2^64 (unsigned overflow) → hackável/colide em Codeforces; usa 2 mods primos ou mod 2^61−1 com base aleatória.\", \"Hash de substring: `h[r] − h[l]·p^(r−l)` (mod, +mod) — trocar a potência é o erro clássico.\", \"Hash invertido para palíndromos: os índices invertem-se (`n−1−r … n−1−l`); escreve uma função `rev(l,r)` em vez de inline.\", \"Segment tree de hashes: `comb = left·p^len(right) + right` — precisa do tamanho do filho direito, não do esquerdo.\", \"Comparar hashes de comprimentos diferentes (ou esquecer de normalizar o mod negativo).\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"271D Good Substrings (1800)\", \"url\": \"https://codeforces.com/problemset/problem/271/D\", \"min\": 45, \"note\": \"Contar substrings distintas por hash — O(n²) hashes em set; colisões com 1 mod de 32 bits.\"}, {\"judge\": \"UVa\", \"name\": \"12206 Stammering Aliens\", \"url\": \"https://onlinejudge.org/external/122/12206.pdf\", \"min\": 60, \"note\": \"Busca binária no comprimento + hash com ≥ m ocorrências; também sai com suffix array.\"}, {\"judge\": \"Codeforces\", \"name\": \"1056E Check Transcription (2100)\", \"url\": \"https://codeforces.com/problemset/problem/1056/E\", \"min\": 75, \"note\": \"Enumerar |r0| e verificar com hashes.\"}]}, \"aho\": {\"id\": \"aho\", \"name\": \"Aho-Corasick\", \"group\": \"Strings\", \"tpl\": \"Trie + BFS para suffix links e transições completas (autómato); dictionary/output links ou somas na árvore de suffix links para contar ocorrências\", \"bugs\": [\"Marcar 'terminal' só no nó próprio e não herdar via suffix link (`term[v] |= term[link[v]]`) → padrões que são sufixos de outros falham.\", \"Contar ocorrências percorrendo a cadeia de suffix links por cada carácter do texto é O(n·k) → TLE nos testes do CSES; propaga em ordem BFS inversa.\", \"Transições do autómato: para a raiz, filhos inexistentes apontam para a raiz (não para link[root]).\", \"Padrões duplicados: guarda a lista de ids por nó, não um único id.\", \"Memória: nós × alfabeto; com alfabeto 26 e 1e6 caracteres totais já são 26e6 ints.\"], \"st\": [{\"judge\": \"UVa\", \"name\": \"1449 Dominating Patterns\", \"url\": \"https://onlinejudge.org/external/14/1449.pdf\", \"min\": 45, \"note\": \"Contagem máxima; padrões repetidos.\"}, {\"judge\": \"Codeforces\", \"name\": \"1437G Death DBMS (2600)\", \"url\": \"https://codeforces.com/problemset/problem/1437/G\", \"min\": 150, \"note\": \"Aho + árvore de suffix links + multiset por nó — só se sobrar tempo.\"}, {\"judge\": \"Library Checker\", \"name\": \"Aho-Corasick\", \"url\": \"https://judge.yosupo.jp/problem/aho_corasick\", \"min\": 30, \"note\": \"Verificação do template (output da estrutura).\"}]}, \"sa\": {\"id\": \"sa\", \"name\": \"Suffix array / suffix automaton (ou suffix tree)\", \"group\": \"Strings\", \"tpl\": \"SA O(n log n) por duplicação + Kasai LCP; sparse table sobre LCP; suffix automaton (ou Ukkonen) com len/link/next e contagem de ocorrências por 'endpos'\", \"bugs\": [\"Duplicação: ordenar por (rank[i], rank[i+k]) com rank[i+k] = −1 quando i+k ≥ n; actualizar ranks numa cópia, não in-place.\", \"Kasai: `if (k) k--` ao avançar e `if rank[i]==n−1 { k=0; continue }`.\", \"Concatenar várias strings com separadores *distintos* e menores que o alfabeto (ou tratar comparações para não atravessar separadores).\", \"Suffix automaton: ao clonar, copiar `next` e `link`, e definir `len[clone] = len[p]+1`; actualizar `link` de q e de cur para clone.\", \"Contagem de ocorrências no SAM: propagar `cnt` por ordem decrescente de len (clones começam com 0).\"], \"st\": [{\"judge\": \"CSES\", \"name\": \"Substring Order II\", \"url\": \"https://cses.fi/problemset/task/2109\", \"min\": 75, \"note\": \"Com repetições — soma de ocorrências.\"}, {\"judge\": \"CSES\", \"name\": \"Substring Distribution\", \"url\": \"https://cses.fi/problemset/task/2110\", \"min\": 45, \"note\": \"Nº de substrings distintas por comprimento — diferença de prefixos com SA/LCP ou SAM.\"}, {\"judge\": \"CSES\", \"name\": \"Repeating Substring\", \"url\": \"https://cses.fi/problemset/task/2106\", \"min\": 20, \"note\": \"= Dvaput; repetição rápida.\"}, {\"judge\": \"Codeforces\", \"name\": \"235C Cyclical Quest (2700)\", \"url\": \"https://codeforces.com/problemset/problem/235/C\", \"min\": 150, \"note\": \"Suffix automaton clássico; só se sobrar tempo.\"}, {\"judge\": \"Kattis\", \"name\": \"Suffix Sorting\", \"url\": \"https://open.kattis.com/problems/suffixsorting\", \"min\": 30, \"note\": \"SA com queries de posição.\"}]}, \"sos\": {\"id\": \"sos\", \"name\": \"SOS DP\", \"group\": \"Padrões de DP\", \"tpl\": \"for bit: for mask: if mask>>bit&1: f[mask] += f[mask^(1\\u003c\\u003cbit)] (subconjuntos); versão de superconjuntos; inversão (Möbius) com −=\", \"bugs\": [\"Ordem dos loops: o loop exterior tem de ser o *bit*; com o bit no interior deixa de ser DP sobre subconjuntos (conta mal).\", \"Inversão de Möbius usa a mesma ordem de loops mas com `-=`; para superconjuntos a condição é `!(mask>>bit&1)` e `f[mask] += f[mask|1\\u003c\\u003cbit]`.\", \"Tamanho 1\\u003c\\u003c20 com long long e 2 arrays = 16 MB cada — ok; mas 1\\u003c\\u003c22 já estoira.\", \"Complemento: `(~a) & ((1\\u003c\\u003cB)−1)`; esquecer o AND dá máscaras negativas.\", \"Nos 'top-2' por mask, fundir (a1,a2) com (b1,b2) escolhendo os dois melhores com índices distintos.\"], \"st\": [{\"judge\": \"Codeforces\", \"name\": \"449D Jzzhu and Numbers (2400)\", \"url\": \"https://codeforces.com/problemset/problem/449/D\", \"min\": 60, \"note\": \"Superconjuntos + 2^cnt + inclusão-exclusão por popcount.\"}, {\"judge\": \"Codeforces\", \"name\": \"1234F Yet Another Substring Reverse (2200)\", \"url\": \"https://codeforces.com/problemset/problem/1234/F\", \"min\": 75, \"note\": \"best[mask] = max popcount de um sub-mask presente; SOS de max.\"}]}}}\u003c/script>\n\u003cscript id=\"index\" type=\"application/json\">{\"usaco\": [{\"t\": \"Adding Solutions\", \"p\": \"1_General/Adding_Solution.problems.json\", \"id\": \"adding-solution\"}, {\"t\": \"Basic Debugging\", \"p\": \"1_General/Basic_Debugging.problems.json\", \"id\": \"basic-debugging\"}, {\"t\": \"Choosing a Language\", \"p\": \"1_General/Choosing_Lang.problems.json\", \"id\": \"choosing-lang\"}, {\"t\": \"Contest Strategy\", \"p\": \"1_General/Contest_Strategy.problems.json\", \"id\": \"contest-strategy\"}, {\"t\": \"Contests\", \"p\": \"1_General/Contests.problems.json\", \"id\": \"contests\"}, {\"t\": \"Contributing\", \"p\": \"1_General/Contributing.problems.json\", \"id\": \"contributing\"}, {\"t\": \"C++ With the Command Line\", \"p\": \"1_General/Cpp_Command.problems.json\", \"id\": \"cpp-command\"}, {\"t\": \"Data Types\", \"p\": \"1_General/Data_Types.problems.json\", \"id\": \"data-types\"}, {\"t\": \"How to Debug\", \"p\": \"1_General/Debugging_Checklist.problems.json\", \"id\": \"debugging-checklist\"}, {\"t\": \"Expected Knowledge\", \"p\": \"1_General/Expected_Knowledge.problems.json\", \"id\": set.minDay=T.set.perDay*45;\n  T.set=Object.assign({minDay:90,gaps:[4,10],maint:[21,35,60],cfMin:1600,cfMax:2400},T.set||{});\n  for(const t of T.techs){t.probs=t.probs||[];t.log=t.log||[];t.bugs=t.bugs||[];t.skip=t.skip||[];t.fixed=t.fixed||{}}\n}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}};\n// The built-in list of 19 harder techniques. With `dated`, it is the original SWERC plan (its dates, and every task\n// ticked in the old tool carried over); without, it is a fresh example list spread over the coming days.\nfunction migrate(dated){\n  let st={};try{st=JSON.parse(localStorage.getItem(OLDKEY)||'{}')||{}}catch(e){}\n  const KI={N:0,R1:1,R2:2,R3:3},techs=[];\n  for(const o of Object.values(SEED.TECH)){\n    const t={id:o.id,name:o.name,group:o.group,tpl:o.tpl,bugs:o.bugs.slice(),added:today,stage:0,due:today,fixed:{},log:[],probs:[],skip:[]};\n    const its=SEED.SCHED.filter(x=>x.tech===o.id).sort((a,b)=>KI[a.kind]-KI[b.kind]);\n    let chain=true;\n    for(const it of its){\n      const s=KI[it.kind];if(dated)t.fixed[s]=it.date;\n      const when=it.date\u003ctoday?it.date:today;let all;\n      if(it.kind==='R3')all=!!st[o.id+'|R3'];\n      else{all=it.probs.length>0;for(const p of it.probs){const d=!!st[o.id+'|'+it.kind+'|'+p.name];if(!d)all=false;\n        t.probs.push({id:uid(),judge:p.judge,name:p.name,url:p.url,min:p.min,note:p.note,stage:s,done:d?when:null})}}\n      if(chain&&all){t.stage=s+1;t.log.push({s,d:when,ok:true})}else chain=false;\n    }\n    for(const p of o.st)t.probs.push({id:uid(),judge:p.judge,name:p.name,url:p.url,min:p.min,note:p.note,stage:null,done:st[o.id+'|ST|'+p.name]?today:null});\n    t.due=dated?(t.fixed[t.stage]||addD(today,21)):addD(today,techs.length);\n    techs.push(t);\n  }\n  return {v:1,techs};\n}\nconst tech=id=>T.techs.find(t=>t.id===id);\nconst active=()=>T.techs.filter(t=>!t.paused);\n\n/* ---------- scheduling ---------- */\nfunction interval(s){const g=T.set.gaps,m=T.set.maint;return s===0?g[0]:s===1?g[1]:m[Math.min(s-2,m.length-1)]}\nfunction sessProbs(t,s){return t.probs.filter(p=>p.stage===s)}\nfunction sessMin(t,s){const ps=sessProbs(t,s).filter(p=>!p.opt);return s>=3?25:(ps.length?ps.reduce((a,p)=>a+(p.min||45),0):45)}\n// One session counts as its problems still to do (a blind rewrite counts as 1 exercise).\nfunction units(t,s){return s>=3?1:Math.max(1,sessProbs(t,s).filter(p=>!p.opt&&!p.done).length)}\nconst monday=d=>{const x=new Date(d+'T12:00');return addD(d,-((x.getDay()+6)%7))};\n// Minutes a session still needs: its problems not yet done (a blind rewrite takes 25 min).\nfunction leftMin(t,s){if(s>=3)return 25;const ps=sessProbs(t,s).filter(p=>!p.opt);return ps.length?Math.max(15,ps.filter(p=>!p.done).reduce((a,p)=>a+(p.min||45),0)):45}\n// Technique work allowed on a day, as {c,unit}: the weekly goal set on the home page (minutes, or a number of\n// exercises in weeks planned that way), else the last planned week, else the default number of minutes.\nfunction capFn(){\n  let C={};try{C=JSON.parse(localStorage.getItem('cpcoach.v1'))||{}}catch(e){}\n  const W=C.weeks||{},keys=Object.keys(W).filter(k=>W[k]&&Array.isArray(W[k].days)).sort();\n  // load of a week, chosen with its goals on the home page: 'rev' starts no new technique, 'off' schedules nothing\n  const mode=d=>{const w=W[monday(d)];return w&&Array.isArray(w.days)&&(w.mode==='rev'||w.mode==='off')?w.mode:''};\n  const base=d=>{const m=monday(d);let k=W[m]&&Array.isArray(W[m].days)?m:null;\n    if(!k){for(const x of keys)if(x\u003cm)k=x}\n    if(!k)return {c:+(C.set||{}).minDay||T.set.minDay,unit:'min'};\n    const n=parseInt((W[k].days[(new Date(d+'T12:00').getDay()+6)%7]||{}).tec,10);return {c:n>=0?n:0,unit:W[k].unit==='min'?'min':'n'}};\n  return d=>{const r=base(d),md=mode(d);r.mode=md;if(md==='off')r.c=0;return r};\n}\nconst cost=(t,s,unit)=>unit==='min'?leftMin(t,s):units(t,s);\nfunction doneToday(unit){let n=0;for(const t of T.techs){for(const p of t.probs)if(p.done===today)n+=unit==='min'?(p.min||45):1;n+=t.log.filter(l=>l.d===today&&l.s>=3).length*(unit==='min'?25:1)}return n}\nconst capTxt=(n,unit)=>unit==='min'?n+' min':n+' exercício(s)';\n// Sessions for the next H days. Each day takes sessions that are due, most urgent first, up to that day's number of\n// exercises; the rest wait for the next day with room. Sessions after the real next one assume the previous was done that day.\nfunction project(H,skipId){\n  const out=[],end=addD(today,H),cap=capFn();\n  const q=active().filter(t=>t.id!==skipId).map(t=>({t,s:t.stage,due:t.due,real:true}));\n  for(let i=0;i\u003c=H;i++){\n    const d=addD(today,i),cu=cap(d),c=cu.c;let used=i===0?doneToday(cu.unit):0;\n    const pin=x=>x.real&&x.t.pin===today&&i===0;\n    const todo=q.filter(x=>x.due\u003c=d).sort((a,b)=>(pin(b)-pin(a))||((a.s===0)-(b.s===0))||(a.due\u003cb.due?-1:a.due>b.due?1:0));\n    let placed=0;\n    for(const x of todo){\n      const u=cost(x.t,x.s,cu.unit);\n      if(!pin(x)&&cu.mode==='rev'&&x.s===0)continue;\n      if(!pin(x)&&(c\u003c=0||(used+u>c&&(placed>0||used>0))))continue;\n      if(!pin(x)){used+=u;placed++} // a session pinned with «Fazer hoje» is extra: it does not push the others out\n      out.push({d,t:x.t,s:x.s,real:x.real,late:x.real&&x.t.due\u003ctoday,min:sessMin(x.t,x.s),u,n:units(x.t,x.s)});\n      let nd=addD(d,interval(x.s));const fx=x.t.fixed[x.s+1];if(fx&&fx>d)nd=fx;\n      x.due=nd;x.s++;x.real=false;\n    }\n  }\n  return out;\n}\nfunction firstFreeDay(){ // first day with room left for one more exercise and no other first pass\n  const pr=project(120),m={},nw={},cap=capFn();\n  for(const x of pr){m[x.d]=(m[x.d]||0)+x.u;if(x.s===0)nw[x.d]=1}\n  for(let i=0;i\u003c120;i++){const d=addD(today,i);const cu=cap(d);if(!nw[d]&&(m[d]||0)+(i===0?doneToday(cu.unit):0)\u003ccu.c)return d}\n  return addD(today,1);\n}\nfunction complete(t,ok){\n  const s=t.stage;t.log.push({s,d:today,ok});\n  let iv=interval(s);if(!ok)iv=Math.max(2,Math.round(iv/3));\n  if(ok||s\u003c3)t.stage=s+1;\n  let nd=addD(today,iv);const fx=t.fixed[t.stage];\n  if(ok&&fx&&fx>=addD(today,2))nd=fx;\n  t.due=nd;delete t.pin;save();\n}\n\n/* ---------- solved problems (Codeforces API + CSES import of the journal) ---------- */\nconst solved=new Set();\nfunction pkey(u){u=u||'';let m;\n  if((m=u.match(/codeforces\\.com\\/(?:problemset\\/problem|contest|gym)\\/(\\d+)\\/(?:problem\\/)?(\\w+)/i)))return 'cf:'+m[1]+m[2].toUpperCase();\n  if((m=u.match(/cses\\.fi\\/problemset\\/task\\/(\\d+)/i)))return 'cses:'+m[1];\n  return 'u:'+u.replace(/^https?:\\/\\/(www\\.)?/,'').replace(/\\/$/,'');}\nfunction cfHandle(){try{const p=JSON.parse(localStorage.getItem('cptools.profile'))||{};if(p.handle)return p.handle}catch(e){}\n  try{const a=JSON.parse(localStorage.getItem('cfTrainerState'))||{};if(a.handle)return a.handle}catch(e){}\n  try{const b=JSON.parse(localStorage.getItem('cpjournal.v1'))||{};return(b.settings||{}).cf||''}catch(e){}return ''}\nconst solvedOn={};let solvedAt=0;\nasync function loadSolved(){\n  solvedAt=Date.now();\n  try{const j=JSON.parse(localStorage.getItem('cpjournal.v1'))||{};for(const k of Object.keys(j.solved||{}))if(/^(cses|cf):/.test(k))solved.add(k)}catch(e){}\n  const h=cfHandle();\n  if(h){try{const r=await(await fetch('https://codeforces.com/api/user.status?handle='+encodeURIComponent(h))).json();\n    if(r.status==='OK')for(const s of r.result)if(s.verdict==='OK'&&s.problem){const k='cf:'+(s.problem.contestId||s.contestId)+s.problem.index;solved.add(k);\n      const d=ymd(new Date(s.creationTimeSeconds*1000));if(!solvedOn[k]||d\u003csolvedOn[k])solvedOn[k]=d}}catch(e){}}\n  let ch=false;\n  // a proposed problem that shows up as solved is ticked by itself, on the day it was solved\n  for(const t of T.techs)for(const p of t.probs)if(!p.done&&solved.has(pkey(p.url))){p.done=solvedOn[pkey(p.url)]||today;ch=true}\n  if(ch)save();render();\n}\n\n/* ---------- problem search ---------- */\nconst norm=s=>s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();\nconst STOP=new Set('de da do e a o com em para the and of on in for with incl ou or tarjan tree trees arvore arvores algorithm algorithms s function pontos points point 1d 2d binaria finding using o n m optional'.split(' '));\n// technique name pattern -> page titles (every word of one phrase must be in the title)\nconst ALIAS=[[/\\blca\\b|binary lifting/,['binary jumping','lowest common ancestor binary lifting']],[/\\bcht\\b/,['convex hull trick']],[/\\bscc\\b/,['strongly connected components']],\n [/2 ?sat/,['2 sat']],[/\\bmcmf\\b|min cost/,['minimum cost flow']],[/^(?!.*min cost).*(max ?flow|fluxo max)/,['maximum flow']],[/\\bkmp\\b|prefix function/,['knuth morris pratt','string searching']],\n [/\\bz\\b/,['z function']],[/hash/,['hashing']],[/\\bsos\\b/,['sum over subsets']],[/reroot/,['solving all roots']],[/pontes|bridges/,['bridges','bccs 2ccs']],\n [/articula/,['articulation']],[/persist/,['persistent']],[/li ?chao/,['li chao']],[/\\bhld\\b/,['heavy light decomposition']],\n [/\\bdsu\\b|union find/,['disjoint set union']],[/\\bfft\\b|\\bntt\\b/,['fast fourier transform']],[/suffix tree/,['string suffix structures']],\n [/\\bbit\\b|fenwick/,['fenwick'],['point update range sum']],[/sqrt|\\bmo\\b/,['square root decomposition','sqrt decomposition']],[/lazy/,['range update range query']],\n [/manacher/,['manacher']],[/dinic/,['dinic']],[/matching|emparelhamento/,['bipartite matching']],[/\\brmq\\b/,['sparse table']]];\nconst CFTAG=[[/flow|fluxo/,'flows'],[/2 ?sat/,'2-sat'],[/\\bfft\\b|\\bntt\\b/,'fft'],[/hash/,'hashing'],[/suffix|aho|kmp|prefix function/,'string suffix structures'],\n [/matching|emparelhamento/,'graph matchings'],[/\\bdsu\\b|union find/,'dsu'],[/geometr/,'geometry'],[/bitmask|\\bsos\\b/,'bitmasks'],[/shortest path|dijkstra/,'shortest paths'],\n [/meet in the middle/,'meet-in-the-middle'],[/chinese remainder|\\bcrt\\b/,'chinese remainder theorem'],[/game|jogo|nim|grundy/,'games'],[/matri/,'matrices'],\n [/ternary/,'ternary search'],[/probab/,'probabilities'],[/divide and conquer|d&c/,'divide and conquer']];\nfunction autoSrc(name){\n  const n=norm(name),words=n.split(' ').filter(w=>w&&!STOP.has(w));\n  const phrases=[];for(const a of ALIAS)if(a[0].test(n))for(const l of a.slice(1))for(const ph of l)phrases.push(ph.split(' '));\n  const score=title=>{const tt=new Set(norm(title).split(' ').filter(w=>w&&!STOP.has(w)));if(!tt.size)return 0;\n    const has=w=>tt.has(w)||tt.has(w+'s')||tt.has(w.replace(/s$/,''));\n    const h=words.filter(has).length;let b=words.length?(h/words.length+h/tt.size)/2:0;\n    if(phrases.some(ph=>ph.every(has)))b=Math.max(b,.9);return b};\n  const pick=list=>list.map(x=>[score(x.t),x]).filter(a=>a[0]>=.7).sort((a,b)=>b[0]-a[0]).slice(0,3).map(a=>a[1].p);\n  return {u:pick(INDEX.usaco),c:pick(INDEX.cpa),cf:CFTAG.filter(([r])=>r.test(n)).map(a=>a[1])};\n}\nconst srcTitle=(k,p)=>{const x=(k==='u'?INDEX.usaco:INDEX.cpa).find(y=>y.p===p);return(k==='u'?'USACO Guide: ':'cp-algorithms: ')+(x?x.t:p)};\nfunction judgeOf(u){const h=(u.match(/^https?:\\/\\/(?:www\\.|open\\.)?([^\\/]+)/)||[])[1]||'';\n  const M={'codeforces.com':'Codeforces','cses.fi':'CSES','atcoder.jp':'AtCoder','kattis.com':'Kattis','spoj.com':'SPOJ','onlinejudge.org':'UVa','judge.yosupo.jp':'Library Checker','usaco.org':'USACO','oj.uz':'oj.uz','acm.timus.ru':'Timus','codechef.com':'CodeChef','hackerrank.com':'HackerRank','e-olymp.com':'E-Olymp','lightoj.com':'LightOJ','dmoj.ca':'DMOJ','leetcode.com':'LeetCode','vjudge.net':'VJudge'};\n  return M[h]||h}\nasync function search(t){\n  if(!t.src)t.src=autoSrc(t.name);\n  const out=[],seen=new Set(),errs=[];\n  const add=c=>{if(!/^https?:/.test(c.url))return;const k=pkey(c.url);if(seen.has(k))return;seen.add(k);out.push(c)};\n  await Promise.all([\n   ...t.src.u.map(async p=>{try{\n      const j=await(await fetch('https://raw.githubusercontent.com/cpinitiative/usaco-guide/master/content/'+p)).json();\n      for(const[sec,list]of Object.entries(j))if(Array.isArray(list))for(const q of list)\n        add({judge:judgeOf(q.url)||q.source,name:q.name,url:q.url,lvl:Math.max(0,['','Very Easy','Easy','Normal','Hard','Very Hard','Insane'].indexOf(q.difficulty)),star:!!q.isStarred,from:'USACO Guide',rank:0});\n    }catch(e){errs.push('USACO Guide')}}),\n   ...t.src.c.map(async p=>{try{\n      const md=await(await fetch('https://raw.githubusercontent.com/cp-algorithms/cp-algorithms/main/src/'+p)).text();\n      const m=md.match(/^#+\\s*(?:Practice\\s+)?Problems?\\s*$([\\s\\S]*?)(?=^#+\\s)/im)||md.match(/^#+\\s*(?:Practice\\s+)?Problems?\\s*$([\\s\\S]*)/im);\n      if(m)for(const l of m[1].matchAll(/\\[([^\\]]+)\\]\\((https?:[^)\\s]+)\\)/g))add({judge:judgeOf(l[2]),name:l[1].replace(/^[^:\\-–]{2,22}\\s*[:\\-–]\\s+/,''),url:l[2],lvl:0,from:'cp-algorithms',rank:1});\n    }catch(e){errs.push('cp-algorithms')}}),\n   ...t.src.cf.map(async tag=>{try{\n      const r=await(await fetch('https://codeforces.com/api/problemset.problems?tags='+encodeURIComponent(tag))).json();\n      if(r.status!=='OK')throw 0;const sc={};for(const s of r.result.problemStatistics)sc[s.contestId+s.index]=s.solvedCount;\n      r.result.problems.filter(p=>p.rating>=T.set.cfMin&&p.rating\u003c=T.set.cfMax).sort((a,b)=>(sc[b.contestId+b.index]||0)-(sc[a.contestId+a.index]||0)).slice(0,25)\n       .forEach(p=>add({judge:'Codeforces',name:p.contestId+p.index+' '+p.name+' ('+p.rating+')',url:'https://codeforces.com/problemset/problem/'+p.contestId+'/'+p.index,\n         lvl:p.rating\u003c=1400?1:p.rating\u003c=1700?2:p.rating\u003c=2000?3:p.rating\u003c=2300?4:p.rating\u003c=2600?5:6,from:'Codeforces, tag '+tag,rank:2}));\n    }catch(e){errs.push('Codeforces')}})]);\n  out.sort((a,b)=>a.rank-b.rank||(a.lvl||3.5)-(b.lvl||3.5)||(b.star?1:0)-(a.star?1:0));\n  t.cands=out.slice(0,120);t.candAt=Date.now();t.candErr=errs.length?[...new Set(errs)].join(', '):'';save();\n}\nconst inPool=(t,c)=>t.probs.some(p=>pkey(p.url)===pkey(c.url));\nconst freeCands=t=>(t.cands||[]).filter(c=>!inPool(t,c)&&!solved.has(pkey(c.url))&&!t.skip.includes(pkey(c.url)));\n// Give the session a problem: an unused one from the technique's own list, otherwise a search result (harder at later stages).\nfunction assign(t,s){\n  if(sessProbs(t,s).length)return true;\n  const own=t.probs.find(p=>p.stage==null&&!p.done);\n  if(own){own.stage=s;if(s>=3)own.opt=true;save();return true}\n  const fc=freeCands(t).filter(c=>c.rank\u003c2||!freeCands(t).some(x=>x.rank\u003c2));\n  if(!fc.length)return false;\n  fc.sort((a,b)=>(a.lvl||3.5)-(b.lvl||3.5));\n  const c=fc[Math.min(fc.length-1,Math.floor(fc.length*Math.min(.9,[0,.35,.65][s]??(.65+.08*(s-2)))))];\n  t.probs.push({id:uid(),judge:c.judge,name:c.name,url:c.url,min:LMIN[c.lvl||0],note:'Proposto automaticamente ('+c.from+(c.lvl?', '+LVL[c.lvl]:'')+').',stage:s,done:null,auto:true,opt:s>=3});\n  save();return true;\n}\nconst pending=new Set();\nfunction ensure(t,s){ // returns false while a search is running for this technique\n  if(assign(t,s))return true;\n  if(t.cands&&Date.now()-t.candAt\u003c7*864e5)return true;\n  if(!pending.has(t.id)){pending.add(t.id);search(t).catch(()=>{}).then(()=>{pending.delete(t.id);if(!t.cands){t.cands=[];t.candAt=Date.now()}assign(t,s);render()})}\n  return false;\n}\n\n/* ---------- views ---------- */\nfunction probRow(t,p,extra){\n  return '\u003clabel class=\"cb\">\u003cinput type=\"checkbox\" data-act=\"tick\" data-t=\"'+t.id+'\" data-p=\"'+p.id+'\"'+(p.done?' checked':'')+'>\u003cspan class=\"'+(p.done?'done-t':'')+'\">'\n   +(p.opt?'\u003cspan class=\"mut small\">Opcional: \u003c/span>':'')+'\u003ca target=\"_blank\" rel=\"noopener\" href=\"'+esc(safe(p.url))+'\">'+esc((p.judge?p.judge+' – ':'')+p.name)+'\u003c/a>'\n   +(p.min?' \u003cspan class=\"mut small\">~'+p.min+' min\u003c/span>':'')+(p.note?'\u003cbr>\u003cspan class=\"small mut\">'+escc(p.note)+'\u003c/span>':'')+'\u003c/span>'+(extra||'')+'\u003c/label>';\n}\nfunction sessCard(t,s,o){\n  const ready=ensure(t,s),ps=sessProbs(t,s);\n  let h='\u003cdiv class=\"it\">\u003cspan class=\"k'+(o.late?' late':'')+'\">'+stageName(s)+'\u003c/span>\u003cb>'+esc(t.name)+'\u003c/b>'+(t.group?' \u003cspan class=\"mut small\">· '+esc(t.group)+'\u003c/span>':'')\n    +(o.late?' \u003cspan class=\"small\" style=\"color:var(--warn)\">em atraso desde '+fmtD(t.due)+'\u003c/span>':'');\n  if(s>=3)h+='\u003cdiv class=\"small\" style=\"margin-top:6px\">Reescrever de memória, sem consultar nada'+(t.tpl?': \u003ci>'+escc(t.tpl)+'\u003c/i>':'')+'. Submeter num problema já resolvido desta técnica; se falhar, anotar o bug. \u003cspan class=\"mut\">~25 min\u003c/span>\u003c/div>';\n  else if(t.tpl)h+='\u003cdiv class=\"small mut\" style=\"margin-top:6px\">De memória: '+escc(t.tpl)+'\u003c/div>';\n  h+=ps.map(p=>probRow(t,p,p.auto&&!p.done?' \u003cbutton class=\"sm\" data-act=\"swap\" data-t=\"'+t.id+'\" data-p=\"'+p.id+'\" title=\"Propor outro problema\">Trocar\u003c/button>':'')).join('');\n  if(!ps.length)h+='\u003cdiv class=\"small mut\" style=\"margin:6px 0\">'+(ready?'Sem problema proposto para esta técnica. \u003ca href=\"#\" data-act=\"goto\" data-t=\"'+t.id+'\">Procurar ou adicionar um\u003c/a>.':'A procurar problemas…')+'\u003c/div>';\n  h+='\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"pri\" data-act=\"done\" data-t=\"'+t.id+'\">Sessão feita\u003c/button>'\n    +'\u003cbutton data-act=\"weak\" data-t=\"'+t.id+'\" title=\"A próxima sessão desta técnica vem mais cedo\">Feita, mas consultei apontamentos\u003c/button>'\n    +'\u003cbutton data-act=\"later\" data-t=\"'+t.id+'\">Adiar 1 dia\u003c/button>\u003c/div>\u003c/div>';\n  return h;\n}\nconst EMPTY='\u003cdiv class=\"day\">\u003ch3>Ainda não tens técnicas\u003c/h3>\u003cdiv class=\"small mut\" style=\"margin:6px 0\">Adiciona as técnicas que queres manter frescas (separador «Técnicas» aqui em cima): a plataforma procura problemas e marca as sessões sozinha. Ou começa por uma lista de exemplo com 19 técnicas avançadas (sparse table, LCA, HLD, fluxos, strings…), já com problemas, que depois podes editar.\u003c/div>\u003cbutton class=\"pri\" data-act=\"example\">Carregar a lista de exemplo\u003c/button>\u003c/div>';\nfunction vToday(){\n  if(!T.techs.length)return EMPTY;\n  const pr=project(0),now=pr.filter(x=>x.real),ids=new Set(now.map(x=>x.t.id)),cu=capFn()(today),cap=cu.c,dn=doneToday(cu.unit);\n  const wait=active().filter(t=>t.due\u003c=today&&!ids.has(t.id)).sort((a,b)=>a.due\u003cb.due?-1:a.due>b.due?1:0);\n  let h='\u003cdiv class=\"day today\">\u003cdiv class=\"dh\">\u003ch3>Hoje, '+fmtD(today)+'\u003c/h3>\u003cspan class=\"mut small\">'+(cu.unit==='min'?'~'+dn+' de '+cap+' min de técnicas feitos hoje':dn+' de '+cap+' exercício(s) de técnicas feitos hoje')+'\u003c/span>\u003c/div>';\n  h+=now.length?now.map(x=>sessCard(x.t,x.s,{late:x.late})).join(''):'\u003cdiv class=\"it mut\">'+(cap\u003c=0?(cu.mode==='off'?'Semana com as técnicas em pausa (definido na página Início).':'Hoje o objetivo de técnicas é 0.'):wait.length?'Objetivo de hoje cumprido.':'Nada para hoje.')+'\u003c/div>';\n  h+='\u003c/div>';\n  if(cu.mode==='rev')h+='\u003cdiv class=\"small mut\" style=\"margin:6px 0\">Semana de «só revisões» (definido na página Início): as 1.ªs passagens ficam em espera.\u003c/div>';\n  if(wait.length)h+='\u003cdetails data-id=\"wait\">\u003csummary>Em espera: '+wait.length+' sessão(ões) que já venceram mas não cabem no objetivo de hoje\u003c/summary>'\n    +wait.map(t=>'\u003cdiv class=\"it\">\u003cspan class=\"k late\">'+stageName(t.stage)+'\u003c/span>'+esc(t.name)+' \u003cspan class=\"mut small\">desde '+fmtD(t.due)+'\u003c/span> \u003cbutton class=\"sm\" data-act=\"now\" data-t=\"'+t.id+'\">Fazer hoje\u003c/button>\u003c/div>').join('')\n    +'\u003cdiv class=\"small mut\" style=\"margin-top:8px\">Entram nos próximos dias com espaço, revisões antes de 1.ªs passagens. O tempo de técnicas de cada dia vem dos objetivos semanais da página Início.\u003c/div>\u003c/details>';\n  h+='\u003ch2>Próximos 7 dias\u003c/h2>'+calDays(1,7,true);\n  return h;\n}\nfunction calDays(from,to,brief){\n  const by={};for(const x of project(to))(by[x.d]=by[x.d]||[]).push(x);\n  let h='';\n  for(let i=from;i\u003c=to;i++){const d=addD(today,i),its=by[d];if(!its)continue;\n    h+='\u003cdiv class=\"day'+(d===today?' today':'')+'\">\u003cdiv class=\"dh\">\u003ch3>'+fmtD(d)+'\u003c/h3>\u003cspan class=\"mut small\">'+its.reduce((a,x)=>a+x.n,0)+' exercício(s) · ~'+Math.round(its.reduce((a,x)=>a+x.min,0)/5)*5+' min\u003c/span>\u003c/div>'\n     +its.map(x=>'\u003cdiv class=\"it\">\u003cspan class=\"k'+(x.late?' late':'')+'\">'+stageName(x.s)+'\u003c/span>'+esc(x.t.name)\n       +(x.real?'':' \u003cspan class=\"mut small\">(previsto, se as sessões anteriores forem feitas a tempo)\u003c/span>')\n       +(brief?'':sessProbs(x.t,x.s).map(p=>'\u003cdiv class=\"small\" style=\"margin-left:8px\">'+(p.done?'✓ ':'')+'\u003ca target=\"_blank\" rel=\"noopener\" href=\"'+esc(safe(p.url))+'\">'+esc((p.judge?p.judge+' – ':'')+p.name)+'\u003c/a>\u003c/div>').join(''))\n       +(x.real&&d>today?' \u003cbutton class=\"sm\" data-act=\"now\" data-t=\"'+x.t.id+'\">Fazer hoje\u003c/button>':'')+'\u003c/div>').join('')+'\u003c/div>'}\n  return h||'\u003cdiv class=\"mut\">Sem sessões neste período.\u003c/div>';\n}\nfunction vCal(){return '\u003cdiv class=\"small mut\">Sessões dos próximos 60 dias. Depois da Revisão 2, cada técnica volta em reescritas às cegas a cada '+T.set.maint.join(', ')+' dias (o último intervalo repete-se).\u003c/div>'+calDays(0,60,false)}\nfunction vTech(){\n  let h=(T.techs.length?'':EMPTY)+'\u003cdiv class=\"day\">\u003ch3>Adicionar técnica\u003c/h3>\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cinput type=\"text\" id=\"nname\" class=\"grow\" placeholder=\"Nome (ex.: Heavy-light decomposition)\">'\n   +'\u003cinput type=\"text\" id=\"ngroup\" placeholder=\"Grupo (opcional)\" style=\"width:170px\">\u003cbutton class=\"pri\" data-act=\"add\">Adicionar\u003c/button>\u003c/div>'\n   +'\u003cdiv class=\"small mut\" style=\"margin-top:6px\">A técnica entra no primeiro dia com espaço (abaixo do número de exercícios desse dia e sem outra 1.ª passagem) e a plataforma procura logo problemas para propor.\u003c/div>\u003c/div>';\n  h+=T.techs.map(t=>{\n    const d=t.probs.filter(p=>p.done).length;\n    let b='\u003cdetails data-id=\"'+t.id+'\">\u003csummary>'+esc(t.name)+' \u003cspan class=\"mut small\">'+(t.group?'· '+esc(t.group)+' ':'')+'· '\n      +(t.paused?'em pausa':stageName(t.stage)+' '+(t.due\u003ctoday?'em atraso':t.due===today?'hoje':'em '+fmtD(t.due)))+' · '+d+'/'+t.probs.length+' problemas\u003c/span>\u003c/summary>';\n    b+='\u003cdiv class=\"row\">\u003cdiv class=\"grow\">\u003cspan class=\"fld\">Nome\u003c/span>\u003cinput type=\"text\" style=\"width:100%\" data-f=\"name\" data-t=\"'+t.id+'\" value=\"'+esc(t.name)+'\">\u003c/div>'\n      +'\u003cdiv>\u003cspan class=\"fld\">Grupo\u003c/span>\u003cinput type=\"text\" data-f=\"group\" data-t=\"'+t.id+'\" value=\"'+esc(t.group||'')+'\">\u003c/div>'\n      +'\u003cdiv>\u003cspan class=\"fld\">Próxima sessão ('+stageName(t.stage)+')\u003c/span>\u003cinput type=\"date\" data-f=\"due\" data-t=\"'+t.id+'\" value=\"'+t.due+'\">\u003c/div>\u003c/div>'\n      +'\u003cspan class=\"fld\">O que reescrever de memória\u003c/span>\u003cinput type=\"text\" style=\"width:100%\" data-f=\"tpl\" data-t=\"'+t.id+'\" value=\"'+esc(t.tpl||'')+'\" placeholder=\"ex.: HLD com segment tree, query de caminho e de subárvore\">'\n      +'\u003cspan class=\"fld\">Bugs típicos (um por linha; lê só depois de submeter)\u003c/span>\u003ctextarea data-f=\"bugs\" data-t=\"'+t.id+'\">'+esc(t.bugs.join('\\n'))+'\u003c/textarea>';\n    b+='\u003cdiv class=\"it\">\u003cb>Problemas\u003c/b>'+(t.probs.length?'':' \u003cspan class=\"mut small\">nenhum ainda\u003c/span>')\n      +t.probs.map(p=>probRow(t,p,' \u003cspan class=\"k\">'+(p.stage==null?'livre':stageName(p.stage))+'\u003c/span>\u003cbutton class=\"sm del\" data-act=\"rmp\" data-t=\"'+t.id+'\" data-p=\"'+p.id+'\" title=\"Remover\">✕\u003c/button>')).join('')\n      +'\u003cdiv class=\"row\" style=\"margin-top:6px\">\u003cinput type=\"text\" class=\"grow\" id=\"pn-'+t.id+'\" placeholder=\"Nome do problema\">\u003cinput type=\"text\" class=\"grow\" id=\"pu-'+t.id+'\" placeholder=\"Ligação\">\u003cbutton data-act=\"addp\" data-t=\"'+t.id+'\">Adicionar problema\u003c/button>\u003c/div>\u003c/div>';\n    const src=t.src||autoSrc(t.name);\n    b+='\u003cdiv class=\"it\">\u003cb>Procurar problemas\u003c/b>\u003cdiv style=\"margin:6px 0\">'\n      +src.u.map(p=>'\u003cspan class=\"chip\">'+esc(srcTitle('u',p))+'\u003cbutton data-act=\"rmsrc\" data-t=\"'+t.id+'\" data-k=\"u\" data-v=\"'+esc(p)+'\">✕\u003c/button>\u003c/span>').join('')\n      +src.c.map(p=>'\u003cspan class=\"chip\">'+esc(srcTitle('c',p))+'\u003cbutton data-act=\"rmsrc\" data-t=\"'+t.id+'\" data-k=\"c\" data-v=\"'+esc(p)+'\">✕\u003c/button>\u003c/span>').join('')\n      +(src.u.length+src.c.length?'':'\u003cspan class=\"mut small\">Nenhuma página encontrada automaticamente para este nome. Escolhe uma abaixo. \u003c/span>')+'\u003c/div>'\n      +'\u003cdiv class=\"row\">\u003cinput type=\"text\" class=\"grow\" list=\"srcs\" id=\"as-'+t.id+'\" placeholder=\"Juntar página do USACO Guide ou cp-algorithms (escreve para procurar)\">\u003cbutton data-act=\"addsrc\" data-t=\"'+t.id+'\">Juntar\u003c/button>\u003c/div>'\n      +'\u003cdiv class=\"row\" style=\"margin-top:6px\">\u003cspan class=\"small mut\">Tags do Codeforces (separadas por vírgulas):\u003c/span>\u003cinput type=\"text\" class=\"grow\" data-f=\"cf\" data-t=\"'+t.id+'\" value=\"'+esc(src.cf.join(', '))+'\" placeholder=\"ex.: flows\">'\n      +'\u003cbutton class=\"pri\" data-act=\"search\" data-t=\"'+t.id+'\">'+(pending.has(t.id)?'A procurar…':'Procurar')+'\u003c/button>\u003c/div>';\n    if(t.cands){const cs=t.cands.filter(c=>!inPool(t,c));\n      b+='\u003cdiv class=\"small mut\" style=\"margin-top:8px\">'+t.cands.length+' problema(s) encontrados'+(t.candErr?' · falhou: '+esc(t.candErr):'')+'. Os que não adicionares continuam a servir para propostas automáticas.\u003c/div>'\n       +cs.slice(0,t.more?200:15).map((c,i)=>{const sv=solved.has(pkey(c.url));return '\u003cdiv class=\"row small\" style=\"margin:4px 0\">\u003cbutton class=\"sm\" data-act=\"addc\" data-t=\"'+t.id+'\" data-u=\"'+esc(c.url)+'\">Adicionar\u003c/button>'\n         +'\u003cspan class=\"grow\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"'+esc(c.url)+'\">'+esc((c.judge?c.judge+' – ':'')+c.name)+'\u003c/a> \u003cspan class=\"mut\">'+LVL[c.lvl||0]+(c.star?' ★':'')+' · '+esc(c.from)+'\u003c/span>'\n         +(sv?' \u003cspan class=\"k okk\">já resolvido\u003c/span>':'')+'\u003c/span>\u003c/div>'}).join('')\n       +(cs.length>15&&!t.more?'\u003cbutton class=\"sm\" data-act=\"more\" data-t=\"'+t.id+'\">Mostrar todos ('+cs.length+')\u003c/button>':'')}\n    b+='\u003c/div>';\n    if(t.log.length)b+='\u003cdiv class=\"it small mut\">\u003cb>Histórico:\u003c/b> '+t.log.map(l=>stageName(l.s)+' '+fmtD(l.d)+(l.ok?'':' (com consulta)')).join(' · ')+'\u003c/div>';\n    b+='\u003cdiv class=\"it row\">\u003cbutton data-act=\"pause\" data-t=\"'+t.id+'\">'+(t.paused?'Retomar':'Pôr em pausa')+'\u003c/button>\u003cbutton data-act=\"restart\" data-t=\"'+t.id+'\">Recomeçar do início\u003c/button>\u003cbutton class=\"del\" data-act=\"rm\" data-t=\"'+t.id+'\">Remover técnica\u003c/button>\u003c/div>\u003c/details>';\n    return b}).join('');\n  h+='\u003ch2>Definições\u003c/h2>\u003cdiv class=\"day\">\u003cdiv class=\"row\">'\n   +'\u003cdiv>\u003cspan class=\"fld\">Dias até Revisão 1 e Revisão 2\u003c/span>\u003cinput type=\"text\" data-s=\"gaps\" value=\"'+T.set.gaps.join(', ')+'\" style=\"width:150px\">\u003c/div>'\n   +'\u003cdiv>\u003cspan class=\"fld\">Intervalos das reescritas (dias)\u003c/span>\u003cinput type=\"text\" data-s=\"maint\" value=\"'+T.set.maint.join(', ')+'\" style=\"width:170px\">\u003c/div>'\n   +'\u003cdiv>\u003cspan class=\"fld\">Rating no Codeforces (mín.–máx.)\u003c/span>\u003cinput type=\"number\" data-s=\"cfMin\" value=\"'+T.set.cfMin+'\" style=\"width:85px\"> \u003cinput type=\"number\" data-s=\"cfMax\" value=\"'+T.set.cfMax+'\" style=\"width:85px\">\u003c/div>\u003c/div>'\n   +'\u003cdiv class=\"small mut\" style=\"margin-top:6px\">'+(T.swerc?'As técnicas do plano SWERC mantêm as datas originais até à reescrita de dezembro; a partir daí seguem estes intervalos. ':'')+'O tempo de técnicas por dia define-se nos objetivos semanais (Início) e, por omissão, em Definições.\u003c/div>\u003c/div>';\n  return h;\n}\nfunction vRules(){return `\u003ch2>Como funciona\u003c/h2>\u003cul>\n\u003cli>\u003cb>Lista de técnicas.\u003c/b> No separador \"Técnicas\" adicionas, editas, pões em pausa ou removes técnicas. O plano é recalculado sozinho.\u003c/li>\n\u003cli>\u003cb>Ciclo de cada técnica.\u003c/b> 1.ª passagem (problema direto) → Revisão 1 (${T.set.gaps[0]} dias depois, problema novo) → Revisão 2 (${T.set.gaps[1]} dias depois, problema mais difícil) → reescritas às cegas a cada ${T.set.maint.join(', ')} dias, para sempre (o último intervalo repete-se).\u003c/li>\n\u003cli>\u003cb>Exercícios por dia.\u003c/b> Cada dia leva no máximo o número de exercícios de técnicas definido nos objetivos semanais da página Início (um problema = um exercício; uma reescrita = um exercício). O que não couber fica em espera e passa para o dia seguinte com espaço, revisões primeiro. O botão «Fazer hoje» ignora o limite.\u003c/li>\n\u003cli>\u003cb>Datas reais, não fixas.\u003c/b> A sessão seguinte é marcada a partir do dia em que fazes a anterior. Se disseres \"consultei apontamentos\", a seguinte vem a um terço do intervalo e a reescrita não avança de nível.\u003c/li>\n\u003cli>\u003cb>Problemas propostos.\u003c/b> A plataforma procura em páginas do USACO Guide e do cp-algorithms com o nome da técnica e, se indicares tags, no Codeforces. Não propõe problemas que já resolveste no Codeforces (pelo handle) nem no CSES (pela importação do Diário). \"Trocar\" pede outra proposta.\u003c/li>\n\u003cli>\u003cb>A correspondência é pelo nome.\u003c/b> Confirma em \"Procurar problemas\" que as páginas escolhidas são mesmo da técnica; se não forem, tira-as e junta a certa. Não verifiquei problema a problema que cada proposta encaixa na técnica.\u003c/li>\u003c/ul>\n\u003ch2>Regras de treino\u003c/h2>\u003cul>\n\u003cli>\u003cb>Sem template e sem IA.\u003c/b> Em cada sessão escreve a técnica de raiz, de memória. Só consultas apontamentos depois de 10 minutos bloqueado, e nesse caso marca a sessão como \"consultei apontamentos\".\u003c/li>\n\u003cli>\u003cb>Depurar sozinho antes de pedir ajuda.\u003c/b> Quando der WA: (1) escreve um brute force e um gerador de casos pequenos e faz stress test; (2) só depois abre os bugs típicos da técnica e confere um a um. IA só depois de 30 minutos disto.\u003c/li>\n\u003cli>\u003cb>Registo de bugs.\u003c/b> Acrescenta cada bug novo à lista de bugs típicos da técnica (ou ao Diário) e relê-a antes de cada revisão.\u003c/li>\n\u003cli>\u003cb>Se falhares um dia\u003c/b>, faz primeiro as sessões em atraso (dependem do espaçamento) e adia a 1.ª passagem mais recente.\u003c/li>\u003c/ul>`}\n\nlet v='today';\nfunction render(){\n  const view=document.getElementById('view');\n  const open=[...view.querySelectorAll('details[open]')].map(d=>d.dataset.id),y=scrollY,foc=document.activeElement&&document.activeElement.id,val=foc&&document.activeElement.value;\n  const keep={};view.querySelectorAll('input[id]').forEach(i=>{if(i.value)keep[i.id]=i.value});\n  view.innerHTML=v==='today'?vToday():v==='cal'?vCal():v==='tech'?vTech():vRules();\n  view.querySelectorAll('details').forEach(d=>{if(open.includes(d.dataset.id))d.open=true});\n  for(const id in keep){const i=document.getElementById(id);if(i)i.value=keep[id]}\n  if(foc){const f=document.getElementById(foc);if(f)f.focus()}\n  scrollTo(0,y);\n  const a=active(),late=a.filter(t=>t.due\u003ctoday).length,p0=project(0).filter(x=>x.real),td=p0.length;\n  try{localStorage.setItem('cptech.today',JSON.stringify({d:today,mode:capFn()(today).mode,cap:capFn()(today).c,unit:capFn()(today).unit,done:doneToday(capFn()(today).unit),wait:a.filter(t=>t.due\u003c=today).length-td,items:p0.map(x=>({id:x.t.id,name:x.t.name,stage:stageName(x.s),late:x.late,min:leftMin(x.t,x.s),probs:sessProbs(x.t,x.s).map(p=>({name:(p.judge?p.judge+' – ':'')+p.name,url:p.url,done:!!p.done,opt:!!p.opt}))}))}))}catch(e){}\n  document.getElementById('sub').textContent=T.techs.length+' técnicas · '+td+' sessão(ões) para hoje'+(late?' · '+late+' em atraso':'');\n  const tot=a.length*3,dn=a.reduce((s,t)=>s+Math.min(3,t.stage),0);\n  document.getElementById('pb').style.width=(tot?100*dn/tot:0)+'%';\n  document.getElementById('pt').textContent=a.filter(t=>t.stage>=3).length+' de '+a.length+' técnicas já em manutenção (1.ª passagem e duas revisões feitas)';\n  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));\n}\ndocument.querySelector('.tabs').onclick=e=>{if(e.target.dataset.v){v=e.target.dataset.v;render();scrollTo(0,0)}};\nconst view=document.getElementById('view');\nview.addEventListener('click',e=>{\n  const b=e.target.closest('[data-act]');if(!b||b.type==='checkbox')return;\n  const act=b.dataset.act,t=tech(b.dataset.t);\n  if(b.tagName==='A')e.preventDefault();\n  if(act==='example'){T.techs=migrate(false).techs;save();v='tech';render();return}\n  if(act==='done')complete(t,true);\n  else if(act==='weak')complete(t,false);\n  else if(act==='later'){t.due=addD(today,1);delete t.pin;save()}\n  else if(act==='now'){if(t.due>today)t.due=today;t.pin=today;save()}\n  else if(act==='swap'){const p=t.probs.find(x=>x.id===b.dataset.p);t.skip.push(pkey(p.url));t.probs=t.probs.filter(x=>x!==p);save()}\n  else if(act==='goto'){v='tech';render();const d=view.querySelector('details[data-id=\"'+t.id+'\"]');if(d){d.open=true;d.scrollIntoView()}return}\n  else if(act==='add'){const n=document.getElementById('nname').value.trim();if(!n)return;\n    const nt={id:uid(),name:n,group:document.getElementById('ngroup').value.trim(),tpl:'',bugs:[],added:today,stage:0,due:firstFreeDay(),fixed:{},log:[],probs:[],skip:[]};\n    T.techs.push(nt);save();document.getElementById('nname').value='';document.getElementById('ngroup').value='';ensure(nt,0);\n    render();const d=view.querySelector('details[data-id=\"'+nt.id+'\"]');if(d){d.open=true;d.scrollIntoView()}return}\n  else if(act==='rm'){if(!confirm('Remover \"'+t.name+'\" e o histórico dela?'))return;T.techs=T.techs.filter(x=>x!==t);save()}\n  else if(act==='pause'){t.paused=!t.paused;if(!t.paused&&t.due\u003ctoday)t.due=today;save()}\n  else if(act==='restart'){if(!confirm('Recomeçar \"'+t.name+'\" na 1.ª passagem?'))return;t.stage=0;t.fixed={};t.due=firstFreeDay();save()}\n  else if(act==='rmp'){t.probs=t.probs.filter(x=>x.id!==b.dataset.p);save()}\n  else if(act==='addp'){const n=document.getElementById('pn-'+t.id),u=document.getElementById('pu-'+t.id);if(!n.value.trim()&&!u.value.trim())return;\n    t.probs.push({id:uid(),judge:judgeOf(u.value.trim()),name:n.value.trim()||u.value.trim(),url:u.value.trim(),min:45,note:'',stage:null,done:null});n.value='';u.value='';save()}\n  else if(act==='addc'){const c=t.cands.find(x=>x.url===b.dataset.u);if(c&&!inPool(t,c)){t.probs.push({id:uid(),judge:c.judge,name:c.name,url:c.url,min:LMIN[c.lvl||0],note:c.from+(c.lvl?', '+LVL[c.lvl]:''),stage:null,done:null});save()}}\n  else if(act==='more'){t.more=true}\n  else if(act==='rmsrc'){t.src=t.src||autoSrc(t.name);t.src[b.dataset.k]=t.src[b.dataset.k].filter(x=>x!==b.dataset.v);save()}\n  else if(act==='addsrc'){const i=document.getElementById('as-'+t.id),val=i.value.trim();t.src=t.src||autoSrc(t.name);\n    const u=INDEX.usaco.find(x=>'USACO Guide: '+x.t===val),c=INDEX.cpa.find(x=>'cp-algorithms: '+x.t===val);\n    if(u&&!t.src.u.includes(u.p))t.src.u.push(u.p);else if(c&&!t.src.c.includes(c.p))t.src.c.push(c.p);else if(!u&&!c){alert('Escolhe uma página da lista de sugestões.');return}\n    i.value='';save()}\n  else if(act==='search'){t.src=t.src||autoSrc(t.name);pending.add(t.id);render();search(t).catch(()=>{}).then(()=>{pending.delete(t.id);render()});return}\n  render();\n});\nview.addEventListener('change',e=>{\n  const el=e.target;\n  if(el.dataset.act==='tick'){const t=tech(el.dataset.t),p=t.probs.find(x=>x.id===el.dataset.p);p.done=el.checked?today:null;save();render();return}\n  if(el.dataset.f){const t=tech(el.dataset.t),f=el.dataset.f;\n    if(f==='bugs')t.bugs=el.value.split('\\n').map(x=>x.trim()).filter(Boolean);\n    else if(f==='cf'){t.src=t.src||autoSrc(t.name);t.src.cf=el.value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean)}\n    else if(f==='due'){if(el.value)t.due=el.value}\n    else if(f==='name'){if(el.value.trim())t.name=el.value.trim()}\n    else t[f]=el.value.trim();\n    save();if(f!=='bugs'&&f!=='tpl'&&f!=='cf')render();return}\n  if(el.dataset.s){const k=el.dataset.s;\n    if(k==='gaps'||k==='maint'){const a=el.value.split(',').map(x=>parseInt(x,10)).filter(x=>x>0);if(a.length>=(k==='gaps'?2:1))T.set[k]=k==='gaps'?a.slice(0,2):a}\n    else{const n=parseInt(el.value,10);if(n>0)T.set[k]=n}\n    save();render()}\n});\ndocument.getElementById('srcs').innerHTML=INDEX.usaco.map(x=>'\u003coption value=\"'+esc('USACO Guide: '+x.t)+'\">').join('')+INDEX.cpa.map(x=>'\u003coption value=\"'+esc('cp-algorithms: '+x.t)+'\">').join('');\nload();save();render();loadSolved();\n// another tab changed the weekly goals: recompute\nlet lastCoach=localStorage.getItem('cpcoach.v1');\nfunction request(){ // the statistics page asked to add a technique for a weak tag\n  let r=null;try{r=JSON.parse(localStorage.getItem('cptech.req'))}catch(e){}\n  if(!r||!r.name)return;localStorage.removeItem('cptech.req');\n  v='tech';render();const i=document.getElementById('nname');if(i){i.value=r.name;i.focus();scrollTo(0,0)}\n}\nfunction refresh(){request();if(Date.now()-solvedAt>2*60e3)loadSolved();const c=localStorage.getItem('cpcoach.v1');if(c===lastCoach)return;lastCoach=c;render()}\nrequest();\naddEventListener('storage',e=>{if(e.key==='cpcoach.v1')refresh()});\naddEventListener('message',e=>{if(e.data==='cptools-refresh')refresh()});\n\u003c/script>\u003c/body>\u003c/html>\n", "trainer": "\u003c!DOCTYPE html>\n\u003chtml lang=\"pt\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Codeforces Trainer\u003c/title>\n\u003cstyle>\n  :root {\n    --bg: #0f1117; --card: #1a1d27; --card2: #222635; --text: #e8eaf0;\n    --muted: #9aa0b0; --accent: #4f8ef7; --green: #3fb950; --red: #f85149;\n    --yellow: #d29922; --border: #2d3242;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }\n  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }\n  h1 { font-size: 1.6rem; margin-bottom: 4px; }\n  .sub { color: var(--muted); margin-bottom: 20px; font-size: .95rem; }\n  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }\n  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }\n  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }\n  input, select { background: var(--card2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: .95rem; }\n  input:focus, select:focus { outline: 1px solid var(--accent); }\n  button { background: var(--accent); color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-size: .95rem; cursor: pointer; font-weight: 600; }\n  button:hover { filter: brightness(1.1); }\n  button:disabled { opacity: .5; cursor: not-allowed; }\n  button.secondary { background: var(--card2); border: 1px solid var(--border); }\n  button.danger { background: var(--red); }\n  button.success { background: var(--green); }\n  .rating-box { display: flex; align-items: baseline; gap: 10px; }\n  .rating-value { font-size: 2.4rem; font-weight: 700; color: var(--accent); }\n  .problems { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }\n  .problem-card { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color .15s; }\n  .problem-card:hover { border-color: var(--accent); }\n  .problem-card .diff { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }\n  .diff.easy { color: var(--green); } .diff.medium { color: var(--yellow); } .diff.hard { color: var(--red); }\n  .problem-card .prating { font-size: 1.5rem; font-weight: 700; margin: 6px 0; }\n  .problem-card .delta { font-size: .8rem; color: var(--muted); }\n  .timer { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; margin: 10px 0; }\n  .timer.warn { color: var(--yellow); } .timer.late { color: var(--red); }\n  a { color: var(--accent); }\n  table { width: 100%; border-collapse: collapse; font-size: .9rem; }\n  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }\n  th { color: var(--muted); font-weight: 600; font-size: .8rem; }\n  .pos { color: var(--green); } .neg { color: var(--red); }\n  .hidden { display: none; }\n  .status { color: var(--muted); font-size: .9rem; margin-top: 8px; min-height: 1.2em; }\n  .center { text-align: center; }\n  .prob-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 4px; }\n  .tag-note { font-size: .8rem; color: var(--muted); }\n  details summary { cursor: pointer; font-weight: 600; color: var(--muted); font-size: .9rem; }\n  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }\n  .chips label { display: inline-flex; align-items: center; gap: 5px; background: var(--card2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: .85rem; color: var(--text); cursor: pointer; margin: 0; }\n  .chips label:has(input:checked) { border-color: var(--accent); background: rgba(79,142,247,.15); }\n\u003c/style>\n\u003cstyle>\n/* one look for every tool */\n:root{--bg:#0f1317;--card:#171c22;--card2:#1e252d;--panel:#171c22;--panel2:#1e252d;--line:#2a3138;--border:#2a3138;--text:#e6e9ec;--fg:#e6e9ec;--muted:#98a2ad;--mut:#98a2ad;--accent:#6cb0ff;--acc:#6cb0ff;--ok:#56c271;--green:#56c271;--warn:#e5a84b;--yellow:#e5a84b;--bad:#ef6b73;--red:#ef6b73}\nbody{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:15px}\n.container{max-width:980px;padding:20px}\n\u003c/style>\u003cbase target=\"_blank\">\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container\">\n  \u003ch1>Codeforces Trainer\u003c/h1>\n  \u003cp class=\"sub\">Escolhe um problema, resolve dentro do tempo limite e o teu rating interno atualiza-se (estilo Elo).\u003c/p>\n\n  \u003c!-- Settings / rating -->\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"row\" style=\"justify-content: space-between;\">\n      \u003cdiv class=\"rating-box\">\n        \u003cdiv>\n          \u003clabel>Rating interno\u003c/label>\n          \u003cdiv class=\"rating-value\" id=\"ratingDisplay\">1200\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cdiv>\n          \u003clabel>Handle do Codeforces\u003c/label>\n          \u003cinput id=\"handle\" placeholder=\"ex: tourist\" size=\"14\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>Tempo limite (min)\u003c/label>\n          \u003cinput id=\"timeLimit\" type=\"number\" value=\"40\" min=\"5\" max=\"180\" style=\"width:80px\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>Contest virtual (min)\u003c/label>\n          \u003cinput id=\"contestLimit\" type=\"number\" value=\"120\" min=\"15\" max=\"300\" style=\"width:80px\">\n        \u003c/div>\n        \u003cbutton class=\"secondary\" id=\"resetBtn\" title=\"Repõe o rating inicial (escolhido em Definições) e limpa o histórico\">Recomeçar\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- Problem selection -->\n  \u003cdiv class=\"card\" id=\"pickCard\">\n    \u003cdiv class=\"row\" style=\"justify-content: space-between;\">\n      \u003cdiv>\u003cb>Novo treino\u003c/b>\u003cdiv class=\"tag-note\">3 problemas com dificuldades diferentes, escolhidos aleatoriamente do problemset (exclui os que já resolveste, se indicares o handle).\u003c/div>\u003c/div>\n      \u003cbutton id=\"newBtn\">Gerar problemas\u003c/button>\n    \u003c/div>\n    \u003cdetails id=\"filtersBox\" style=\"margin-top:12px;\">\n      \u003csummary>Filtros de problemas \u003cspan id=\"filterSummary\" class=\"tag-note\">\u003c/span>\u003c/summary>\n      \u003cdiv style=\"margin-top:8px;\">\n        \u003clabel>Tipo de contest\u003c/label>\n        \u003cdiv class=\"chips\" id=\"typeChips\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"row\" style=\"margin-top:12px;\">\n        \u003cdiv>\n          \u003clabel>Contests a partir de (data)\u003c/label>\n          \u003cinput id=\"minDate\" type=\"date\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel>ou número do contest ≥\u003c/label>\n          \u003cinput id=\"minContestId\" type=\"number\" min=\"1\" placeholder=\"ex: 1500\" style=\"width:110px\">\n        \u003c/div>\n        \u003cdiv>\u003clabel>Tags do Codeforces (separadas por vírgulas)\u003c/label>\u003cinput id=\"tagsInput\" type=\"text\" placeholder=\"ex: dp, graphs\" style=\"width:220px\">\u003c/div>\n        \u003cbutton class=\"secondary\" id=\"clearFiltersBtn\">Limpar filtros\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"tag-note\" style=\"margin-top:8px;\">Se um contest não tiver data conhecida, usa-se o número do contest como critério. Se nenhum problema cumprir os filtros, são ignorados para essa dificuldade.\u003c/div>\n    \u003c/details>\n    \u003cdiv class=\"problems\" id=\"problemChoices\">\u003c/div>\n    \u003cdiv class=\"row hidden\" id=\"contestStartRow\" style=\"margin-top:12px; justify-content:center;\">\n      \u003cbutton id=\"contestBtn\">Começar Contest Virtual (os 3 problemas)\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"status\" id=\"pickStatus\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- Active session -->\n  \u003cdiv class=\"card hidden\" id=\"activeCard\">\n    \u003cdiv class=\"center\">\n      \u003cdiv class=\"prob-title\" id=\"activeTitle\">\u003c/div>\n      \u003cdiv class=\"tag-note\" id=\"activeMeta\">\u003c/div>\n      \u003cdiv class=\"timer\" id=\"timer\">00:00\u003c/div>\n      \u003cdiv class=\"tag-note\" id=\"waCount\" style=\"margin-bottom:8px;\">\u003c/div>\n      \u003cdiv class=\"row\" style=\"justify-content:center;\">\n        \u003cbutton class=\"success\" id=\"solvedBtn\">Resolvi ✔\u003c/button>\n        \u003cbutton class=\"danger\" id=\"failBtn\">Desisto ✘\u003c/button>\n        \u003cbutton class=\"secondary\" id=\"waBtn\">+1 WA\u003c/button>\n        \u003cbutton class=\"secondary\" id=\"checkBtn\">Verificar submissão no CF\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"status\" id=\"activeStatus\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- Virtual contest -->\n  \u003cdiv class=\"card hidden\" id=\"contestCard\">\n    \u003cdiv class=\"center\">\n      \u003cb>Contest Virtual\u003c/b>\n      \u003cdiv class=\"timer\" id=\"contestTimer\">00:00\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"contestProblems\">\u003c/div>\n    \u003cdiv class=\"row\" style=\"justify-content:center; margin-top:12px;\">\n      \u003cbutton class=\"secondary\" id=\"contestCheckBtn\">Verificar submissões no CF\u003c/button>\n      \u003cbutton class=\"danger\" id=\"contestEndBtn\">Terminar contest\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"status\" id=\"contestStatus\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- Stats -->\n  \u003cdiv class=\"card\" id=\"statsCard\">\n    \u003cb>Estatísticas\u003c/b>\n    \u003cdiv class=\"row\" id=\"statsRow\" style=\"margin-top:10px; gap:24px;\">\u003c/div>\n    \u003cdiv id=\"chartWrap\" style=\"margin-top:14px;\">\u003c/div>\n  \u003c/div>\n\n  \u003c!-- History -->\n  \u003cdiv class=\"card\">\n    \u003cb>Histórico\u003c/b>\n    \u003ctable id=\"historyTable\">\n      \u003cthead>\u003ctr>\u003cth>Data\u003c/th>\u003cth>Problema\u003c/th>\u003cth>Rating do problema\u003c/th>\u003cth>Resultado\u003c/th>\u003cth>Tempo\u003c/th>\u003cth>Δ Rating\u003c/th>\u003cth>Novo rating\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody id=\"historyBody\">\u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\n  const LS_KEY = 'cfTrainerState';\n  const K = 32;                 // fator K do Elo\n  // intervalos de offsets relativos ao rating interno; o offset concreto é aleatório\n  const OFFSET_RANGES = [[-350, -100], [-100, 100], [100, 350]]; // easy / medium / hard\n  const DIFF_NAMES = ['easy', 'medium', 'hard'];\n  const DIFF_LABELS = ['Fácil', 'Médio', 'Difícil'];\n  const CONTEST_TYPES = [\n    ['div1', 'Div. 1'], ['div2', 'Div. 2'], ['div12', 'Div. 1 + 2'], ['div3', 'Div. 3'],\n    ['div4', 'Div. 4'], ['edu', 'Educational'], ['global', 'Global'], ['other', 'Outros'],\n  ];\n  const DEFAULT_FILTERS = { types: CONTEST_TYPES.map(([k]) => k), minDate: '', minContestId: '' };\n\n  let state = load();\n  let problemset = null;        // cache dos problemas do CF\n  let contests = null;          // id -> { name, start (ms|null), type }\n  let solvedSet = new Set();    // problemas já resolvidos pelo handle\n  let active = null;            // { problem, diffIdx, startTs, limitMs, wa, endTs }\n  let contest = null;           // { entries: [{p, diffIdx, solved, elapsedMs, wa}], startTs, limitMs }\n  let lastPicks = null;         // últimos 3 problemas gerados\n  let tickInterval = null;\n  let contestInterval = null;\n\n  function load() {\n    try {\n      const s = JSON.parse(localStorage.getItem(LS_KEY));\n      if (s && typeof s.rating === 'number') {\n        // compatibilidade com estados antigos: preenche campos em falta sem perder progresso\n        s.history = Array.isArray(s.history) ? s.history : [];\n        s.filters = Object.assign({}, DEFAULT_FILTERS, s.filters || {});\n        if (!Array.isArray(s.filters.types)) s.filters.types = DEFAULT_FILTERS.types.slice();\n        return s;\n      }\n    } catch (e) {}\n    return { rating: 1200, startRating: 1200, history: [], handle: '', timeLimit: 40, filters: Object.assign({}, DEFAULT_FILTERS) };\n  }\n  function sharedHandle(h) {\n    try { const p = JSON.parse(localStorage.getItem('cptools.profile')) || {}; if (h === undefined) return p.handle || ''; p.handle = h; localStorage.setItem('cptools.profile', JSON.stringify(p)); } catch (e) {} return '';\n  }\n  function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }\n\n  // ---------- Elo ----------\n  function expectedScore(playerR, problemR) {\n    return 1 / (1 + Math.pow(10, (problemR - playerR) / 400));\n  }\n  // pontuação em função do tempo e das tentativas erradas (WA):\n  // resolver rápido vale ~1.0, resolver perto do limite vale ~0.6;\n  // cada WA multiplica o score por 0.85; falhar vale 0\n  function scoreFor(solved, elapsedMs, limitMs, wa) {\n    if (!solved) return 0;\n    const frac = Math.min(1, Math.max(0, elapsedMs / limitMs));\n    return (1 - 0.4 * frac) * Math.pow(0.85, wa || 0);\n  }\n  function deltaFor(baseRating, problem, solved, elapsedMs, limitMs, wa) {\n    const exp = expectedScore(baseRating, problem.rating);\n    return Math.round(K * (scoreFor(solved, elapsedMs, limitMs, wa) - exp));\n  }\n  function pushHistory(problem, solved, diffIdx, elapsedMs, wa, delta) {\n    state.history.unshift({\n      ts: Date.now(),\n      name: `${problem.contestId}${problem.index} — ${problem.name}`,\n      url: problemUrl(problem),\n      problemRating: problem.rating,\n      diffIdx, elapsedMs, wa: wa || 0,\n      solved, delta, newRating: state.rating,\n    });\n  }\n  function applyResult(problem, solved, diffIdx, elapsedMs, limitMs, wa) {\n    const delta = deltaFor(state.rating, problem, solved, elapsedMs, limitMs, wa);\n    state.rating = Math.max(0, state.rating + delta);\n    pushHistory(problem, solved, diffIdx, elapsedMs, wa, delta);\n    save();\n    render();\n  }\n\n  // ---------- Codeforces API ----------\n  async function api(path) {\n    const res = await fetch('https://codeforces.com/api/' + path);\n    const data = await res.json();\n    if (data.status !== 'OK') throw new Error(data.comment || 'Erro na API do Codeforces');\n    return data.result;\n  }\n  async function loadProblemset() {\n    if (problemset) return problemset;\n    setStatus('pickStatus', 'A carregar problemset do Codeforces…');\n    const result = await api('problemset.problems');\n    problemset = result.problems.filter(p => p.rating && p.contestId);\n    return problemset;\n  }\n  async function loadSolved(handle) {\n    if (!handle) return;\n    try {\n      const subs = await api(`user.status?handle=${encodeURIComponent(handle)}`);\n      solvedSet = new Set(subs.filter(s => s.verdict === 'OK')\n        .map(s => s.problem.contestId + s.problem.index));\n    } catch (e) { /* handle inválido: ignora */ }\n  }\n\n  function classifyContest(name) {\n    const d1 = /Div\\. ?1/i.test(name), d2 = /Div\\. ?2/i.test(name);\n    if (d1 && d2) return 'div12';\n    if (d1) return 'div1';\n    if (d2) return 'div2';\n    if (/Div\\. ?3/i.test(name)) return 'div3';\n    if (/Div\\. ?4/i.test(name)) return 'div4';\n    if (/Educational/i.test(name)) return 'edu';\n    if (/Global Round/i.test(name)) return 'global';\n    return 'other';\n  }\n  async function loadContests
