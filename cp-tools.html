() {\n    if (contests) return contests;\n    setStatus('pickStatus', 'A carregar lista de contests do Codeforces…');\n    try {\n      const list = await api('contest.list?gym=false');\n      contests = new Map(list.map(c => [c.id, {\n        name: c.name,\n        start: c.startTimeSeconds ? c.startTimeSeconds * 1000 : null,\n        type: classifyContest(c.name),\n      }]));\n    } catch (e) {\n      contests = new Map(); // sem metadados: filtros por tipo/data ficam inativos, só o número conta\n    }\n    return contests;\n  }\n\n  function filtersActive() {\n    const f = state.filters;\n    return f.types.length \u003c CONTEST_TYPES.length || !!f.minDate || !!f.minContestId || !!(f.tags && f.tags.length);\n  }\n  function passesFilters(p) {\n    const f = state.filters;\n    const meta = contests && contests.get(p.contestId);\n    const minId = parseInt(f.minContestId) || 0;\n    if (f.tags && f.tags.length && !(p.tags || []).some(t => f.tags.includes(t))) return false;\n    if (f.types.length \u003c CONTEST_TYPES.length) {\n      const type = meta ? meta.type : 'other';\n      if (!f.types.includes(type)) return false;\n    }\n    if (f.minDate) {\n      const minTs = new Date(f.minDate).getTime();\n      if (meta && meta.start) { if (meta.start \u003c minTs) return false; }\n      else if (minId && p.contestId \u003c minId) return false; // sem data: recorre ao número\n    }\n    if (minId && p.contestId \u003c minId) return false;\n    return true;\n  }\n\n  // conta submissões erradas (exclui erros de compilação e testes em curso)\n  function isWrong(s) {\n    return s.verdict && s.verdict !== 'OK' && s.verdict !== 'COMPILATION_ERROR' && s.verdict !== 'TESTING';\n  }\n  function subsForProblem(subs, p, startTs, limitMs) {\n    return subs.filter(s =>\n      s.problem.contestId === p.contestId && s.problem.index === p.index &&\n      s.creationTimeSeconds * 1000 >= startTs &&\n      s.creationTimeSeconds * 1000 \u003c= startTs + limitMs);\n  }\n\n  function problemUrl(p) {\n    return `https://codeforces.com/problemset/problem/${p.contestId}/${p.index}`;\n  }\n  function roundRating(r) { return Math.max(800, Math.min(3500, Math.round(r / 100) * 100)); }\n\n  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }\n\n  function pickProblems() {\n    const unsolved = problemset.filter(p => !solvedSet.has(p.contestId + p.index));\n    const filtered = filtersActive() ? unsolved.filter(passesFilters) : unsolved;\n    let relaxed = false;\n    const picks = OFFSET_RANGES.map(([lo, hi]) => {\n      const target = roundRating(state.rating + randInt(lo, hi));\n      // 1) rating exato com filtros; 2) ±100 com filtros; 3) rating exato sem filtros; 4) ±100 sem filtros\n      const tiers = [\n        filtered.filter(p => p.rating === target),\n        filtered.filter(p => Math.abs(p.rating - target) \u003c= 100),\n        unsolved.filter(p => p.rating === target),\n        unsolved.filter(p => Math.abs(p.rating - target) \u003c= 100),\n      ];\n      for (let t = 0; t \u003c tiers.length; t++) {\n        if (tiers[t].length) {\n          if (t >= 2) relaxed = true;\n          return tiers[t][Math.floor(Math.random() * tiers[t].length)];\n        }\n      }\n      return null;\n    });\n    picks.relaxed = relaxed;\n    picks.poolSize = filtered.length;\n    return picks;\n  }\n\n  // ---------- UI ----------\n  const $ = id => document.getElementById(id);\n  function setStatus(id, msg) { $(id).textContent = msg; }\n\n  function fmtDur(ms) {\n    const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);\n    return `${m}:${String(s).padStart(2, '0')}`;\n  }\n\n  function renderStats() {\n    const row = $('statsRow');\n    row.innerHTML = '';\n    for (let i = 0; i \u003c 3; i++) {\n      const entries = state.history.filter(h => h.diffIdx === i);\n      const solves = entries.filter(h => h.solved && typeof h.elapsedMs === 'number');\n      const avg = solves.length\n        ? fmtDur(solves.reduce((a, h) => a + h.elapsedMs, 0) / solves.length) : '—';\n      const rate = entries.length ? Math.round(100 * entries.filter(h => h.solved).length / entries.length) + '%' : '—';\n      const div = document.createElement('div');\n      div.innerHTML = `\u003cdiv class=\"diff ${DIFF_NAMES[i]}\" style=\"font-size:.78rem;font-weight:700;text-transform:uppercase;\">${DIFF_LABELS[i]}\u003c/div>\n        \u003cdiv style=\"font-size:.9rem;margin-top:2px;\">Tempo médio: \u003cb>${avg}\u003c/b>\u003c/div>\n        \u003cdiv style=\"font-size:.9rem;\">Taxa de sucesso: \u003cb>${rate}\u003c/b> (${entries.length})\u003c/div>`;\n      row.appendChild(div);\n    }\n    renderChart();\n  }\n\n  function renderChart() {\n    const wrap = $('chartWrap');\n    const pts = [...state.history].reverse().map(h => h.newRating);\n    if (pts.length \u003c 2) { wrap.innerHTML = '\u003cdiv class=\"tag-note\">O gráfico de evolução aparece após 2+ treinos.\u003c/div>'; return; }\n    const W = 840, H = 180, PAD = 30;\n    const min = Math.min(...pts), max = Math.max(...pts);\n    const span = Math.max(max - min, 50);\n    const x = i => PAD + i * (W - 2 * PAD) / (pts.length - 1);\n    const y = v => H - PAD - (v - min) * (H - 2 * PAD) / span;\n    const path = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');\n    const dots = pts.map((v, i) => `\u003ccircle cx=\"${x(i).toFixed(1)}\" cy=\"${y(v).toFixed(1)}\" r=\"3\" fill=\"#4f8ef7\">\u003ctitle>${v}\u003c/title>\u003c/circle>`).join('');\n    wrap.innerHTML = `\u003csvg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;height:auto;\">\n      \u003ctext x=\"${PAD - 6}\" y=\"${y(max) + 4}\" fill=\"#9aa0b0\" font-size=\"11\" text-anchor=\"end\">${max}\u003c/text>\n      \u003ctext x=\"${PAD - 6}\" y=\"${y(min) + 4}\" fill=\"#9aa0b0\" font-size=\"11\" text-anchor=\"end\">${min}\u003c/text>\n      \u003cline x1=\"${PAD}\" y1=\"${y(max)}\" x2=\"${W - PAD}\" y2=\"${y(max)}\" stroke=\"#2d3242\" stroke-dasharray=\"3,3\"/>\n      \u003cline x1=\"${PAD}\" y1=\"${y(min)}\" x2=\"${W - PAD}\" y2=\"${y(min)}\" stroke=\"#2d3242\" stroke-dasharray=\"3,3\"/>\n      \u003cpath d=\"${path}\" fill=\"none\" stroke=\"#4f8ef7\" stroke-width=\"2\"/>${dots}\u003c/svg>`;\n  }\n\n  function renderFilters() {\n    const f = state.filters;\n    const chips = $('typeChips');\n    chips.innerHTML = '';\n    for (const [key, label] of CONTEST_TYPES) {\n      const l = document.createElement('label');\n      l.innerHTML = `\u003cinput type=\"checkbox\" value=\"${key}\" ${f.types.includes(key) ? 'checked' : ''}> ${label}`;\n      l.querySelector('input').onchange = ev => {\n        f.types = ev.target.checked\n          ? [...new Set([...f.types, key])]\n          : f.types.filter(t => t !== key);\n        save(); renderFilters();\n      };\n      chips.appendChild(l);\n    }\n    $('minDate').value = f.minDate || '';\n    $('minContestId').value = f.minContestId || '';\n    $('tagsInput').value = (f.tags || []).join(', ');\n    const parts = [];\n    if (f.tags && f.tags.length) parts.push('tags: ' + f.tags.join(', '));\n    if (f.types.length \u003c CONTEST_TYPES.length) parts.push(f.types.length ? f.types.map(t => CONTEST_TYPES.find(([k]) => k === t)[1]).join(', ') : 'nenhum tipo');\n    if (f.minDate) parts.push(`desde ${f.minDate}`);\n    if (f.minContestId) parts.push(`contest ≥ ${f.minContestId}`);\n    $('filterSummary').textContent = parts.length ? `(${parts.join(' · ')})` : '(sem filtros)';\n  }\n\n  function render() {\n    $('ratingDisplay').textContent = state.rating;\n    renderFilters();\n    $('handle').value = state.handle || '';\n    $('timeLimit').value = state.timeLimit || 40;\n    $('contestLimit').value = state.contestLimit || 120;\n    const body = $('historyBody');\n    body.innerHTML = '';\n    for (const h of state.history) {\n      const tr = document.createElement('tr');\n      const d = new Date(h.ts);\n      tr.innerHTML = `\n        \u003ctd>${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}\u003c/td>\n        \u003ctd>\u003ca href=\"${h.url}\" target=\"_blank\">${h.name}\u003c/a>\u003c/td>\n        \u003ctd>${h.problemRating}\u003c/td>\n        \u003ctd>${h.solved ? '\u003cspan class=\"pos\">Resolvido\u003c/span>' : '\u003cspan class=\"neg\">Falhado\u003c/span>'}${h.wa ? ` \u003cspan class=\"neg\">(${h.wa} WA)\u003c/span>` : ''}\u003c/td>\n        \u003ctd>${typeof h.elapsedMs === 'number' ? fmtDur(h.elapsedMs) : '—'}\u003c/td>\n        \u003ctd class=\"${h.delta >= 0 ? 'pos' : 'neg'}\">${h.delta >= 0 ? '+' : ''}${h.delta}\u003c/td>\n        \u003ctd>${h.newRating}\u003c/td>`;\n      body.appendChild(tr);\n    }\n    renderStats();\n  }\n\n  async function onNewProblems() {\n    $('newBtn').disabled = true;\n    try {\n      state.handle = $('handle').value.trim(); sharedHandle(state.handle);\n      state.timeLimit = parseInt($('timeLimit').value) || 40;\n      save();\n      await loadProblemset();\n      if (filtersActive()) await loadContests();\n      await loadSolved(state.handle);\n      const picks = pickProblems();\n      const container = $('problemChoices');\n      container.innerHTML = '';\n      picks.forEach((p, i) => {\n        if (!p) return;\n        const div = document.createElement('div');\n        div.className = 'problem-card';\n        div.innerHTML = `\n          \u003cdiv class=\"diff ${DIFF_NAMES[i]}\">${DIFF_LABELS[i]}\u003c/div>\n          \u003cdiv class=\"prating\">???\u003c/div>\n          \u003cdiv class=\"delta\">Rating escondido até terminares\u003c/div>`;\n        div.onclick = () => startSession(p, i);\n        container.appendChild(div);\n      });\n      lastPicks = picks;\n      if (picks.filter(Boolean).length === 3) $('contestStartRow').classList.remove('hidden');\n      let msg = 'Clica num problema para treino individual, ou começa um Contest Virtual com os 3.';\n      if (filtersActive()) msg += ` (${picks.poolSize} problemas cumprem os filtros` + (picks.relaxed ? '; filtros ignorados em pelo menos uma dificuldade por falta de problemas)' : ')');\n      setStatus('pickStatus', msg);\n    } catch (e) {\n      setStatus('pickStatus', 'Erro: ' + e.message);\n    } finally {\n      $('newBtn').disabled = false;\n    }\n  }\n\n  function startSession(problem, diffIdx) {\n    active = {\n      problem, diffIdx, wa: 0,\n      startTs: Date.now(),\n      limitMs: (state.timeLimit || 40) * 60 * 1000,\n    };\n    $('contestStartRow').classList.add('hidden');\n    window.open(problemUrl(problem), '_blank');\n    $('problemChoices').innerHTML = '';\n    setStatus('pickStatus', '');\n    $('pickCard').classList.add('hidden');\n    $('activeCard').classList.remove('hidden');\n    $('activeTitle').innerHTML = `\u003ca href=\"${problemUrl(problem)}\" target=\"_blank\">${problem.contestId}${problem.index} — ${problem.name}\u003c/a>`;\n    $('activeMeta').textContent = `Dificuldade: ${DIFF_LABELS[diffIdx]} (rating escondido) · Limite: ${state.timeLimit} min`;\n    setStatus('activeStatus', '');\n    renderWa();\n    tickInterval = setInterval(tick, 500);\n    tick();\n  }\n\n  function renderWa() {\n    if (active) $('waCount').textContent = active.wa ? `Tentativas erradas (WA): ${active.wa} — penalização ×${Math.pow(0.85, active.wa).toFixed(2)}` : 'Sem tentativas erradas';\n  }\n\n  function tick() {\n    if (!active) return;\n    const remaining = active.limitMs - (Date.now() - active.startTs);\n    const t = $('timer');\n    const abs = Math.abs(remaining);\n    const mm = String(Math.floor(abs / 60000)).padStart(2, '0');\n    const ss = String(Math.floor((abs % 60000) / 1000)).padStart(2, '0');\n    t.textContent = (remaining \u003c 0 ? '-' : '') + `${mm}:${ss}`;\n    t.className = 'timer' + (remaining \u003c 0 ? ' late' : remaining \u003c 5 * 60000 ? ' warn' : '');\n    if (remaining \u003c 0) {\n      setStatus('activeStatus', 'Tempo esgotado! Ainda podes verificar/terminar, mas conta como falhado se não resolveste dentro do tempo.');\n    }\n  }\n\n  function withinTime() {\n    return (Date.now() - active.startTs) \u003c= active.limitMs;\n  }\n\n  function endSession(solved) {\n    clearInterval(tickInterval);\n    const { problem, diffIdx, startTs, limitMs, endTs, wa: active_wa } = active;\n    const elapsedMs = Math.min((endTs || Date.now()) - startTs, limitMs);\n    active = null;\n    $('activeCard').classList.add('hidden');\n    $('pickCard').classList.remove('hidden');\n    applyResult(problem, solved, diffIdx, elapsedMs, limitMs, active_wa);\n  }\n\n  async function checkCF() {\n    if (!active) return;\n    const handle = (state.handle || '').trim();\n    if (!handle) { setStatus('activeStatus', 'Indica o teu handle CF para verificação automática.'); return; }\n    setStatus('activeStatus', 'A verificar submissões…');\n    try {\n      const subs = await api(`user.status?handle=${encodeURIComponent(handle)}&from=1&count=100`);\n      const p = active.problem;\n      const inWindow = subsForProblem(subs, p, active.startTs, active.limitMs);\n      const ok = inWindow.find(s => s.verdict === 'OK');\n      const waBefore = inWindow.filter(s => isWrong(s) &&\n        (!ok || s.creationTimeSeconds \u003c ok.creationTimeSeconds)).length;\n      active.wa = Math.max(active.wa, waBefore);\n      renderWa();\n      if (ok) {\n        setStatus('activeStatus', '');\n        // usa o tempo da submissão aceite, não o momento da verificação\n        active.endTs = ok.creationTimeSeconds * 1000;\n        endSession(true);\n      } else {\n        setStatus('activeStatus', `Ainda sem submissão aceite dentro do tempo limite. WAs detetados: ${waBefore}.`);\n      }\n    } catch (e) {\n      setStatus('activeStatus', 'Erro: ' + e.message);\n    }\n  }\n\n  // ---------- Contest Virtual ----------\n  function startContest() {\n    if (!lastPicks || lastPicks.filter(Boolean).length \u003c 3) return;\n    const limitMin = parseInt($('contestLimit').value) || 120;\n    contest = {\n      startTs: Date.now(),\n      limitMs: limitMin * 60 * 1000,\n      entries: lastPicks.map((p, i) => ({ p, diffIdx: i, solved: false, elapsedMs: null, wa: 0 })),\n    };\n    $('problemChoices').innerHTML = '';\n    $('contestStartRow').classList.add('hidden');\n    setStatus('pickStatus', '');\n    $('pickCard').classList.add('hidden');\n    $('contestCard').classList.remove('hidden');\n    setStatus('contestStatus', '');\n    renderContest();\n    contestInterval = setInterval(contestTick, 500);\n    contestTick();\n  }\n\n  function renderContest() {\n    const div = $('contestProblems');\n    div.innerHTML = '';\n    const table = document.createElement('table');\n    table.innerHTML = '\u003cthead>\u003ctr>\u003cth>Dificuldade\u003c/th>\u003cth>Problema\u003c/th>\u003cth>Estado\u003c/th>\u003cth>WA\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>';\n    const tbody = document.createElement('tbody');\n    contest.entries.forEach((e, i) => {\n      const tr = document.createElement('tr');\n      const estado = e.solved\n        ? `\u003cspan class=\"pos\">Resolvido (${fmtDur(e.elapsedMs)})\u003c/span>`\n        : '\u003cspan class=\"neg\">Por resolver\u003c/span>';\n      tr.innerHTML = `\n        \u003ctd>\u003cspan class=\"diff ${DIFF_NAMES[e.diffIdx]}\" style=\"font-weight:700;text-transform:uppercase;font-size:.78rem;\">${DIFF_LABELS[e.diffIdx]}\u003c/span>\u003c/td>\n        \u003ctd>\u003ca href=\"${problemUrl(e.p)}\" target=\"_blank\">${e.p.contestId}${e.p.index} — ${e.p.name}\u003c/a>\u003c/td>\n        \u003ctd>${estado}\u003c/td>\n        \u003ctd>${e.wa}\u003c/td>\n        \u003ctd class=\"row\" style=\"gap:6px;\">\n          ${e.solved ? '' : `\u003cbutton class=\"success\" data-solve=\"${i}\" style=\"padding:4px 10px;font-size:.8rem;\">Resolvi ✔\u003c/button>\n          \u003cbutton class=\"secondary\" data-wa=\"${i}\" style=\"padding:4px 10px;font-size:.8rem;\">+1 WA\u003c/button>`}\n        \u003c/td>`;\n      tbody.appendChild(tr);\n    });\n    table.appendChild(tbody);\n    div.appendChild(table);\n    div.querySelectorAll('[data-solve]').forEach(b => b.onclick = () => {\n      const e = contest.entries[+b.dataset.solve];\n      e.solved = true;\n      e.elapsedMs = Math.min(Date.now() - contest.startTs, contest.limitMs);\n      renderContest();\n    });\n    div.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {\n      contest.entries[+b.dataset.wa].wa++;\n      renderContest();\n    });\n  }\n\n  function contestTick() {\n    if (!contest) return;\n    const remaining = contest.limitMs - (Date.now() - contest.startTs);\n    const t = $('contestTimer');\n    const abs = Math.abs(remaining);\n    const hh = Math.floor(abs / 3600000);\n    const mm = String(Math.floor((abs % 3600000) / 60000)).padStart(2, '0');\n    const ss = String(Math.floor((abs % 60000) / 1000)).padStart(2, '0');\n    t.textContent = (remaining \u003c 0 ? '-' : '') + (hh ? hh + ':' : '') + `${mm}:${ss}`;\n    t.className = 'timer' + (remaining \u003c 0 ? ' late' : remaining \u003c 10 * 60000 ? ' warn' : '');\n    if (remaining \u003c 0) {\n      setStatus('contestStatus', 'Tempo esgotado! Termina o contest para atualizar o rating.');\n    }\n  }\n\n  async function checkContestCF() {\n    const handle = (state.handle || '').trim();\n    if (!handle) { setStatus('contestStatus', 'Indica o teu handle CF para verificação automática.'); return; }\n    setStatus('contestStatus', 'A verificar submissões…');\n    try {\n      const subs = await api(`user.status?handle=${encodeURIComponent(handle)}&from=1&count=200`);\n      for (const e of contest.entries) {\n        const inWindow = subsForProblem(subs, e.p, contest.startTs, contest.limitMs);\n        const ok = inWindow.find(s => s.verdict === 'OK');\n        e.wa = Math.max(e.wa, inWindow.filter(s => isWrong(s) &&\n          (!ok || s.creationTimeSeconds \u003c ok.creationTimeSeconds)).length);\n        if (ok && !e.solved) {\n          e.solved = true;\n          e.elapsedMs = Math.min(ok.creationTimeSeconds * 1000 - contest.startTs, contest.limitMs);\n        }\n      }\n      renderContest();\n      const n = contest.entries.filter(e => e.solved).length;\n      setStatus('contestStatus', `Verificação concluída: ${n}/3 resolvidos.`);\n    } catch (err) {\n      setStatus('contestStatus', 'Erro: ' + err.message);\n    }\n  }\n\n  function endContest() {\n    clearInterval(contestInterval);\n    const { entries, startTs, limitMs } = contest;\n    contest = null;\n    $('contestCard').classList.add('hidden');\n    $('pickCard').classList.remove('hidden');\n    // o rating só é atualizado no fim: as expetativas usam o rating de entrada\n    const baseRating = state.rating;\n    for (const e of entries) {\n      const elapsed = e.solved ? e.elapsedMs : Math.min(Date.now() - startTs, limitMs);\n      const delta = deltaFor(baseRating, e.p, e.solved, elapsed, limitMs, e.wa);\n      state.rating = Math.max(0, state.rating + delta);\n      pushHistory(e.p, e.solved, e.diffIdx, e.solved ? e.elapsedMs : null, e.wa, delta);\n      state.history[0].contest = startTs;\n    }\n    save();\n    render();\n  }\n\n  // ---------- events ----------\n  $('newBtn').onclick = onNewProblems;\n  $('solvedBtn').onclick = () => {\n    if (!withinTime() && !confirm('O tempo já esgotou — contar como resolvido na mesma?')) return;\n    endSession(withinTime());\n  };\n  $('failBtn').onclick = () => { if (confirm('Marcar como falhado?')) endSession(false); };\n  $('waBtn').onclick = () => { if (active) { active.wa++; renderWa(); } };\n  $('checkBtn').onclick = checkCF;\n  $('contestBtn').onclick = startContest;\n  $('contestCheckBtn').onclick = checkContestCF;\n  $('contestEndBtn').onclick = () => { if (confirm('Terminar o contest e atualizar o rating?')) endContest(); };\n  $('resetBtn').onclick = () => {\n    const sr = state.startRating || 1200;\n    if (!confirm('Repor o rating para ' + sr + ' e apagar o histórico?')) return;\n    state = { rating: sr, startRating: sr, history: [], handle: state.handle, timeLimit: state.timeLimit, contestLimit: state.contestLimit, filters: state.filters };\n    save(); render();\n  };\n  $('handle').onchange = () => { state.handle = $('handle').value.trim(); sharedHandle(state.handle); save(); };\n  if (sharedHandle()) state.handle = sharedHandle();\n  $('timeLimit').onchange = () => { state.timeLimit = parseInt($('timeLimit').value) || 40; save(); };\n  $('contestLimit').onchange = () => { state.contestLimit = parseInt($('contestLimit').value) || 120; save(); };\n  $('tagsInput').onchange = () => { state.filters.tags = $('tagsInput').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean); save(); renderFilters(); };\n  $('minDate').onchange = () => { state.filters.minDate = $('minDate').value; save(); renderFilters(); };\n  $('minContestId').onchange = () => { state.filters.minContestId = $('minContestId').value.trim(); save(); renderFilters(); };\n  $('clearFiltersBtn').onclick = () => { state.filters = Object.assign({}, DEFAULT_FILTERS, { types: DEFAULT_FILTERS.types.slice() }); save(); renderFilters(); };\n\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "journal": "\u003c!DOCTYPE html>\n\u003chtml lang=\"pt\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Diário de problemas\u003c/title>\n\u003cstyle>\n:root{--bg:#12141a;--panel:#1b1e27;--panel2:#232734;--line:#323748;--text:#e6e8ee;--muted:#9099ad;--accent:#6ea8fe;--ok:#4cc38a;--warn:#e5a84b;--bad:#ef6b73}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}\nheader h1{font-size:17px;margin:0 12px 0 0}\nnav{display:flex;gap:4px;flex-wrap:wrap}\nnav button{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}\nnav button.on{background:var(--panel2);color:var(--text)}\nmain{max-width:980px;margin:0 auto;padding:20px}\nh2{font-size:18px;margin:0 0 12px}\nh3{font-size:15px;margin:18px 0 8px}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}\n.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}\n.grow{flex:1;min-width:0}\n.muted{color:var(--muted)}\n.small{font-size:13px}\nbutton.b{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer}\nbutton.b:hover{border-color:var(--accent)}\nbutton.primary{background:var(--accent);border-color:var(--accent);color:#0c1220;font-weight:600}\nbutton.danger{color:var(--bad)}\ninput[type=text],input[type=url],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;font:inherit;width:100%}\ntextarea{resize:vertical;min-height:70px}\ntextarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:160px;white-space:pre;tab-size:4}\nlabel{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}\na{color:var(--accent);text-decoration:none}\na:hover{text-decoration:underline}\n.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--panel2);color:var(--muted);margin-right:4px;white-space:nowrap}\n.tag.cf{color:#6ea8fe}.tag.cses{color:#4cc38a}.tag.vj{color:#e5a84b}.tag.other{color:#c79bf2}\n.tag.done{background:#1d3a2c;color:var(--ok)}\n.item{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}\n.item:last-child{border-bottom:0}\n.day{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 2px}\n.pre{white-space:pre-wrap;word-wrap:break-word}\n.fc{min-height:220px;padding:24px;font-size:16px}\n.fc .q{font-size:19px;font-weight:600;margin-bottom:10px}\n.fc h4{margin:14px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}\n.fc pre{background:var(--bg);padding:10px;border-radius:6px;overflow:auto;font-size:13px}\n.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\n.grades button{padding:10px}\n.hide{display:none!important}\n.msg{font-size:13px;margin-top:6px}\n.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media(max-width:700px){.grid2{grid-template-columns:1fr}}\nkbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}\n\u003c/style>\n\u003cstyle>\n/* one look for every tool */\n:root{--bg:#0f1317;--card:#171c22;--card2:#1e252d;--panel:#171c22;--panel2:#1e252d;--line:#2a3138;--border:#2a3138;--text:#e6e9ec;--fg:#e6e9ec;--muted:#98a2ad;--mut:#98a2ad;--accent:#6cb0ff;--acc:#6cb0ff;--ok:#56c271;--green:#56c271;--warn:#e5a84b;--yellow:#e5a84b;--bad:#ef6b73;--red:#ef6b73}\nbody{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:15px}\n.container{max-width:980px;padding:20px}\n\u003c/style>\u003cbase target=\"_blank\">\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003ch1>Diário\u003c/h1>\n  \u003cnav id=\"nav\">\n    \u003cbutton data-tab=\"pick\">Resolvidos recentemente\u003c/button>\n    \u003cbutton data-tab=\"journal\">Diário\u003c/button>\n    \u003cbutton data-tab=\"cards\">Flashcards \u003cspan id=\"dueBadge\" class=\"tag\">\u003c/span>\u003c/button>\n    \u003cbutton data-tab=\"data\">Contas e importação\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\u003cmain id=\"main\">\u003c/main>\n\n\u003cscript>\n\"use strict\";\nconst KEY = \"cpjournal.v1\";\nconst DAY = 864e5, RECENT_DAYS = 14;\nconst FIELDS = [\n  [\"statement\", \"O problema por palavras minhas\", \"Resumo do enunciado, limites que importam\"],\n  [\"idea\", \"Ideia-chave\", \"A observação que desbloqueia o problema\"],\n  [\"approach\", \"Esboço da solução\", \"Passos do algoritmo, estruturas de dados, esboço da prova\"],\n  [\"complexity\", \"Complexidade\", \"ex.: O(n log n) tempo, O(n) memória\", \"line\"],\n  [\"stuck\", \"Como lá cheguei / onde fiquei preso\", \"Abordagens erradas que tentei, o que me levou à ideia, dicas que usei\"],\n  [\"pitfalls\", \"Erros e armadilhas\", \"Bugs, causas de WA, casos limite, overflow, off-by-one\"],\n  [\"takeaway\", \"Lição para problemas futuros\", \"Em que situações me devo lembrar desta técnica?\"],\n  [\"related\", \"Problemas relacionados / referências\", \"Problemas parecidos, editoriais, blogs\"],\n  [\"code\", \"Código\", \"Cola a solução aceite ou o excerto essencial\", \"code\"],\n  [\"notes\", \"Outras notas\", \"Tudo o resto que valha a pena lembrar\"]\n];\n\nlet S = load();\nfunction load() {\n  let s = {};\n  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}\n  return normalize(s);\n}\nfunction normalize(s) {\n  s.version = 1;\n  s.settings = Object.assign({ cf: \"\", vj: \"\" }, s.settings || {});\n  // the Codeforces handle is shared by every tool (set in Definições); older data kept it here or in the trainer\n  try { const p = JSON.parse(localStorage.getItem(\"cptools.profile\")) || {}; if (p.handle) s.settings.cf = p.handle; } catch (e) {}\n  if (!s.settings.cf) { try { s.settings.cf = (JSON.parse(localStorage.getItem(\"cfTrainerState\")) || {}).handle || \"\"; } catch (e) {} }\n  s.solved = s.solved || {};     // key -> {key,judge,name,url,rating,tags,t}\n  s.entries = s.entries || {};   // key -> journal entry\n  s.cses = s.cses || { seen: false };\n  return s;\n}\nfunction save() { localStorage.setItem(KEY, JSON.stringify(S)); updateBadge(); }\n\nconst $ = (q, el) => (el || document).querySelector(q);\nconst esc = s => String(s == null ? \"\" : s).replace(/[&\u003c>\"']/g, c => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\nconst safeUrl = u => /^https?:\\/\\//i.test(u || \"\") ? u : \"\";\nconst fmtDate = t => t ? new Date(t).toLocaleDateString(\"pt-PT\", { weekday: \"short\", day: \"numeric\", month: \"short\", year: \"numeric\" }) : \"Sem data\";\nconst fmtTime = t => new Date(t).toLocaleTimeString(\"pt-PT\", { hour: \"2-digit\", minute: \"2-digit\" });\nconst judgeTag = j => `\u003cspan class=\"tag ${esc(j)}\">${({ cf: \"Codeforces\", cses: \"CSES\", vj: \"VJudge\", other: \"Outro\" })[j] || esc(j)}\u003c/span>`;\nconst uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);\n\n/* ---------- importers ---------- */\nfunction addSolved(p) {\n  const old = S.solved[p.key];\n  if (!old) { S.solved[p.key] = p; return true; }\n  // keep the earliest accepted time, fill in missing metadata\n  if (p.t && (!old.t || p.t \u003c old.t)) old.t = p.t;\n  if (old.bare && !p.bare) { old.name = p.name; old.url = p.url; delete old.bare; }\n  if (p.rating && !old.rating) old.rating = p.rating;\n  if (p.tags && p.tags.length && !(old.tags || []).length) old.tags = p.tags;\n  return false;\n}\nasync function fetchCF() {\n  const h = S.settings.cf.trim();\n  if (!h) throw new Error(\"Indica primeiro o teu handle do Codeforces (Contas e importação).\");\n  const r = await fetch(\"https://codeforces.com/api/user.status?handle=\" + encodeURIComponent(h) + \"&from=1&count=500\");\n  const j = await r.json();\n  if (j.status !== \"OK\") throw new Error(j.comment || \"Erro na API do Codeforces\");\n  let n = 0;\n  for (const s of j.result) {\n    if (s.verdict !== \"OK\" || !s.problem) continue;\n    const p = s.problem, cid = p.contestId || s.contestId;\n    const gym = cid >= 100000;\n    if (addSolved({\n      key: \"cf:\" + cid + p.index, judge: \"cf\", name: cid + p.index + \" · \" + p.name,\n      url: `https://codeforces.com/${gym ? \"gym\" : \"contest\"}/${cid}/problem/${p.index}`,\n      rating: p.rating || null, tags: p.tags || [], t: s.creationTimeSeconds * 1000\n    })) n++;\n  }\n  save(); return n;\n}\nfunction importVJ(text) {\n  let j;\n  try { j = JSON.parse(text); } catch (e) { throw new Error(\"Isso não é o texto da ligação do VJudge. Copia a página toda.\"); }\n  const rows = Array.isArray(j) ? j : j.data;\n  if (!Array.isArray(rows)) throw new Error(\"Não encontrei a lista de submissões no texto colado.\");\n  let n = 0, ac = 0;\n  for (const s of rows) {\n    if (s.status !== \"Accepted\" && s.statusCanonical !== \"AC\") continue;\n    ac++;\n    const oj = String(s.oj || \"\"), num = String(s.probNum || \"\");\n    if (!oj || !num) continue;\n    let p;\n    if (/^codeforces$/i.test(oj)) p = { key: \"cf:\" + num, judge: \"cf\", name: num, url: \"https://vjudge.net/problem/\" + oj + \"-\" + num };\n    else if (/^cses$/i.test(oj)) p = { key: \"cses:\" + num, judge: \"cses\", name: \"CSES \" + num, url: \"https://cses.fi/problemset/task/\" + num };\n    else p = { key: \"vj:\" + oj + \"-\" + num, judge: \"vj\", name: oj + \" \" + num, url: \"https://vjudge.net/problem/\" + encodeURIComponent(oj + \"-\" + num) };\n    p.t = +s.time || Date.now(); p.tags = []; p.rating = null; p.bare = true;\n    if (addSolved(p)) n++;\n  }\n  save(); return { n, ac, total: rows.length };\n}\nfunction importCSES(html) {\n  const doc = new DOMParser().parseFromString(html, \"text/html\");\n  const links = doc.querySelectorAll('a[href*=\"/problemset/task/\"]');\n  if (!links.length) throw new Error(\"Não encontrei problemas do CSES no que colaste.\");\n  const first = !S.cses.seen, now = Date.now();\n  let solved = 0, n = 0;\n  links.forEach(a => {\n    const m = a.getAttribute(\"href\").match(/\\/problemset\\/task\\/(\\d+)/);\n    if (!m) return;\n    const li = a.closest(\"li\");\n    const full = a.classList.contains(\"full\") || (li && li.querySelector(\".task-score.full\"));\n    if (!full) return;\n    solved++;\n    const name = (a.textContent.trim() || a.getAttribute(\"title\") || \"Problema \" + m[1]).trim();\n    const key = \"cses:\" + m[1];\n    if (S.solved[key]) { if (S.solved[key].bare) { S.solved[key].name = name; delete S.solved[key].bare; } return; }\n    // CSES shows no solve dates: tasks already solved at the first import are undated,\n    // later ones are dated by the import that first sees them.\n    S.solved[key] = { key, judge: \"cses\", name, url: \"https://cses.fi/problemset/task/\" + m[1], rating: null, tags: [], t: first ? 0 : now };\n    n++;\n  });\n  S.cses.seen = true; S.cses.last = now;\n  save(); return { n, solved, total: links.length, first };\n}\n\n/* ---------- journal entries ---------- */\nfunction newSrs() { return { due: 0, ivl: 0, ease: 2.5, reps: 0 }; }\nfunction openEntry(key) {\n  if (!S.entries[key]) {\n    const p = S.solved[key];\n    S.entries[key] = { key, judge: p.judge, name: p.name, url: p.url, rating: p.rating, tags: p.tags || [], solvedAt: p.t,\n      created: Date.now(), updated: Date.now(), f: {}, myTags: \"\", difficulty: \"\", cards: [], srs: newSrs(), auto: true };\n    save();\n  }\n  cur = key; go(\"journal\");\n}\n\n/* ---------- flashcards ---------- */\nfunction allCards() {\n  const out = [];\n  for (const e of Object.values(S.entries)) {\n    if (e.auto !== false && (e.f.idea || e.f.approach)) out.push({ e, auto: true, srs: e.srs || (e.srs = newSrs()) });\n    for (const c of e.cards || []) if (c.q.trim() && c.a.trim()) out.push({ e, c, srs: c.srs || (c.srs = newSrs()) });\n  }\n  return out;\n}\nconst dueCards = () => allCards().filter(c => c.srs.due \u003c= Date.now());\nfunction grade(srs, g) { // g: 0 again, 1 hard, 2 good, 3 easy\n  if (g === 0) { srs.reps = 0; srs.ivl = 0; srs.ease = Math.max(1.3, srs.ease - 0.2); srs.due = Date.now() + 5 * 60e3; return; }\n  if (srs.reps === 0) srs.ivl = [0, 1, 2, 4][g];\n  else srs.ivl = Math.max(srs.ivl + 1, Math.round(srs.ivl * [0, 1.2, srs.ease, srs.ease * 1.3][g]));\n  srs.ease = Math.max(1.3, srs.ease + [0, -0.15, 0, 0.15][g]);\n  srs.reps++;\n  srs.due = Date.now() + srs.ivl * DAY;\n}\nfunction nextIvl(srs, g) { const c = Object.assign({}, srs); grade(c, g); return g === 0 ? \"5 min\" : c.ivl + \" d\"; }\nfunction updateBadge() { const n = dueCards().length; const b = $(\"#dueBadge\"); b.textContent = n; b.classList.toggle(\"hide\", !n); }\n\n/* ---------- views ---------- */\nlet tab = \"pick\", cur = null, pickOlder = false, pickQ = \"\", jQ = \"\", rev = null;\nfunction go(t) { tab = t; render(); window.scrollTo(0, 0); }\n$(\"#nav\").addEventListener(\"click\", e => { const b = e.target.closest(\"button\"); if (b) { if (b.dataset.tab === \"journal\") cur = null; rev = null; go(b.dataset.tab); } });\n\nfunction render() {\n  document.querySelectorAll(\"#nav button\").forEach(b => b.classList.toggle(\"on\", b.dataset.tab === tab));\n  ({ pick: viewPick, journal: cur ? viewEntry : viewJournal, cards: viewCards, data: viewData })[tab]();\n  updateBadge();\n}\n\nfunction viewPick() {\n  const cutoff = Date.now() - RECENT_DAYS * DAY;\n  let list = Object.values(S.solved).filter(p => pickOlder || p.t >= cutoff);\n  const q = pickQ.toLowerCase();\n  if (q) list = list.filter(p => (p.name + \" \" + (p.tags || []).join(\" \")).toLowerCase().includes(q));\n  list.sort((a, b) => b.t - a.t);\n  let html = `\u003cdiv class=\"row\" style=\"margin-bottom:12px\">\n    \u003ch2 class=\"grow\" style=\"margin:0\">Resolvidos nos últimos ${RECENT_DAYS} dias\u003c/h2>\n    \u003cbutton class=\"b primary\" id=\"sync\">Atualizar Codeforces\u003c/button>\n    \u003cbutton class=\"b\" id=\"toImport\">Importar CSES / VJudge\u003c/button>\n    \u003cbutton class=\"b\" id=\"manual\">Adicionar à mão\u003c/button>\u003c/div>\n    \u003cdiv class=\"row\">\u003cinput type=\"search\" id=\"pq\" class=\"grow\" placeholder=\"Filtrar por nome ou tag\" value=\"${esc(pickQ)}\">\n    \u003clabel style=\"margin:0\">\u003cinput type=\"checkbox\" id=\"older\" ${pickOlder ? \"checked\" : \"\"}> mostrar também os antigos e sem data\u003c/label>\u003c/div>\n    \u003cdiv id=\"pmsg\" class=\"msg\">\u003c/div>\u003cdiv class=\"card\" style=\"margin-top:12px\">`;\n  if (!list.length) html += `\u003cdiv class=\"muted\">Ainda não há nada aqui. Atualiza o Codeforces, importa do CSES / VJudge ou adiciona um problema à mão.\u003c/div>`;\n  let day = null;\n  for (const p of list) {\n    const d = fmtDate(p.t);\n    if (d !== day) { day = d; html += `\u003cdiv class=\"day\">${esc(d)}\u003c/div>`; }\n    const has = !!S.entries[p.key];\n    html += `\u003cdiv class=\"item\">\u003cdiv class=\"grow\">${judgeTag(p.judge)}\n      ${safeUrl(p.url) ? `\u003ca href=\"${esc(p.url)}\" target=\"_blank\" rel=\"noopener\">${esc(p.name)}\u003c/a>` : esc(p.name)}\n      ${p.rating ? `\u003cspan class=\"tag\">${p.rating}\u003c/span>` : \"\"}${has ? `\u003cspan class=\"tag done\">no diário\u003c/span>` : \"\"}\n      \u003cdiv class=\"small muted\">${p.t ? fmtTime(p.t) : \"\"} ${esc((p.tags || []).join(\", \"))}\u003c/div>\u003c/div>\n      \u003cbutton class=\"b ${has ? \"\" : \"primary\"}\" data-open=\"${esc(p.key)}\">${has ? \"Abrir no diário\" : \"Escrever\"}\u003c/button>\u003c/div>`;\n  }\n  html += `\u003c/div>\u003cdiv class=\"small muted\">Os problemas saem desta lista ${RECENT_DAYS} dias depois de os resolveres. As entradas do diário e os flashcards ficam guardados para sempre.\u003c/div>`;\n  $(\"#main\").innerHTML = html;\n  $(\"#pq\").oninput = e => { pickQ = e.target.value; const pos = e.target.selectionStart; viewPick(); const i = $(\"#pq\"); i.focus(); i.setSelectionRange(pos, pos); };\n  $(\"#older\").onchange = e => { pickOlder = e.target.checked; viewPick(); };\n  $(\"#toImport\").onclick = () => go(\"data\");\n  $(\"#manual\").onclick = manualAdd;\n  $(\"#sync\").onclick = async () => {\n    const m = $(\"#pmsg\"); m.className = \"msg\"; m.textContent = \"A carregar do Codeforces…\";\n    try { const n = await fetchCF(); viewPick(); $(\"#pmsg\").className = \"msg ok\"; $(\"#pmsg\").textContent = n + \" problema(s) resolvido(s) novo(s) do Codeforces.\"; }\n    catch (err) { m.className = \"msg err\"; m.textContent = err.message; }\n  };\n  $(\"#main\").querySelectorAll(\"[data-open]\").forEach(b => b.onclick = () => openEntry(b.dataset.open));\n}\nfunction manualAdd() {\n  const name = prompt(\"Nome do problema:\"); if (!name || !name.trim()) return;\n  const url = prompt(\"Ligação (opcional):\") || \"\";\n  const key = \"other:\" + uid();\n  S.solved[key] = { key, judge: \"other\", name: name.trim(), url: url.trim(), rating: null, tags: [], t: Date.now() };\n  save(); openEntry(key);\n}\n\nfunction viewJournal() {\n  let list = Object.values(S.entries);\n  const q = jQ.toLowerCase();\n  if (q) list = list.filter(e => JSON.stringify([e.name, e.tags, e.myTags, e.f]).toLowerCase().includes(q));\n  list.sort((a, b) => b.updated - a.updated);\n  let html = `\u003ch2>Diário \u003cspan class=\"muted small\">${Object.keys(S.entries).length} problema(s)\u003c/span>\u003c/h2>\n    \u003cinput type=\"search\" id=\"jq\" placeholder=\"Procurar em todas as notas, tags e código\" value=\"${esc(jQ)}\">\u003cdiv class=\"card\" style=\"margin-top:12px\">`;\n  if (!list.length) html += `\u003cdiv class=\"muted\">${q ? \"Sem resultados.\" : \"Ainda não há entradas. Escolhe um problema em Resolvidos recentemente.\"}\u003c/div>`;\n  for (const e of list) {\n    html += `\u003cdiv class=\"item\">\u003cdiv class=\"grow\">${judgeTag(e.judge)} \u003ca href=\"#\" data-open=\"${esc(e.key)}\">${esc(e.name)}\u003c/a>\n      ${e.rating ? `\u003cspan class=\"tag\">${e.rating}\u003c/span>` : \"\"}\n      ${(e.myTags || \"\").split(\",\").map(t => t.trim()).filter(Boolean).map(t => `\u003cspan class=\"tag\">${esc(t)}\u003c/span>`).join(\"\")}\n      \u003cdiv class=\"small muted pre\">${esc((e.f.idea || \"\").slice(0, 160))}\u003c/div>\u003c/div>\n      \u003cdiv class=\"small muted\">editado ${esc(new Date(e.updated).toLocaleDateString(\"pt-PT\"))}\u003c/div>\u003c/div>`;\n  }\n  $(\"#main\").innerHTML = html + \"\u003c/div>\";\n  $(\"#jq\").oninput = e => { jQ = e.target.value; const pos = e.target.selectionStart; viewJournal(); const i = $(\"#jq\"); i.focus(); i.setSelectionRange(pos, pos); };\n  $(\"#main\").querySelectorAll(\"[data-open]\").forEach(a => a.onclick = ev => { ev.preventDefault(); cur = a.dataset.open; go(\"journal\"); });\n}\n\nlet saveTimer = null;\nfunction touch(e) {\n  e.updated = Date.now();\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(() => { save(); const s = $(\"#saved\"); if (s) s.textContent = \"Guardado \" + fmtTime(Date.now()); }, 300);\n}\nfunction viewEntry() {\n  const e = S.entries[cur];\n  if (!e) { cur = null; return viewJournal(); }\n  let html = `\u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003cbutton class=\"b\" id=\"back\">← Todas as entradas\u003c/button>\n    \u003cspan class=\"grow\">\u003c/span>\u003cspan id=\"saved\" class=\"small muted\">Guarda automaticamente\u003c/span>\n    \u003cbutton class=\"b danger\" id=\"del\">Apagar entrada\u003c/button>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"row\">${judgeTag(e.judge)}\u003cinput type=\"text\" id=\"ename\" class=\"grow\" value=\"${esc(e.name)}\" style=\"font-size:17px;font-weight:600\">\u003c/div>\n    \u003cdiv class=\"small muted\" style=\"margin-top:6px\">${safeUrl(e.url) ? `\u003ca href=\"${esc(e.url)}\" target=\"_blank\" rel=\"noopener\">Abrir problema\u003c/a> · ` : \"\"}\n    ${e.solvedAt ? \"resolvido \" + esc(fmtDate(e.solvedAt)) : \"data de resolução desconhecida\"}${e.rating ? \" · rating \" + e.rating : \"\"}${(e.tags || []).length ? \" · \" + esc(e.tags.join(\", \")) : \"\"}\u003c/div>\n    \u003cdiv class=\"grid2\">\u003cdiv>\u003clabel>Técnicas / as minhas tags (separadas por vírgulas)\u003c/label>\u003cinput type=\"text\" id=\"mytags\" value=\"${esc(e.myTags)}\" placeholder=\"dp, pesquisa binária na resposta\">\u003c/div>\n    \u003cdiv>\u003clabel>Dificuldade que senti\u003c/label>\u003cselect id=\"diff\">${[\"\", \"1 – trivial\", \"2 – fácil\", \"3 – médio\", \"4 – difícil\", \"5 – não consegui sozinho\"].map(o => `\u003coption ${e.difficulty === o ? \"selected\" : \"\"}>${o}\u003c/option>`).join(\"\")}\u003c/select>\u003c/div>\u003c/div>`;\n  for (const [k, label, ph, kind] of FIELDS) {\n    html += `\u003clabel>${label}\u003c/label>` + (kind === \"line\"\n      ? `\u003cinput type=\"text\" data-f=\"${k}\" placeholder=\"${esc(ph)}\" value=\"${esc(e.f[k] || \"\")}\">`\n      : `\u003ctextarea data-f=\"${k}\" class=\"${kind === \"code\" ? \"code\" : \"\"}\" spellcheck=\"${kind === \"code\" ? \"false\" : \"true\"}\" placeholder=\"${esc(ph)}\">${esc(e.f[k] || \"\")}\u003c/textarea>`);\n  }\n  html += `\u003c/div>\u003cdiv class=\"card\">\u003ch2>Flashcards deste problema\u003c/h2>\n    \u003clabel style=\"margin:0;color:var(--text)\">\u003cinput type=\"checkbox\" id=\"auto\" ${e.auto !== false ? \"checked\" : \"\"}> Cartão automático: “Como se resolve este problema?” → ideia-chave, esboço, complexidade, armadilhas\n    \u003cspan class=\"muted\">(fica ativo quando preencheres a ideia-chave ou o esboço)\u003c/span>\u003c/label>\n    \u003ch3>Cartões extra\u003c/h3>\u003cdiv id=\"xcards\">\u003c/div>\u003cbutton class=\"b\" id=\"addcard\">+ Adicionar cartão\u003c/button>\u003c/div>`;\n  $(\"#main\").innerHTML = html;\n  $(\"#back\").onclick = () => { cur = null; go(\"journal\"); };\n  $(\"#del\").onclick = () => { if (confirm(\"Apagar esta entrada do diário e os flashcards dela?\")) { delete S.entries[cur]; cur = null; save(); go(\"journal\"); } };\n  $(\"#ename\").oninput = ev => { e.name = ev.target.value; touch(e); };\n  $(\"#mytags\").oninput = ev => { e.myTags = ev.target.value; touch(e); };\n  $(\"#diff\").onchange = ev => { e.difficulty = ev.target.value; touch(e); };\n  $(\"#auto\").onchange = ev => { e.auto = ev.target.checked; touch(e); };\n  $(\"#main\").querySelectorAll(\"[data-f]\").forEach(t => {\n    t.oninput = () => { e.f[t.dataset.f] = t.value; touch(e); };\n    if (t.classList.contains(\"code\")) t.onkeydown = ev => { if (ev.key === \"Tab\") { ev.preventDefault(); t.setRangeText(\"\\t\", t.selectionStart, t.selectionEnd, \"end\"); t.oninput(); } };\n  });\n  const drawCards = () => {\n    $(\"#xcards\").innerHTML = (e.cards || []).map((c, i) => `\u003cdiv class=\"grid2\" style=\"margin-bottom:8px\">\n      \u003ctextarea data-c=\"${i}\" data-k=\"q\" placeholder=\"Pergunta (ex.: Porque é que o greedy funciona?)\">${esc(c.q)}\u003c/textarea>\n      \u003cdiv class=\"row\" style=\"align-items:flex-start\">\u003ctextarea class=\"grow\" data-c=\"${i}\" data-k=\"a\" placeholder=\"Resposta\">${esc(c.a)}\u003c/textarea>\n      \u003cbutton class=\"b danger\" data-rm=\"${i}\" title=\"Remover cartão\">✕\u003c/button>\u003c/div>\u003c/div>`).join(\"\") || `\u003cdiv class=\"muted small\" style=\"margin-bottom:8px\">Ainda nenhum.\u003c/div>`;\n    $(\"#xcards\").querySelectorAll(\"textarea\").forEach(t => t.oninput = () => { e.cards[+t.dataset.c][t.dataset.k] = t.value; touch(e); });\n    $(\"#xcards\").querySelectorAll(\"[data-rm]\").forEach(b => b.onclick = () => { e.cards.splice(+b.dataset.rm, 1); touch(e); drawCards(); });\n  };\n  drawCards();\n  $(\"#addcard\").onclick = () => { (e.cards = e.cards || []).push({ id: uid(), q: \"\", a: \"\", srs: newSrs() }); touch(e); drawCards(); };\n}\n\nfunction cardFront(c) {\n  const e = c.e;\n  const head = `\u003cdiv class=\"small muted\">${judgeTag(e.judge)} ${esc(e.name)}${safeUrl(e.url) ? ` · \u003ca href=\"${esc(e.url)}\" target=\"_blank\" rel=\"noopener\">abrir problema\u003c/a>` : \"\"}\u003c/div>`;\n  if (c.auto) return head + `\u003cdiv class=\"q\" style=\"margin-top:10px\">Como se resolve este problema?\u003c/div>${e.f.statement ? `\u003cdiv class=\"pre\">${esc(e.f.statement)}\u003c/div>` : \"\"}`;\n  return head + `\u003cdiv class=\"q pre\" style=\"margin-top:10px\">${esc(c.c.q)}\u003c/div>`;\n}\nfunction cardBack(c) {\n  if (!c.auto) return `\u003cdiv class=\"pre\">${esc(c.c.a)}\u003c/div>`;\n  const f = c.e.f, part = (k, t) => f[k] ? `\u003ch4>${t}\u003c/h4>\u003cdiv class=\"pre\">${esc(f[k])}\u003c/div>` : \"\";\n  return part(\"idea\", \"Ideia-chave\") + part(\"approach\", \"Esboço da solução\") + part(\"complexity\", \"Complexidade\") + part(\"pitfalls\", \"Erros e armadilhas\") + part(\"takeaway\", \"Lição\")\n    + (f.code ? `\u003cdetails>\u003csummary class=\"muted small\" style=\"margin-top:12px;cursor:pointer\">Mostrar código\u003c/summary>\u003cpre>${esc(f.code)}\u003c/pre>\u003c/details>` : \"\");\n}\nconst dayKey = () => { const d = new Date(); return d.getFullYear() + \"-\" + String(d.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(d.getDate()).padStart(2, \"0\"); };\n// cards per day: the limit set on the home page, minus the ones already reviewed today\nfunction cardsLeft() { let n = 20; try { const c = (JSON.parse(localStorage.getItem(\"cpcoach.v1\")) || {}).set || {}; if (c.cards >= 0) n = +c.cards; } catch (e) {} return Math.max(0, n - ((S.revlog || {})[dayKey()] || 0)); }\nfunction viewCards() {\n  const all = allCards(), due = all.filter(c => c.srs.due \u003c= Date.now());\n  if (!rev) {\n    const soon = all.filter(c => c.srs.due > Date.now()).sort((a, b) => a.srs.due - b.srs.due)[0];\n    $(\"#main\").innerHTML = `\u003ch2>Flashcards\u003c/h2>\u003cdiv class=\"card\">\n      \u003cdiv style=\"font-size:17px\">\u003cb>${due.length}\u003c/b> cartão(ões) por rever · ${all.length} no total\u003c/div>\n      \u003cdiv class=\"small muted\" style=\"margin:6px 0 14px\">${all.length ? (soon && !due.length ? \"Próximo cartão em \" + esc(new Date(soon.srs.due).toLocaleString(\"pt-PT\")) + \".\" : \"Os cartões que acertas voltam com intervalos cada vez maiores.\") : \"Os cartões são criados a partir do diário: preenche a ideia-chave de um problema ou adiciona cartões extra dentro de uma entrada.\"}\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton class=\"b primary\" id=\"startDue\" ${due.length && cardsLeft() ? \"\" : \"disabled\"}>Rever ${Math.min(due.length, cardsLeft())} cartão(ões) de hoje\u003c/button>\n      ${due.length > cardsLeft() ? `\u003cbutton class=\"b\" id=\"startMore\">Rever todos os ${due.length} pendentes\u003c/button>` : \"\"}\n      \u003cbutton class=\"b\" id=\"startAll\" ${all.length ? \"\" : \"disabled\"}>Praticar todos (não altera o calendário)\u003c/button>\u003c/div>\u003c/div>`;\n    const startDue = n => { rev = { q: due.sort((a, b) => a.srs.due - b.srs.due).slice(0, n), i: 0, show: false, sched: true, n: 0, seen: new Set() }; viewCards(); };\n    $(\"#startDue\").onclick = () => startDue(cardsLeft());\n    if ($(\"#startMore\")) $(\"#startMore\").onclick = () => startDue(due.length);\n    $(\"#startAll\").onclick = () => { rev = { q: all.sort(() => Math.random() - .5), i: 0, show: false, sched: false, n: 0 }; viewCards(); };\n    return;\n  }\n  if (rev.i >= rev.q.length) {\n    $(\"#main\").innerHTML = `\u003ch2>Flashcards\u003c/h2>\u003cdiv class=\"card\">Feito: ${rev.n} cartão(ões) revisto(s). \u003cbutton class=\"b\" id=\"fin\">Voltar\u003c/button>\u003c/div>`;\n    $(\"#fin\").onclick = () => { rev = null; viewCards(); };\n    return;\n  }\n  const c = rev.q[rev.i];\n  $(\"#main\").innerHTML = `\u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003ch2 class=\"grow\" style=\"margin:0\">Cartão ${rev.i + 1} de ${rev.q.length}\u003c/h2>\n    \u003cbutton class=\"b\" id=\"edit\">Abrir entrada do diário\u003c/button>\u003cbutton class=\"b\" id=\"quit\">Parar\u003c/button>\u003c/div>\n    \u003cdiv class=\"card fc\">${cardFront(c)}${rev.show ? `\u003chr style=\"border:0;border-top:1px solid var(--line);margin:16px 0\">${cardBack(c)}` : \"\"}\u003c/div>\n    ${!rev.show ? `\u003cbutton class=\"b primary\" id=\"show\" style=\"width:100%;padding:10px\">Mostrar resposta \u003ckbd>Espaço\u003c/kbd>\u003c/button>`\n      : rev.sched ? `\u003cdiv class=\"grades\">${[\"Outra vez\", \"Difícil\", \"Bom\", \"Fácil\"].map((g, i) => `\u003cbutton class=\"b\" data-g=\"${i}\">${g} \u003ckbd>${i + 1}\u003c/kbd>\u003cdiv class=\"small muted\">${nextIvl(c.srs, i)}\u003c/div>\u003c/button>`).join(\"\")}\u003c/div>`\n      : `\u003cbutton class=\"b primary\" id=\"next\" style=\"width:100%;padding:10px\">Seguinte \u003ckbd>Espaço\u003c/kbd>\u003c/button>`}`;\n  $(\"#quit\").onclick = () => { rev = null; viewCards(); };\n  $(\"#edit\").onclick = () => { cur = c.e.key; rev = null; go(\"journal\"); };\n  if ($(\"#show\")) $(\"#show\").onclick = () => { rev.show = true; viewCards(); };\n  if ($(\"#next\")) $(\"#next\").onclick = () => answer(-1);\n  $(\"#main\").querySelectorAll(\"[data-g]\").forEach(b => b.onclick = () => answer(+b.dataset.g));\n}\nfunction answer(g) {\n  const c = rev.q[rev.i];\n  if (g >= 0) { grade(c.srs, g); if (g === 0) rev.q.push(c); if (rev.seen && !rev.seen.has(c)) { rev.seen.add(c); S.revlog = S.revlog || {}; S.revlog[dayKey()] = (S.revlog[dayKey()] || 0) + 1; } save(); }\n  rev.n++; rev.i++; rev.show = false; viewCards();\n}\ndocument.addEventListener(\"keydown\", e => {\n  if (tab !== \"cards\" || !rev || rev.i >= rev.q.length || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;\n  if (e.key === \" \" || e.key === \"Enter\") { e.preventDefault(); if (!rev.show) { rev.show = true; viewCards(); } else if (!rev.sched) answer(-1); }\n  else if (rev.show && rev.sched && \"1234\".includes(e.key)) answer(+e.key - 1);\n});\n\nfunction viewData() {\n  const vjUrl = u => \"https://vjudge.net/status/data?draw=1&start=0&length=100&res=1&un=\" + encodeURIComponent(u);\n  $(\"#main\").innerHTML = `\u003ch2>Contas e importação\u003c/h2>\n  \u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">Codeforces\u003c/h3>\n    \u003clabel>Handle\u003c/label>\u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"cf\" class=\"grow\" value=\"${esc(S.settings.cf)}\" placeholder=\"o teu handle\">\n    \u003cbutton class=\"b primary\" id=\"cfgo\">Guardar e carregar resolvidos\u003c/button>\u003c/div>\u003cdiv id=\"cfmsg\" class=\"msg\">\u003c/div>\n    \u003cdiv class=\"small muted\">Carregado diretamente da API do Codeforces, com datas de resolução.\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">VJudge\u003c/h3>\n    \u003clabel>Nome de utilizador\u003c/label>\u003cinput type=\"text\" id=\"vj\" value=\"${esc(S.settings.vj)}\" placeholder=\"o teu utilizador do VJudge\">\n    \u003col class=\"small\">\u003cli>Abre \u003ca id=\"vjlink\" href=\"#\" target=\"_blank\" rel=\"noopener\">as tuas submissões aceites (página de dados)\u003c/a>. Mostra texto em bruto.\u003c/li>\n    \u003cli>Seleciona tudo (\u003ckbd>Ctrl\u003c/kbd>+\u003ckbd>A\u003c/kbd>), copia e cola na caixa abaixo.\u003c/li>\u003c/ol>\n    \u003ctextarea id=\"vjpaste\" placeholder=\"Cola aqui o texto do VJudge\">\u003c/textarea>\u003cdiv id=\"vjmsg\" class=\"msg\">\u003c/div>\n    \u003cdiv class=\"small muted\">O VJudge não deixa outras páginas lerem os dados diretamente, daí o copiar e colar. Traz as tuas últimas 100 submissões aceites, com datas.\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">CSES\u003c/h3>\n    \u003col class=\"small\">\u003cli>Inicia sessão e abre \u003ca href=\"https://cses.fi/problemset/\" target=\"_blank\" rel=\"noopener\">cses.fi/problemset\u003c/a>.\u003c/li>\n    \u003cli>Seleciona a página toda (\u003ckbd>Ctrl\u003c/kbd>+\u003ckbd>A\u003c/kbd>), copia e cola na caixa abaixo.\u003c/li>\n    \u003cli>Se não forem encontrados problemas resolvidos, abre o código-fonte da página (\u003ckbd>Ctrl\u003c/kbd>+\u003ckbd>U\u003c/kbd>), seleciona tudo, copia e cola isso.\u003c/li>\u003c/ol>\n    \u003ctextarea id=\"csespaste\" placeholder=\"Cola aqui a página do CSES\">\u003c/textarea>\u003cdiv id=\"csesmsg\" class=\"msg\">\u003c/div>\n    \u003cdiv class=\"small muted\">O CSES não mostra quando um problema foi resolvido. A primeira importação só regista o que já tinhas resolvido (fica sem data);\n    depois disso, cada problema novo fica com a data da importação que o vê pela primeira vez, por isso importa outra vez depois de resolveres.\n    ${S.cses.last ? \"Última importação: \" + esc(new Date(S.cses.last).toLocaleString(\"pt-PT\")) + \".\" : \"Ainda não importado.\"}\u003c/div>\u003c/div>`;\n  const setVj = () => { $(\"#vjlink\").href = vjUrl(S.settings.vj.trim()); };\n  setVj();\n  $(\"#vj\").oninput = e => { S.settings.vj = e.target.value; save(); setVj(); };\n  $(\"#vjlink\").onclick = e => { if (!S.settings.vj.trim()) { e.preventDefault(); say(\"vjmsg\", \"Escreve primeiro o teu utilizador do VJudge.\", true); } };\n  $(\"#cfgo\").onclick = async () => {\n    S.settings.cf = $(\"#cf\").value.trim(); save(); say(\"cfmsg\", \"A carregar…\");\n    try { const p = JSON.parse(localStorage.getItem(\"cptools.profile\")) || {}; p.handle = S.settings.cf; localStorage.setItem(\"cptools.profile\", JSON.stringify(p)); } catch (e) {}\n    try { say(\"cfmsg\", (await fetchCF()) + \" problema(s) resolvido(s) novo(s) carregado(s).\"); } catch (err) { say(\"cfmsg\", err.message, true); }\n  };\n  $(\"#vjpaste\").onpaste = e => {\n    e.preventDefault();\n    try { const r = importVJ(e.clipboardData.getData(\"text/plain\")); say(\"vjmsg\", `${r.ac} submissão(ões) aceite(s) lida(s), ${r.n} problema(s) novo(s) adicionado(s).`); }\n    catch (err) { say(\"vjmsg\", err.message, true); }\n  };\n  $(\"#csespaste\").onpaste = e => {\n    e.preventDefault();\n    const h = e.clipboardData.getData(\"text/html\"), t = e.clipboardData.getData(\"text/plain\");\n    const tries = [h, t].filter(x => x && x.includes(\"/problemset/task/\"));\n    try {\n      if (!tries.length) throw new Error(\"Não encontrei problemas do CSES no que colaste.\");\n      // prefer the variant in which solved marks survived the copy\n      const pre = new DOMParser();\n      const best = tries.find(x => pre.parseFromString(x, \"text/html\").querySelector(\".full\")) || null;\n      if (!best) throw new Error(\"Encontrei problemas, mas nenhum marcado como resolvido. Tens sessão iniciada? Se sim, usa o código-fonte da página (passo 3).\");\n      const r = importCSES(best);\n      say(\"csesmsg\", r.first ? `Primeira importação: ${r.solved} problema(s) resolvido(s) registado(s) sem data. Os que resolveres a partir de agora ficam datados na próxima importação.`\n        : `${r.solved} problema(s) resolvido(s) visto(s), ${r.n} novo(s) desde a última importação (com a data de agora).`);\n    } catch (err) { say(\"csesmsg\", err.message, true); }\n  };\n}\nfunction say(id, text, bad) { const m = $(\"#\" + id); m.className = \"msg \" + (bad ? \"err\" : \"ok\"); m.textContent = text; }\n\naddEventListener(\"message\", e => { if (e.data === \"cptools-cards\") { rev = null; go(\"cards\"); } });\nrender();\nif (S.settings.cf) fetchCF().then(() => { if (tab === \"pick\") viewPick(); }).catch(() => {});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "stats": "\u003c!doctype html>\u003chtml lang=\"pt\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Treino\u003c/title>\n\u003cstyle>\n:root{--bg:#0f1317;--fg:#e6e9ec;--mut:#98a2ad;--line:#2a3138;--card:#171c22;--acc:#6cb0ff;--ok:#56c271;--bad:#ef6b73;--warn:#e5a84b}\n*{box-sizing:border-box}\nbody{font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:980px;margin:0 auto;padding:20px}\nh1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:26px 0 8px}h3{font-size:15px;margin:0}\na{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}\n.mut{color:var(--mut)}.small{font-size:13px}\nbutton{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}\nbutton:hover{border-color:var(--acc)}\nbutton.pri{background:var(--acc);border-color:var(--acc);color:#0c1220;font-weight:600}\nbutton.sm{padding:2px 8px;font-size:13px}button.del{color:var(--bad)}\ninput[type=text],input[type=date],input[type=number],textarea,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}\ntextarea{width:100%;min-height:54px;resize:vertical}\n.card{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:12px 14px;background:var(--card)}\n.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n@media(max-width:700px){.grid{grid-template-columns:1fr}}\n.big{font-size:26px;font-weight:700}\n.bar{height:6px;background:var(--bg);border-radius:3px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}.bar i.full{background:var(--ok)}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:140px}\ntable{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;font-size:14px}\nth:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:13px}\ntd input[type=number]{width:58px;text-align:center}\ntr.now td{background:#1b2532}\n.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}\n.k{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px;white-space:nowrap}\n.k.late{border-color:var(--warn);color:var(--warn)}\n.done-t{text-decoration:line-through;opacity:.6}\nsvg{display:block;width:100%;height:auto}\nsvg text{fill:var(--mut);font-size:11px}\ncircle.pt{cursor:pointer}\n.fld{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}\n\u003c/style>\u003cstyle>\n/* one look for every tool */\n:root{--bg:#0f1317;--card:#171c22;--card2:#1e252d;--panel:#171c22;--panel2:#1e252d;--line:#2a3138;--border:#2a3138;--text:#e6e9ec;--fg:#e6e9ec;--muted:#98a2ad;--mut:#98a2ad;--accent:#6cb0ff;--acc:#6cb0ff;--ok:#56c271;--green:#56c271;--warn:#e5a84b;--yellow:#e5a84b;--bad:#ef6b73;--red:#ef6b73}\nbody{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:15px}\n.container{max-width:980px;padding:20px}\n\u003c/style>\u003cbase target=\"_blank\">\u003c/head>\u003cbody>\n\u003cdiv id=\"view\">\u003c/div>\n\u003cscript>\n\"use strict\";\nconst VIEW=\"stats\",KEY='cpcoach.v1',CKEY='cpcoach.cache',PKEY='cptools.profile';\nconst WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],WK=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];\nconst esc=s=>String(s==null?'':s).replace(/[&\u003c>\"]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\nconst today=ymd(new Date());\nconst addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};\nconst fmtD=s=>{const d=new Date(s+'T12:00');return WD[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)};\nconst fmtL=s=>{const d=new Date(s+'T12:00');return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};\nconst monday=d=>{const x=new Date(d+'T12:00');return addD(d,-((x.getDay()+6)%7))};\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);\nconst safe=u=>/^https?:\\/\\//i.test(u||'')?u:'#';\nconst jget=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};\nconst FIELDS=[['tec','Técnicas','exercícios de técnicas','plano','min de técnicas (estimados)'],['tr','CF Trainer','problemas no CF Trainer','trainer','min no CF Trainer'],['sim','Simulações','simulações de concurso','','simulações de concurso']];\nconst TAGNAME={'dp':'Programação dinâmica','graphs':'Grafos','trees':'Árvores','strings':'Strings','math':'Matemática','number theory':'Teoria dos números','data structures':'Estruturas de dados','geometry':'Geometria','combinatorics':'Combinatória','greedy':'Greedy','binary search':'Pesquisa binária','dsu':'DSU','shortest paths':'Caminhos mais curtos','bitmasks':'Bitmasks','two pointers':'Two pointers','constructive algorithms':'Construtivos','dfs and similar':'DFS/BFS','probabilities':'Probabilidades','games':'Jogos','flows':'Fluxos','divide and conquer':'Divide and conquer','hashing':'Hashing','implementation':'Implementação','brute force':'Força bruta','sortings':'Ordenação','interactive':'Interativos','matrices':'Matrizes','string suffix structures':'Estruturas de sufixos','graph matchings':'Emparelhamentos','fft':'FFT','ternary search':'Pesquisa ternária','meet-in-the-middle':'Meet in the middle','2-sat':'2-SAT','chinese remainder theorem':'Teorema chinês dos restos','schedules':'Escalonamento','expression parsing':'Parsing','*special':'Especiais'};\nconst tagPt=t=>TAGNAME[t]?TAGNAME[t]+' ('+t+')':t;\n\n/* ---------- state ---------- */\nlet C,K;\nfunction load(){\n  C=jget(KEY)||{};C.v=1;C.weeks=C.weeks||{};C.sim=C.sim||{};C.notes=C.notes||[];C.rec=C.rec||{};C.cnote=C.cnote||{};C.set=Object.assign({drop:60,cards:20,minDay:((jget('cptech.v1')||{}).set||{}).minDay||90},C.set||{});C.upskip=C.upskip||{};delete C.mode;\n  if(!Array.isArray(C.contests))C.contests=[];\n  K=jget(CKEY)||{};\n}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}};\n// The Codeforces handle is shared by every tool. Data from before this had it in the trainer or in the journal.\nfunction handle(){const p=jget(PKEY)||{};if(p.handle)return p.handle;const a=jget('cfTrainerState')||{};if(a.handle)return a.handle;return((jget('cpjournal.v1')||{}).settings||{}).cf||''}\nfunction setHandle(h){const p=jget(PKEY)||{};p.handle=h;localStorage.setItem(PKEY,JSON.stringify(p));\n  const R=jget('cfTrainerState');if(R){R.handle=h;localStorage.setItem('cfTrainerState',JSON.stringify(R))}\n  parent.postMessage({cptools:'drop',tabs:['trainer','journal']},'*')} // those two read the handle when they open\n\n/* ---------- weekly goals ----------\n   A week's goals are per day: technique work and CF Trainer work in minutes (unit 'min') or as a number of\n   exercises (unit 'n', the older way), and a number of contest simulations. */\nconst hasPlan=m=>C.weeks[m]&&Array.isArray(C.weeks[m].days);\nconst trLimit=()=>+(jget('cfTrainerState')||{}).timeLimit||40;\n// The plan that applies to a week: its own, else the most recent earlier one, else a default.\nfunction planOf(m){\n  if(hasPlan(m)){const w=C.weeks[m];if(w.unit!=='min')w.unit='n';return w}\n  let k=null;for(const x of Object.keys(C.weeks).sort())if(x\u003cm&&hasPlan(x))k=x;\n  if(k)return {unit:C.weeks[k].unit==='min'?'min':'n',days:C.weeks[k].days.map(d=>({tec:d.tec,tr:d.tr,sim:d.sim,note:''})),goal:'',from:k};\n  const md=C.set.minDay;\n  return {unit:'min',days:WK.map(()=>({tec:md,tr:0,sim:0,note:''})),goal:'',from:null};\n}\n// A week can be edited until the Sunday before it starts. A week with no plan of its own can still be set on the day it is first opened.\nfunction editable(m){if(today\u003cm)return true;if(monday(today)!==m)return false;return !hasPlan(m)||C.weeks[m].made===today}\nfunction own(m){if(!hasPlan(m)){const p=planOf(m);C.weeks[m]=Object.assign(C.weeks[m]||{},{unit:p.unit,days:p.days,goal:'',made:today})}return C.weeks[m]}\nconst modeOf=m=>hasPlan(m)&&(C.weeks[m].mode==='rev'||C.weeks[m].mode==='off')?C.weeks[m].mode:'normal';\nconst MODES=[['normal','Normal'],['rev','Só revisões (nada de técnicas novas)'],['off','Pausa (sem técnicas)']];\nconst fmtV=(n,f,unit)=>Math.round(n)+(unit==='min'&&f!=='sim'?' min':'');\n\n/* ---------- what was actually done ---------- */\nfunction actuals(){\n  const n={tec:{},tr:{},sim:{}},min={tec:{},tr:{}};\n  const add=(o,d,v)=>{o[d]=(o[d]||0)+v};\n  const T=jget('cptech.v1');\n  if(T&&Array.isArray(T.techs))for(const t of T.techs){\n    for(const p of t.probs||[])if(p.done){add(n.tec,p.done,1);add(min.tec,p.done,p.min||45)} // technique minutes are the problem's estimate, not measured\n    for(const l of t.log||[])if(l.s>=3){add(n.tec,l.d,1);add(min.tec,l.d,25)}}\n  const R=jget('cfTrainerState');\n  if(R&&Array.isArray(R.history))for(const h of R.history){const d=ymd(new Date(h.ts));add(n.tr,d,1);add(min.tr,d,typeof h.elapsedMs==='number'?h.elapsedMs/6e4:trLimit())}\n  for(const d in (K.days||{}))if(K.days[d][1])n.sim[d]=K.days[d][1];\n  const tc=new Set(); // a 3-problem contest of the trainer is one simulation\n  if(R&&Array.isArray(R.history))for(const h of R.history)if(h.contest&&!tc.has(h.contest)){tc.add(h.contest);add(n.sim,ymd(new Date(h.contest)),1)}\n  for(const d in C.sim)if(C.sim[d])add(n.sim,d,C.sim[d]);\n  return {n,min};\n}\nconst got=(A,f,d,unit)=>((unit==='min'&&f!=='sim'?A.min:A.n)[f][d])||0;\n\n/* ---------- Codeforces data (kept in this browser only; fetched again on other computers) ---------- */\nlet fetching=false,ferr='';\nconst ratingAt=(R,t)=>{let r=0;for(const x of R){if(x.t\u003c=t)r=x.n;else break}return r||(R[0]?R[0].o:0)||1400};\nasync function sync(force){\n  const h=handle();if(!h||fetching)return;\n  if(!force&&K.h===h&&K.v===2&&Date.now()-(K.at||0)\u003c10*60e3)return;\n  fetching=true;ferr='';render();\n  try{\n    const api=async q=>{const r=await(await fetch('https://codeforces.com/api/'+q+(q.includes('?')?'&':'?')+'lang=en')).json();if(r.status!=='OK')throw new Error(r.comment||'erro');return r.result};\n    const rating=(await api('user.rating?handle='+encodeURIComponent(h))).map(r=>({id:r.contestId,name:r.contestName,rank:r.rank,t:r.ratingUpdateTimeSeconds,o:r.oldRating,n:r.newRating}));\n    const subs=(await api('user.status?handle='+encodeURIComponent(h))).reverse();\n    const days={},solved={},virt=new Set(),parts={};\n    for(const s of subs){\n      const d=ymd(new Date(s.creationTimeSeconds*1000)),pt=s.author&&s.author.participantType;\n      if(pt==='VIRTUAL'){const k=s.contestId+'|'+s.author.startTimeSeconds;if(!virt.has(k)){virt.add(k);(days[d]=days[d]||[0,0])[1]++}}\n      if(!s.problem)continue;\n      const cid=s.problem.contestId||s.contestId;\n      // work done inside a contest (official, out of competition or virtual): which problems fell, and with how many wrong tries\n      if((pt==='CONTESTANT'||pt==='VIRTUAL'||pt==='OUT_OF_COMPETITION')&&s.contestId\u003c100000){\n        const P=parts[s.contestId]=parts[s.contestId]||{id:s.contestId,t:s.author.startTimeSeconds||s.creationTimeSeconds,virt:pt==='VIRTUAL',ok:{},wa:{}};\n        const ix=s.problem.index;\n        if(s.verdict==='OK')P.ok[ix]=1;else if(!P.ok[ix]&&s.verdict&&s.verdict!=='COMPILATION_ERROR'&&s.verdict!=='TESTING'&&s.verdict!=='SKIPPED')P.wa[ix]=(P.wa[ix]||0)+1}\n      if(s.verdict==='OK'){const k=cid+s.problem.index;if(!solved[k]){solved[k]=d;(days[d]=days[d]||[0,0])[0]++}}\n    }\n    let up=[];try{up=(await api('contest.list?gym=false')).filter(c=>c.phase==='BEFORE').sort((a,b)=>a.startTimeSeconds-b.startTimeSeconds).slice(0,4).map(c=>({id:c.id,name:c.name,t:c.startTimeSeconds}))}catch(e){}\n    // problems of the contests taken part in: one big request, repeated only for a new contest or while a recent one has no ratings yet\n    let cp=K.h===h&&K.cp||{},psAt=K.h===h&&K.psAt||0;\n    const recent=Date.now()/1000-21*86400;\n    const need=Object.values(parts).some(P=>!cp[P.id]||(P.t>recent&&cp[P.id].some(p=>!p[2])&&Date.now()-psAt>6*36e5));\n    if(need){try{const ps=(await api('problemset.problems')).problems;cp={};\n      for(const p of ps)if(parts[p.contestId])(cp[p.contestId]=cp[p.contestId]||[]).push([p.index,p.name,p.rating||0,p.tags||[]]);\n      for(const P of Object.values(parts)){cp[P.id]=cp[P.id]||[];cp[P.id].sort((a,b)=>a[0]\u003cb[0]?-1:1)}psAt=Date.now()}catch(e){}}\n    // per tag: problems within reach in those contests (rated up to 200 above the rating held then) and how many were solved during the contest\n    const tags={},cur=rating.length?rating[rating.length-1].n:0;\n    for(const P of Object.values(parts)){\n      const off=rating.find(r=>r.id===P.id&&!P.virt),R=off?(off.o||1400):ratingAt(rating,P.t);P.r=R;\n      for(const p of cp[P.id]||[]){const rt=p[2],ok=!!P.ok[p[0]];if(!rt||(rt>R+200&&!ok))continue;\n        for(const tg of p[3]){if(tg[0]==='*')continue;const x=tags[tg]=tags[tg]||{e:[0,0],l:[0,0],wa:0,ok:0};\n          const b=rt\u003c=R-200?x.e:x.l;b[0]++;if(ok){b[1]++;x.ok++;x.wa+=P.wa[p[0]]||0}}}}\n    // upsolving: unsolved problems of contests of the last 21 days\n    const ups=[];\n    for(const P of Object.values(parts).filter(P=>P.t>recent).sort((a,b)=>b.t-a.t)){let free=2;\n      for(const p of cp[P.id]||[]){if(solved[P.id+p[0]])continue;\n        if(p[2]?p[2]\u003c=(cur||P.r)+300:free-->0)ups.push({k:P.id+p[0],c:P.id,i:p[0],name:p[1],r:p[2],t:P.t,virt:P.virt,tried:!!P.wa[p[0]]})}}\n    K={v:2,h,at:Date.now(),rating,days,up,cp,psAt,tags,ups,nparts:Object.keys(parts).length};\n    try{localStorage.setItem(CKEY,JSON.stringify(K))}catch(e){}\n  }catch(e){ferr='Não consegui ler o Codeforces ('+e.message+').'}\n  fetching=false;render();\n}\n// tags ordered from weakest: lowest share solved among problems at the user's level, with enough problems to mean something\nfunction tagRows(){\n  const rows=Object.entries(K.tags||{}).map(([t,x])=>({t,e:x.e,l:x.l,n:x.e[0]+x.l[0],rate:x.l[0]?x.l[1]/x.l[0]:null,wa:x.ok?x.wa/x.ok:0}));\n  const L=rows.reduce((a,r)=>[a[0]+r.l[0],a[1]+r.l[1]],[0,0]),avg=L[0]?L[1]/L[0]:0;\n  rows.sort((a,b)=>(a.rate==null)-(b.rate==null)||a.rate-b.rate||b.l[0]-a.l[0]);\n  const weak=rows.filter(r=>r.l[0]>=5&&r.rate\u003cavg).slice(0,3).map(r=>r.t);\n  return {rows,avg,weak};\n}\nfunction trainTag(tg){\n  const R=jget('cfTrainerState')||{rating:1200,history:[],handle:handle(),timeLimit:40};\n  R.filters=Object.assign({},R.filters||{},{tags:tg?[tg]:[]});\n  localStorage.setItem('cfTrainerState',JSON.stringify(R));\n  parent.postMessage({cptools:'show',tab:'trainer',reload:true},'*');\n}\nfunction addTech(tg){localStorage.setItem('cptech.req',JSON.stringify({name:TAGNAME[tg]||tg}));go('plano')}\nfunction ratingIn(a,b){ // rating change between two dates (inclusive), from official rounds\n  const R=(K.rating||[]).filter(r=>{const d=ymd(new Date(r.t*1000));return d>=a&&d\u003c=b});\n  return R.length?{n:R.length,from:R[0].o,to:R[R.length-1].n}:null;\n}\nconst go=(t,msg)=>parent.postMessage({cptools:'show',tab:t,msg},'*');\n\n/* ---------- home ---------- */\nfunction weekTable(m,edit){\n  const p=planOf(m),A=actuals(),u=p.unit;\n  let h='\u003ctable>\u003ctr>\u003cth>\u003c/th>'+FIELDS.map(f=>'\u003cth>'+f[1]+(u==='min'&&f[0]!=='sim'?' (min)':'')+'\u003c/th>').join('')+'\u003cth style=\"text-align:left\">Nota do dia\u003c/th>\u003c/tr>';\n  const tot={},dn={};\n  WK.forEach((w,i)=>{const d=addD(m,i),g=p.days[i]||{};\n    h+='\u003ctr class=\"'+(d===today?'now':'')+'\">\u003ctd>'+w+' '+d.slice(8)+'/'+d.slice(5,7)+'\u003c/td>';\n    for(const f of FIELDS){const goal=+g[f[0]]||0,done=Math.round(got(A,f[0],d,u));tot[f[0]]=(tot[f[0]]||0)+goal;dn[f[0]]=(dn[f[0]]||0)+done;\n      if(edit)h+='\u003ctd>\u003cinput type=\"number\" min=\"0\" step=\"'+(u==='min'&&f[0]!=='sim'?15:1)+'\" data-w=\"'+m+'\" data-i=\"'+i+'\" data-f=\"'+f[0]+'\" value=\"'+goal+'\">\u003c/td>';\n      else h+='\u003ctd>'+(d>today?'\u003cspan class=\"mut\">'+goal+'\u003c/span>':'\u003cspan class=\"'+(done>=goal?(goal||done?'ok':'mut'):d\u003ctoday?'bad':'')+'\">'+done+'\u003c/span>\u003cspan class=\"mut\"> / '+goal+'\u003c/span>')+'\u003c/td>'}\n    h+='\u003ctd style=\"text-align:left\">'+(edit?'\u003cinput type=\"text\" style=\"width:100%\" data-w=\"'+m+'\" data-i=\"'+i+'\" data-f=\"note\" value=\"'+esc(g.note||'')+'\" placeholder=\"ex.: concurso às 14h35\">':'\u003cspan class=\"small\">'+esc(g.note||'')+'\u003c/span>')+'\u003c/td>\u003c/tr>'});\n  h+='\u003ctr>\u003cth>Semana\u003c/th>'+FIELDS.map(f=>'\u003cth>'+(edit?fmtV(tot[f[0]],f[0],u):dn[f[0]]+' / '+fmtV(tot[f[0]],f[0],u))+'\u003c/th>').join('')+'\u003cth>\u003c/th>\u003c/tr>\u003c/table>';\n  return h;\n}\nfunction weekEdit(m){const p=planOf(m);\n  return '\u003cdiv class=\"row small\" style=\"margin-bottom:8px\">\u003cspan class=\"mut\">Técnicas e CF Trainer em\u003c/span>\u003cselect data-w=\"'+m+'\" data-f=\"unit\">\u003coption value=\"min\"'+(p.unit==='min'?' selected':'')+'>minutos\u003c/option>\u003coption value=\"n\"'+(p.unit==='n'?' selected':'')+'>número de exercícios\u003c/option>\u003c/select>'\n    +'\u003cspan class=\"mut\" style=\"margin-left:14px\">Carga de técnicas\u003c/span>\u003cselect data-w=\"'+m+'\" data-f=\"mode\">'+MODES.map(o=>'\u003coption value=\"'+o[0]+'\"'+(modeOf(m)===o[0]?' selected':'')+'>'+o[1]+'\u003c/option>').join('')+'\u003c/select>'\n    +'\u003cspan class=\"mut\">(para semanas de sobrecarga; vale só para esta semana)\u003c/span>\u003c/div>'\n    +weekTable(m,true)+'\u003cspan class=\"fld\">Objetivo da semana (texto livre)\u003c/span>\u003ctextarea data-w=\"'+m+'\" data-f=\"goal\" placeholder=\"ex.: fechar as revisões de strings; uma ronda Div. 2 virtual no sábado\">'+esc(hasPlan(m)?p.goal||'':'')+'\u003c/textarea>';\n}\n// what was planned and done in a week, as short text\nfunction weekSummary(m){\n  const p=planOf(m),A=actuals(),u=p.unit,bits=[];\n  for(const f of FIELDS){let d=0,g=0;for(let i=0;i\u003c7;i++){d+=got(A,f[0],addD(m,i),u);g+=+(p.days[i]||{})[f[0]]||0}\n    bits.push('\u003cb>'+f[1]+':\u003c/b> \u003cspan class=\"'+(g&&d>=g?'ok':g&&d\u003cg*.6?'bad':'')+'\">'+Math.round(d)+'\u003c/span> / '+fmtV(g,f[0],u))}\n  let cf=0;for(let i=0;i\u003c7;i++)cf+=((K.days||{})[addD(m,i)]||[0])[0];\n  bits.push('\u003cb>Resolvidos no Codeforces:\u003c/b> '+cf);\n  const r=ratingIn(m,addD(m,6));\n  if(r)bits.push('\u003cb>Rating:\u003c/b> '+r.from+' → '+r.to+' (\u003cspan class=\"'+(r.to>=r.from?'ok':'bad')+'\">'+(r.to>=r.from?'+':'')+(r.to-r.from)+'\u003c/span>, '+r.n+' ronda(s))');\n  return bits.join(' · ');\n}\n// The week whose review is due: this one on Sunday; otherwise last week, if it was planned or had any work and was not reviewed.\nfunction reviewWeek(){\n  const m=monday(today);\n  if(addD(m,6)===today)return m;\n  const pm=addD(m,-7),w=C.weeks[pm];\n  if(w&&w.rev&&w.rev.at)return null;\n  if(hasPlan(pm))return pm;\n  const A=actuals();for(let i=0;i\u003c7;i++)for(const f of FIELDS)if(got(A,f[0],addD(pm,i),'n'))return pm;\n  return null;\n}\nconst REVQ=[['good','O que correu bem'],['bad','O que correu mal (e porquê)'],['next','O que muda na próxima semana']];\nlet skipRev=false,editRev=false;\nfunction vHome(){\n  const m=monday(today),nm=addD(m,7),p=planOf(m),u=p.unit,A=actuals(),i=(new Date(today+'T12:00').getDay()+6)%7,g=p.days[i]||{};\n  const TD=jget('cptech.today'),J=jget('cpjournal.v1')||{},mode=modeOf(m);\n  let h='\u003ch1>Hoje, '+fmtD(today)+'\u003c/h1>';\n  const nx=C.contests.filter(c=>c.date&&c.date>=today).sort((a,b)=>a.date\u003cb.date?-1:1)[0];\n  const bits=[];\n  if(nx){const n=Math.round((new Date(nx.date+'T12:00')-new Date(today+'T12:00'))/864e5);bits.push('Próximo concurso: \u003cb>'+esc(nx.name)+'\u003c/b> '+(n?'daqui a '+n+' dia(s)':'hoje')+' ('+fmtL(nx.date)+')')}\n  if(K.up&&K.up.length){const x=K.up.filter(c=>c.t*1000>Date.now())[0];if(x)bits.push('Próxima ronda do Codeforces: \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://codeforces.com/contests/'+x.id+'\">'+esc(x.name)+'\u003c/a>, '+new Date(x.t*1000).toLocaleString('pt-PT',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}))}\n  h+='\u003cdiv class=\"mut\">'+(bits.join(' · ')||'Sem concursos com data marcada. Marca-os em Estatísticas.')+'\u003c/div>';\n  // first steps, until the basics are in place\n  const T0=jget('cptech.v1'),steps=[[!!handle(),'Escreve o teu handle do Codeforces','set','Definições'],[!!(T0&&T0.techs&&T0.techs.length),'Escolhe as técnicas que queres manter frescas','plano','Técnicas'],[Object.keys(C.weeks).some(hasPlan),'Define os objetivos da semana, mais abaixo nesta página','','']];\n  if(steps.some(x=>!x[0])&&!C.set.started)h+='\u003cdiv class=\"card\">\u003cb>Primeiros passos\u003c/b>'+steps.map(x=>'\u003cdiv class=\"row small\" style=\"margin-top:6px\">\u003cspan class=\"'+(x[0]?'ok':'mut')+'\">'+(x[0]?'✓':'○')+'\u003c/span>\u003cspan class=\"'+(x[0]?'done-t':'')+'\">'+x[1]+'\u003c/span>'+(x[2]&&!x[0]?'\u003cbutton class=\"sm\" data-go=\"'+x[2]+'\">Abrir '+x[3]+'\u003c/button>':'')+'\u003c/div>').join('')\n    +'\u003cdiv class=\"row small\" style=\"margin-top:8px\">\u003cspan class=\"mut\">Os dados ficam só neste browser até ligares um ficheiro («Ficheiro de dados», em cima à direita). O que cada separador faz está em Definições.\u003c/span>\u003cbutton class=\"sm\" data-act=\"started\">Esconder\u003c/button>\u003c/div>\u003c/div>';\n  if(mode!=='normal')h+='\u003cdiv class=\"card\">\u003cb class=\"warn\">Semana de carga reduzida:\u003c/b> '+(mode==='off'?'técnicas em pausa.':'só revisões, nenhuma técnica nova.')+' \u003cspan class=\"small mut\">O que ficar em atraso é redistribuído a partir da próxima semana normal, revisões primeiro.\u003c/span>\u003c/div>';\n  if(g.note)h+='\u003cdiv class=\"card\">\u003cb>Nota para hoje:\u003c/b> '+esc(g.note)+'\u003c/div>';\n  const goalOf=f=>f==='tec'&&mode==='off'?0:+g[f]||0;\n  h+='\u003cdiv class=\"grid\" style=\"margin-top:12px\">';\n  for(const f of FIELDS){const goal=goalOf(f[0]),done=Math.round(got(A,f[0],today,u));\n    h+='\u003cdiv class=\"card\">\u003cdiv class=\"mut small\">'+f[1]+'\u003c/div>\u003cdiv class=\"big '+(goal&&done>=goal?'ok':'')+'\">'+done+'\u003cspan class=\"mut\" style=\"font-size:16px;font-weight:400\"> / '+fmtV(goal,f[0],u)+'\u003c/span>\u003c/div>'\n     +'\u003cdiv class=\"bar\">\u003ci class=\"'+(done>=goal?'full':'')+'\" style=\"width:'+(goal?Math.min(100,100*done/goal):done?100:0)+'%\">\u003c/i>\u003c/div>\u003cdiv class=\"small mut\">'+(u==='min'?f[4]:f[2])+'\u003c/div>'\n     +(f[3]?'\u003cbutton class=\"sm\" style=\"margin-top:8px\" data-go=\"'+f[3]+'\">Abrir '+f[1]+'\u003c/button>'\n        :'\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"sm\" data-sim=\"1\" title=\"Conta uma simulação feita hoje\">+1 feita\u003c/button>'+(C.sim[today]?'\u003cbutton class=\"sm\" data-sim=\"-1\">−1\u003c/button>':'')+'\u003c/div>')+'\u003c/div>'}\n  h+='\u003c/div>';\n  // what to do\n  h+='\u003ch2>O que fazer hoje\u003c/h2>
