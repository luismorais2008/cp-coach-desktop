<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CP Tools</title>
<style>
html,body{margin:0;height:100%;background:#0f1317;color:#e6e9ec;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:6px;padding:6px 14px;background:#171c22;border-bottom:1px solid #2a3138;flex-wrap:wrap}
#bar b{margin-right:10px}
button{font:inherit;cursor:pointer}
#bar button{background:none;border:1px solid transparent;color:#98a2ad;padding:6px 13px;border-radius:6px}
#bar button.on{background:#1e252d;color:#e6e9ec;border-color:#6cb0ff}
#bar .sp{flex:1}
#bar button.x{border-color:#2a3138;font-size:13px}
#msg{font-size:13px;color:#56c271}
#st{font-size:13px;color:#98a2ad}#st.ok{color:#56c271}#st.bad{color:#ef6b73}
#frames{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0f1317}
iframe.hide{display:none}
#ov{position:fixed;inset:0;background:rgba(8,10,14,.8);display:none;align-items:center;justify-content:center;z-index:9}
#ov.on{display:flex}
#box{background:#171c22;border:1px solid #2a3138;border-radius:10px;padding:20px 22px;max-width:560px;margin:16px}
#box h3{margin:0 0 8px}#box p{margin:8px 0;color:#c3c8d4;font-size:14px}
#box button{background:#1e252d;border:1px solid #2a3138;color:#e6e9ec;padding:7px 13px;border-radius:6px;margin:6px 6px 0 0}
#box button.pri{background:#6cb0ff;border-color:#6cb0ff;color:#0c1220;font-weight:600}
#box code{background:#0f1317;padding:1px 5px;border-radius:4px}
</style>
</head>

<button data-t="journal">Diário e flashcards</button>
<button data-t="stats">Estatísticas</button>

<span class="sp"></span><span id="msg"></span><span id="st"></span>

</div>
<div id="frames"></div>
<div id="ov"><div id="box"></div></div>

<script id="docs" type="application/json">{"home": "\u003c!doctype html>\u003chtml lang=\"pt\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Treino\u003c/title>\n\u003cstyle>\n:root{--bg:#0f1317;--fg:#e6e9ec;--mut:#98a2ad;--line:#2a3138;--card:#171c22;--acc:#6cb0ff;--ok:#56c271;--bad:#ef6b73;--warn:#e5a84b}\n*{box-sizing:border-box}\nbody{font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:980px;margin:0 auto;padding:20px}\nh1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:26px 0 8px}h3{font-size:15px;margin:0}\na{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}\n.mut{color:var(--mut)}.small{font-size:13px}\nbutton{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}\nbutton:hover{border-color:var(--acc)}\nbutton.pri{background:var(--acc);border-color:var(--acc);color:#0c1220;font-weight:600}\nbutton.sm{padding:2px 8px;font-size:13px}button.del{color:var(--bad)}\ninput[type=text],input[type=date],input[type=number],textarea,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}\ntextarea{width:100%;min-height:54px;resize:vertical}\n.card{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:12px 14px;background:var(--card)}\n.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n@media(max-width:700px){.grid{grid-template-columns:1fr}}\n.big{font-size:26px;font-weight:700}\n.bar{height:6px;background:var(--bg);border-radius:3px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}.bar i.full{background:var(--ok)}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:140px}\ntable{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;font-size:14px}\nth:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:13px}\ntd input[type=number]{width:58px;text-align:center}\ntr.now td{background:#1b2532}\n.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}\n.k{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px;white-space:nowrap}\n.k.late{border-color:var(--warn);color:var(--warn)}\n.done-t{text-decoration:line-through;opacity:.6}\nsvg{display:block;width:100%;height:auto}\nsvg text{fill:var(--mut);font-size:11px}\ncircle.pt{cursor:pointer}\n.fld{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}\n\u003c/style>\u003cstyle>\n/* one look for every tool */\n:root{--bg:#0f1317;--card:#171c22;--card2:#1e252d;--panel:#171c22;--panel2:#1e252d;--line:#2a3138;--border:#2a3138;--text:#e6e9ec;--fg:#e6e9ec;--muted:#98a2ad;--mut:#98a2ad;--accent:#6cb0ff;--acc:#6cb0ff;--ok:#56c271;--green:#56c271;--warn:#e5a84b;--yellow:#e5a84b;--bad:#ef6b73;--red:#ef6b73}\nbody{font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:15px}\n.container{max-width:980px;padding:20px}\n\u003c/style>\u003cbase target=\"_blank\">\u003c/head>\u003cbody>\n\u003cdiv id=\"view\">\u003c/div>\n\u003cscript>\n\"use strict\";\nconst VIEW=\"home\",KEY='cpcoach.v1',CKEY='cpcoach.cache',PKEY='cptools.profile';\nconst WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],WK=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];\nconst esc=s=>String(s==null?'':s).replace(/[&\u003c>\"]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\nconst today=ymd(new Date());\nconst addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};\nconst fmtD=s=>{const d=new Date(s+'T12:00');return WD[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)};\nconst fmtL=s=>{const d=new Date(s+'T12:00');return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};\nconst monday=d=>{const x=new Date(d+'T12:00');return addD(d,-((x.getDay()+6)%7))};\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);\nconst safe=u=>/^https?:\\/\\//i.test(u||'')?u:'#';\nconst jget=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};\nconst FIELDS=[['tec','Técnicas','exercícios de técnicas','plano','min de técnicas (estimados)'],['tr','CF Trainer','problemas no CF Trainer','trainer','min no CF Trainer'],['sim','Simulações','simulações de concurso','','simulações de concurso']];\nconst TAGNAME={'dp':'Programação dinâmica','graphs':'Grafos','trees':'Árvores','strings':'Strings','math':'Matemática','number theory':'Teoria dos números','data structures':'Estruturas de dados','geometry':'Geometria','combinatorics':'Combinatória','greedy':'Greedy','binary search':'Pesquisa binária','dsu':'DSU','shortest paths':'Caminhos mais curtos','bitmasks':'Bitmasks','two pointers':'Two pointers','constructive algorithms':'Construtivos','dfs and similar':'DFS/BFS','probabilities':'Probabilidades','games':'Jogos','flows':'Fluxos','divide and conquer':'Divide and conquer','hashing':'Hashing','implementation':'Implementação','brute force':'Força bruta','sortings':'Ordenação','interactive':'Interativos','matrices':'Matrizes','string suffix structures':'Estruturas de sufixos','graph matchings':'Emparelhamentos','fft':'FFT','ternary search':'Pesquisa ternária','meet-in-the-middle':'Meet in the middle','2-sat':'2-SAT','chinese remainder theorem':'Teorema chinês dos restos','schedules':'Escalonamento','expression parsing':'Parsing','*special':'Especiais'};\nconst tagPt=t=>TAGNAME[t]?TAGNAME[t]+' ('+t+')':t;\n\n/* ---------- state ---------- */\nlet C,K;\nfunction load(){\n  C=jget(KEY)||{};C.v=1;C.weeks=C.weeks||{};C.sim=C.sim||{};C.notes=C.notes||[];C.rec=C.rec||{};C.cnote=C.cnote||{};C.set=Object.assign({drop:60,cards:20,minDay:((jget('cptech.v1')||{}).set||{}).minDay||90},C.set||{});C.upskip=C.upskip||{};delete C.mode;\n  if(!Array.isArray(C.contests))C.contests=[];\n  K=jget(CKEY)||{};\n}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}};\n// The Codeforces handle is shared by every tool. Data from before this had it in the trainer or in the journal.\nfunction handle(){const p=jget(PKEY)||{};if(p.handle)return p.handle;const a=jget('cfTrainerState')||{};if(a.handle)return a.handle;return((jget('cpjournal.v1')||{}).settings||{}).cf||''}\nfunction setHandle(h){const p=jget(PKEY)||{};p.handle=h;localStorage.setItem(PKEY,JSON.stringify(p));\n  const R=jget('cfTrainerState');if(R){R.handle=h;localStorage.setItem('cfTrainerState',JSON.stringify(R))}\n  parent.postMessage({cptools:'drop',tabs:['trainer','journal']},'*')} // those two read the handle when they open\n\n/* ---------- weekly goals ----------\n   A week's goals are per day: technique work and CF Trainer work in minutes (unit 'min') or as a number of\n   exercises (unit 'n', the older way), and a number of contest simulations. */\nconst hasPlan=m=>C.weeks[m]&&Array.isArray(C.weeks[m].days);\nconst trLimit=()=>+(jget('cfTrainerState')||{}).timeLimit||40;\n// The plan that applies to a week: its own, else the most recent earlier one, else a default.\nfunction planOf(m){\n  if(hasPlan(m)){const w=C.weeks[m];if(w.unit!=='min')w.unit='n';return w}\n  let k=null;for(const x of Object.keys(C.weeks).sort())if(x\u003cm&&hasPlan(x))k=x;\n  if(k)return {unit:C.weeks[k].unit==='min'?'min':'n',days:C.weeks[k].days.map(d=>({tec:d.tec,tr:d.tr,sim:d.sim,note:''})),goal:'',from:k};\n  const md=C.set.minDay;\n  return {unit:'min',days:WK.map(()=>({tec:md,tr:0,sim:0,note:''})),goal:'',from:null};\n}\n// A week can be edited until the Sunday before it starts. A week with no plan of its own can still be set on the day it is first opened.\nfunction editable(m){if(today\u003cm)return true;if(monday(today)!==m)return false;return !hasPlan(m)||C.weeks[m].made===today}\nfunction own(m){if(!hasPlan(m)){const p=planOf(m);C.weeks[m]=Object.assign(C.weeks[m]||{},{unit:p.unit,days:p.days,goal:'',made:today})}return C.weeks[m]}\nconst modeOf=m=>hasPlan(m)&&(C.weeks[m].mode==='rev'||C.weeks[m].mode==='off')?C.weeks[m].mode:'normal';\nconst MODES=[['normal','Normal'],['rev','Só revisões (nada de técnicas novas)'],['off','Pausa (sem técnicas)']];\nconst fmtV=(n,f,unit)=>Math.round(n)+(unit==='min'&&f!=='sim'?' min':'');\n\n/* ---------- what was actually done ---------- */\nfunction actuals(){\n  const n={tec:{},tr:{},sim:{}},min={tec:{},tr:{}};\n  const add=(o,d,v)=>{o[d]=(o[d]||0)+v};\n  const T=jget('cptech.v1');\n  if(T&&Array.isArray(T.techs))for(const t of T.techs){\n    for(const p of t.probs||[])if(p.done){add(n.tec,p.done,1);add(min.tec,p.done,p.min||45)} // technique minutes are the problem's estimate, not measured\n    for(const l of t.log||[])if(l.s>=3){add(n.tec,l.d,1);add(min.tec,l.d,25)}}\n  const R=jget('cfTrainerState');\n  if(R&&Array.isArray(R.history))for(const h of R.history){const d=ymd(new Date(h.ts));add(n.tr,d,1);add(min.tr,d,typeof h.elapsedMs==='number'?h.elapsedMs/6e4:trLimit())}\n  for(const d in (K.days||{}))if(K.days[d][1])n.sim[d]=K.days[d][1];\n  const tc=new Set(); // a 3-problem contest of the trainer is one simulation\n  if(R&&Array.isArray(R.history))for(const h of R.history)if(h.contest&&!tc.has(h.contest)){tc.add(h.contest);add(n.sim,ymd(new Date(h.contest)),1)}\n  for(const d in C.sim)if(C.sim[d])add(n.sim,d,C.sim[d]);\n  return {n,min};\n}\nconst got=(A,f,d,unit)=>((unit==='min'&&f!=='sim'?A.min:A.n)[f][d])||0;\n\n/* ---------- Codeforces data (kept in this browser only; fetched again on other computers) ---------- */\nlet fetching=false,ferr='';\nconst ratingAt=(R,t)=>{let r=0;for(const x of R){if(x.t\u003c=t)r=x.n;else break}return r||(R[0]?R[0].o:0)||1400};\nasync function sync(force){\n  const h=handle();if(!h||fetching)return;\n  if(!force&&K.h===h&&K.v===2&&Date.now()-(K.at||0)\u003c10*60e3)return;\n  fetching=true;ferr='';render();\n  try{\n    const api=async q=>{const r=await(await fetch('https://codeforces.com/api/'+q+(q.includes('?')?'&':'?')+'lang=en')).json();if(r.status!=='OK')throw new Error(r.comment||'erro');return r.result};\n    const rating=(await api('user.rating?handle='+encodeURIComponent(h))).map(r=>({id:r.contestId,name:r.contestName,rank:r.rank,t:r.ratingUpdateTimeSeconds,o:r.oldRating,n:r.newRating}));\n    const subs=(await api('user.status?handle='+encodeURIComponent(h))).reverse();\n    const days={},solved={},virt=new Set(),parts={};\n    for(const s of subs){\n      const d=ymd(new Date(s.creationTimeSeconds*1000)),pt=s.author&&s.author.participantType;\n      if(pt==='VIRTUAL'){const k=s.contestId+'|'+s.author.startTimeSeconds;if(!virt.has(k)){virt.add(k);(days[d]=days[d]||[0,0])[1]++}}\n      if(!s.problem)continue;\n      const cid=s.problem.contestId||s.contestId;\n      // work done inside a contest (official, out of competition or virtual): which problems fell, and with how many wrong tries\n      if((pt==='CONTESTANT'||pt==='VIRTUAL'||pt==='OUT_OF_COMPETITION')&&s.contestId\u003c100000){\n        const P=parts[s.contestId]=parts[s.contestId]||{id:s.contestId,t:s.author.startTimeSeconds||s.creationTimeSeconds,virt:pt==='VIRTUAL',ok:{},wa:{}};\n        const ix=s.problem.index;\n        if(s.verdict==='OK')P.ok[ix]=1;else if(!P.ok[ix]&&s.verdict&&s.verdict!=='COMPILATION_ERROR'&&s.verdict!=='TESTING'&&s.verdict!=='SKIPPED')P.wa[ix]=(P.wa[ix]||0)+1}\n      if(s.verdict==='OK'){const k=cid+s.problem.index;if(!solved[k]){solved[k]=d;(days[d]=days[d]||[0,0])[0]++}}\n    }\n    let up=[];try{up=(await api('contest.list?gym=false')).filter(c=>c.phase==='BEFORE').sort((a,b)=>a.startTimeSeconds-b.startTimeSeconds).slice(0,4).map(c=>({id:c.id,name:c.name,t:c.startTimeSeconds}))}catch(e){}\n    // problems of the contests taken part in: one big request, repeated only for a new contest or while a recent one has no ratings yet\n    let cp=K.h===h&&K.cp||{},psAt=K.h===h&&K.psAt||0;\n    const recent=Date.now()/1000-21*86400;\n    const need=Object.values(parts).some(P=>!cp[P.id]||(P.t>recent&&cp[P.id].some(p=>!p[2])&&Date.now()-psAt>6*36e5));\n    if(need){try{const ps=(await api('problemset.problems')).problems;cp={};\n      for(const p of ps)if(parts[p.contestId])(cp[p.contestId]=cp[p.contestId]||[]).push([p.index,p.name,p.rating||0,p.tags||[]]);\n      for(const P of Object.values(parts)){cp[P.id]=cp[P.id]||[];cp[P.id].sort((a,b)=>a[0]\u003cb[0]?-1:1)}psAt=Date.now()}catch(e){}}\n    // per tag: problems within reach in those contests (rated up to 200 above the rating held then) and how many were solved during the contest\n    const tags={},cur=rating.length?rating[rating.length-1].n:0;\n    for(const P of Object.values(parts)){\n      const off=rating.find(r=>r.id===P.id&&!P.virt),R=off?(off.o||1400):ratingAt(rating,P.t);P.r=R;\n      for(const p of cp[P.id]||[]){const rt=p[2],ok=!!P.ok[p[0]];if(!rt||(rt>R+200&&!ok))continue;\n        for(const tg of p[3]){if(tg[0]==='*')continue;const x=tags[tg]=tags[tg]||{e:[0,0],l:[0,0],wa:0,ok:0};\n          const b=rt\u003c=R-200?x.e:x.l;b[0]++;if(ok){b[1]++;x.ok++;x.wa+=P.wa[p[0]]||0}}}}\n    // upsolving: unsolved problems of contests of the last 21 days\n    const ups=[];\n    for(const P of Object.values(parts).filter(P=>P.t>recent).sort((a,b)=>b.t-a.t)){let free=2;\n      for(const p of cp[P.id]||[]){if(solved[P.id+p[0]])continue;\n        if(p[2]?p[2]\u003c=(cur||P.r)+300:free-->0)ups.push({k:P.id+p[0],c:P.id,i:p[0],name:p[1],r:p[2],t:P.t,virt:P.virt,tried:!!P.wa[p[0]]})}}\n    K={v:2,h,at:Date.now(),rating,days,up,cp,psAt,tags,ups,nparts:Object.keys(parts).length};\n    try{localStorage.setItem(CKEY,JSON.stringify(K))}catch(e){}\n  }catch(e){ferr='Não consegui ler o Codeforces ('+e.message+').'}\n  fetching=false;render();\n}\n// tags ordered from weakest: lowest share solved among problems at the user's level, with enough problems to mean something\nfunction tagRows(){\n  const rows=Object.entries(K.tags||{}).map(([t,x])=>({t,e:x.e,l:x.l,n:x.e[0]+x.l[0],rate:x.l[0]?x.l[1]/x.l[0]:null,wa:x.ok?x.wa/x.ok:0}));\n  const L=rows.reduce((a,r)=>[a[0]+r.l[0],a[1]+r.l[1]],[0,0]),avg=L[0]?L[1]/L[0]:0;\n  rows.sort((a,b)=>(a.rate==null)-(b.rate==null)||a.rate-b.rate||b.l[0]-a.l[0]);\n  const weak=rows.filter(r=>r.l[0]>=5&&r.rate\u003cavg).slice(0,3).map(r=>r.t);\n  return {rows,avg,weak};\n}\nfunction trainTag(tg){\n  const R=jget('cfTrainerState')||{rating:1200,history:[],handle:handle(),timeLimit:40};\n  R.filters=Object.assign({},R.filters||{},{tags:tg?[tg]:[]});\n  localStorage.setItem('cfTrainerState',JSON.stringify(R));\n  parent.postMessage({cptools:'show',tab:'trainer',reload:true},'*');\n}\nfunction addTech(tg){localStorage.setItem('cptech.req',JSON.stringify({name:TAGNAME[tg]||tg}));go('plano')}\nfunction ratingIn(a,b){ // rating change between two dates (inclusive), from official rounds\n  const R=(K.rating||[]).filter(r=>{const d=ymd(new Date(r.t*1000));return d>=a&&d\u003c=b});\n  return R.length?{n:R.length,from:R[0].o,to:R[R.length-1].n}:null;\n}\nconst go=(t,msg)=>parent.postMessage({cptools:'show',tab:t,msg},'*');\n\n/* ---------- home ---------- */\nfunction weekTable(m,edit){\n  const p=planOf(m),A=actuals(),u=p.unit;\n  let h='\u003ctable>\u003ctr>\u003cth>\u003c/th>'+FIELDS.map(f=>'\u003cth>'+f[1]+(u==='min'&&f[0]!=='sim'?' (min)':'')+'\u003c/th>').join('')+'\u003cth style=\"text-align:left\">Nota do dia\u003c/th>\u003c/tr>';\n  const tot={},dn={};\n  WK.forEach((w,i)=>{const d=addD(m,i),g=p.days[i]||{};\n    h+='\u003ctr class=\"'+(d===today?'now':'')+'\">\u003ctd>'+w+' '+d.slice(8)+'/'+d.slice(5,7)+'\u003c/td>';\n    for(const f of FIELDS){const goal=+g[f[0]]||0,done=Math.round(got(A,f[0],d,u));tot[f[0]]=(tot[f[0]]||0)+goal;dn[f[0]]=(dn[f[0]]||0)+done;\n      if(edit)h+='\u003ctd>\u003cinput type=\"number\" min=\"0\" step=\"'+(u==='min'&&f[0]!=='sim'?15:1)+'\" data-w=\"'+m+'\" data-i {\n  const p=planOf(m),A=actuals(),u=p.unit,bits=[];\n  for(const f of FIELDS){let d=0,g=0;for(let i=0;i\u003c7;i++){d+=got(A,f[0],addD(m,i),u);g+=+(p.days[i]||{})[f[0]]||0}\n    bits.push('\u003cb>'+f[1]+':\u003c/b> \u003cspan class=\"'+(g&&d>=g?'ok':g&&d\u003cg*.6?'bad':'')+'\">'+Math.round(d)+'\u003c/span> / '+fmtV(g,f[0],u))}\n  let cf=0;for(let i=0;i\u003c7;i++)cf+=((K.days||{})[addD(m,i)]||[0])[0];\n  bits.push('\u003cb>Resolvidos no Codeforces:\u003c/b> '+cf);\n  const r=ratingIn(m,addD(m,6));\n  if(r)bits.push('\u003cb>Rating:\u003c/b> '+r.from+' → '+r.to+' (\u003cspan class=\"'+(r.to>=r.from?'ok':'bad')+'\">'+(r.to>=r.from?'+':'')+(r.to-r.from)+'\u003c/span>, '+r.n+' ronda(s))');\n  return bits.join(' · ');\n}\n// The week whose review is due: this one on Sunday; otherwise last week, if it was planned or had any work and was not reviewed.\nfunction reviewWeek(){\n  const m=monday(today);\n  if(addD(m,6)===today)return m;\n  const pm=addD(m,-7),w=C.weeks[pm];\n  if(w&&w.rev&&w.rev.at)return null;\n  if(hasPlan(pm))return pm;\n  const A=actuals();for(let i=0;i\u003c7;i++)for(const f of FIELDS)if(got(A,f[0],addD(pm,i),'n'))return pm;\n  return null;\n}\nconst REVQ=[['good','O que correu bem'],['bad','O que correu mal (e porquê)'],['next','O que muda na próxima semana']];\nlet skipRev=false,editRev=false;\nfunction vHome(){\n  const m=monday(today),nm=addD(m,7),p=planOf(m),u=p.unit,A=actuals(),i=(new Date(today+'T12:00').getDay()+6)%7,g=p.days[i]||{};\n  const TD=jget('cptech.today'),J=jget('cpjournal.v1')||{},mode=modeOf(m);\n  let h='\u003ch1>Hoje, '+fmtD(today)+'\u003c/h1>';\n  const nx=C.contests.filter(c=>c.date&&c.date>=today).sort((a,b)=>a.date\u003cb.date?-1:1)[0];\n  const bits=[];\n  if(nx){const n=Math.round((new Date(nx.date+'T12:00')-new Date(today+'T12:00'))/864e5);bits.push('Próximo concurso: \u003cb>'+esc(nx.name)+'\u003c/b> '+(n?'daqui a '+n+' dia(s)':'hoje')+' ('+fmtL(nx.date)+')')}\n  if(K.up&&K.up.length){const x=K.up.filter(c=>c.t*1000>Date.now())[0];if(x)bits.push('Próxima ronda do Codeforces: \u003ca target=\"_blank\" rel=\"noopener\" href=\"https://codeforces.com/contests/'+x.id+'\">'+esc(x.name)+'\u003c/a>, '+new Date(x.t*1000).toLocaleString('pt-PT',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}))}\n  h+='\u003cdiv class=\"mut\">'+(bits.join(' · ')||'Sem concursos com data marcada. Marca-os em Estatísticas.')+'\u003c/div>';\n  // first steps, until the basics are in place\n  const T0=jget('cptech.v1'),steps=[[!!handle(),'Escreve o teu handle do Codeforces','set','Definições'],[!!(T0&&T0.techs&&T0.techs.length),'Escolhe as técnicas que queres manter frescas','plano','Técnicas'],[Object.keys(C.weeks).some(hasPlan),'Define os objetivos da semana, mais abaixo nesta página','','']];\n  if(steps.some(x=>!x[0])&&!C.set.started)h+='\u003cdiv class=\"card\">\u003cb>Primeiros passos\u003c/b>'+steps.map(x=>'\u003cdiv class=\"row small\" style=\"margin-top:6px\">\u003cspan class=\"'+(x[0]?'ok':'mut')+'\">'+(x[0]?'✓':'○')+'\u003c/span>\u003cspan class=\"'+(x[0]?'done-t':'')+'\">'+x[1]+'\u003c/span>'+(x[2]&&!x[0]?'\u003cbutton class=\"sm\" data-go=\"'+x[2]+'\">Abrir '+x[3]+'\u003c/button>':'')+'\u003c/div>').join('')\n    +'\u003cdiv class=\"row small\" style=\"margin-top:8px\">\u003cspan class=\"mut\">Os dados ficam só neste browser até ligares um ficheiro («Ficheiro de dados», em cima à direita). O que cada separador faz está em Definições.\u003c/span>\u003cbutton class=\"sm\" data-act=\"started\">Esconder\u003c/button>\u003c/div>\u003c/div>';\n  if(mode!=='normal')h+='\u003cdiv class=\"card\">\u003cb class=\"warn\">Semana de carga reduzida:\u003c/b> '+(mode==='off'?'técnicas em pausa.':'só revisões, nenhuma técnica nova.')+' \u003cspan class=\"small mut\">O que ficar em atraso é redistribuído a partir da próxima semana normal, revisões primeiro.\u003c/span>\u003c/div>';\n  if(g.note)h+='\u003cdiv class=\"card\">\u003cb>Nota para hoje:\u003c/b> '+esc(g.note)+'\u003c/div>';\n  const goalOf=f=>f==='tec'&&mode==='off'?0:+g[f]||0;\n  h+='\u003cdiv class=\"grid\" style=\"margin-top:12px\">';\n  for(const f of FIELDS){const goal=goalOf(f[0]),done=Math.round(got(A,f[0],today,u));\n    h+='\u003cdiv class=\"card\">\u003cdiv class=\"mut small\">'+f[1]+'\u003c/div>\u003cdiv class=\"big '+(goal&&done>=goal?'ok':'')+'\">'+done+'\u003cspan class=\"mut\" style=\"font-size:16px;font-weight:400\"> / '+fmtV(goal,f[0],u)+'\u003c/span>\u003c/div>'\n     +'\u003cdiv class=\"bar\">\u003ci class=\"'+(done>=goal?'full':'')+'\" style=\"width:'+(goal?Math.min(100,100*done/goal):done?100:0)+'%\">\u003c/i>\u003c/div>\u003cdiv class=\"small mut\">'+(u==='min'?f[4]:f[2])+'\u003c/div>'\n     +(f[3]?'\u003cbutton class=\"sm\" style=\"margin-top:8px\" data-go=\"'+f[3]+'\">Abrir '+f[1]+'\u003c/button>'\n        :'\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"sm\" data-sim=\"1\" title=\"Conta uma simulação feita hoje\">+1 feita\u003c/button>'+(C.sim[today]?'\u003cbutton class=\"sm\" data-sim=\"-1\">−1\u003c/button>':'')+'\u003c/div>')+'\u003c/div>'}\n  h+='\u003c/div>';\n  // what to do\n  h+='\u003ch2>O que fazer hoje\u003c/h2>\u003cdiv class=\"card\">';\n  let no=0;const hd=(t,extra)=>'\u003ch3'+(no++?' style=\"margin-top:14px\"':'')+'>'+no+'. '+t+(extra||'')+'\u003c/h3>';\n  const left=f=>Math.max(0,goalOf(f)-Math.round(got(A,f,today,u)));\n  const state=(f,word)=>left(f)?' \u003cspan class=\"mut small\">'+(f==='sim'?'falta(m) '+left(f):'faltam '+fmtV(left(f),f,u)+(u==='min'?'':' '+word))+'\u003c/span>':(goalOf(f)?' \u003cspan class=\"ok small\">objetivo cumprido\u003c/span>':' \u003cspan class=\"mut small\">sem objetivo hoje\u003c/span>');\n  // upsolving comes first: it is the work with the best return\n  const ups=(K.h===handle()&&K.ups||[]).filter(x=>!C.upskip[x.k]);\n  if(ups.length){\n    h+=hd('Upsolving',' \u003cspan class=\"mut small\">'+ups.length+' problema(s) por resolver de concursos recentes\u003c/span>');\n    let last=null;\n    for(const x of ups){if(x.c!==last){last=x.c;const rr=(K.rating||[]).find(r=>r.id===x.c);\n        h+='\u003cdiv class=\"small mut\" style=\"margin-top:6px\">'+esc(rr?rr.name:'Contest '+x.c)+(x.virt?' (virtual)':'')+' · '+fmtL(ymd(new Date(x.t*1000)))+'\u003c/div>'}\n      h+='\u003cdiv class=\"row\" style=\"margin-left:10px\">\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://codeforces.com/contest/'+x.c+'/problem/'+esc(x.i)+'\">'+esc(x.i+' – '+x.name)+'\u003c/a>\u003cspan class=\"mut small\">'+(x.r?x.r:'sem rating ainda')+(x.tried?' · tentaste no concurso':'')+'\u003c/span>\u003cbutton class=\"sm\" data-up=\"'+esc(x.k)+'\" title=\"Tirar da lista sem resolver\">ignorar\u003c/button>\u003c/div>'}\n    h+='\u003cdiv class=\"small mut\" style=\"margin-top:6px\">Saem da lista sozinhos quando os resolveres no Codeforces; depois aparecem no Diário para escreveres a entrada.\u003c/div>';\n  }\n  h+=hd('Técnicas',mode==='off'?' \u003cspan class=\"warn small\">em pausa\u003c/span>':state('tec','exercício(s)')+(mode==='rev'?' \u003cspan class=\"warn small\">só revisões\u003c/span>':''));\n  if(TD&&TD.d===today&&TD.items.length){\n    h+=TD.items.map(x=>'\u003cdiv style=\"margin:6px 0\">\u003cspan class=\"k'+(x.late?' late':'')+'\">'+esc(x.stage)+'\u003c/span>\u003cb>'+esc(x.name)+'\u003c/b>'+(x.min?' \u003cspan class=\"mut small\">~'+x.min+' min\u003c/span>':'')\n      +x.probs.map(q=>'\u003cdiv class=\"small '+(q.done?'done-t':'')+'\" style=\"margin-left:10px\">'+(q.opt?'\u003cspan class=\"mut\">opcional: \u003c/span>':'')+'\u003ca target=\"_blank\" rel=\"noopener\" href=\"'+esc(safe(q.url))+'\">'+esc(q.name)+'\u003c/a>\u003c/div>').join('')+'\u003c/div>').join('');\n    if(TD.wait>0)h+='\u003cdiv class=\"small mut\">Mais '+TD.wait+' sessão(ões) em espera, que não cabem no objetivo de hoje.\u003c/div>';\n  }else h+='\u003cdiv class=\"small mut\" style=\"margin:6px 0\">'+(TD&&TD.d===today&&TD.wait>0?'Nada mais cabe no objetivo de hoje; há '+TD.wait+' sessão(ões) em espera.':'Nenhuma sessão de técnicas para hoje.')+'\u003c/div>';\n  h+='\u003cbutton class=\"sm\" data-go=\"plano\">Marcar sessões em Técnicas\u003c/button>';\n  const wk=K.h===handle()?tagRows().weak:[],ft=((jget('cfTrainerState')||{}).filters||{}).tags||[];\n  h+=hd('CF Trainer',state('tr','problema(s)'));\n  if(ft.length)h+='\u003cdiv class=\"small\" style=\"margin:4px 0\">Filtro de tags ativo: \u003cb>'+esc(ft.join(', '))+'\u003c/b> \u003cbutton class=\"sm\" data-train=\"\">tirar filtro\u003c/button>\u003c/div>';\n  else if(wk.length)h+='\u003cdiv class=\"small\" style=\"margin:4px 0\">\u003cspan class=\"mut\">Tags mais fracas em concurso:\u003c/span> '+wk.map(t=>'\u003cbutton class=\"sm\" data-train=\"'+esc(t)+'\" title=\"Abre o CF Trainer só com problemas desta tag\">'+esc(t)+'\u003c/button>').join(' ')+' \u003cspan class=\"mut\">(clica para treinar só essa tag)\u003c/span>\u003c/div>';\n  h+=hd('Simulações',state('sim',''))\n    +'\u003cdiv class=\"small mut\">Participações virtuais no Codeforces contam sozinhas'+(handle()?'':' (falta o handle, em Definições)')+', e os contests de 3 problemas do CF Trainer também; as outras (VJudge, papel) marcas com «+1 feita».\u003c/div>';\n  // flashcards and journal\n  const sol=Object.values(J.solved||{}),ent=J.entries||{},cut=Date.now()-14*864e5;\n  const pend=sol.filter(s=>s.t>=cut&&!ent[s.key]).length;let due=0;\n  for(const e of Object.values(ent)){const f=e.f||{};if(e.auto!==false&&(f.idea||f.approach)&&(!e.srs||e.srs.due\u003c=Date.now()))due++;for(const c of e.cards||[])if((c.q||'').trim()&&(c.a||'').trim()&&(!c.srs||c.srs.due\u003c=Date.now()))due++}\n  const rv=(J.revlog||{})[today]||0,cl=Math.min(due,Math.max(0,C.set.cards-rv));\n  h+=hd('Flashcards',cl?' \u003cspan class=\"mut small\">'+cl+' cartão(ões) para hoje\u003c/span>':(rv?' \u003cspan class=\"ok small\">feito ('+rv+' revisto(s) hoje)\u003c/span>':' \u003cspan class=\"mut small\">nenhum por rever\u003c/span>'))\n    +'\u003cdiv class=\"row small\" style= er alterada até ao fim do dia.':'Esta semana ainda não tem objetivos próprios'+(p.from?' (está a repetir os da semana de '+fmtL(p.from)+')':'')+'. Podes defini-los hoje; depois ficam fechados.')+'\u003c/div>'+weekEdit(m);\n  else h+=(mode!=='normal'?'\u003cdiv class=\"small warn\" style=\"margin-bottom:8px\">Carga de técnicas: '+MODES.find(o=>o[0]===mode)[1]+'\u003c/div>':'')+weekTable(m,false)+(p.goal?'\u003cdiv class=\"small\" style=\"margin-top:8px\">\u003cb>Objetivo da semana:\u003c/b> '+esc(p.goal)+'\u003c/div>':'')+'\u003cdiv class=\"small mut\" style=\"margin-top:8px\">Fechada: os objetivos de uma semana só se alteram até ao domingo anterior.\u003c/div>';\n  h+='\u003c/div>\u003ch2>Próxima semana \u003cspan class=\"mut small\">'+fmtL(nm)+' a '+fmtL(addD(nm,6))+' · editável até '+fmtD(addD(nm,-1))+'\u003c/span>\u003c/h2>\u003cdiv class=\"card\">';\n  if(rw&&!rdone&&!skipRev)h+='\u003cdiv class=\"small\">Faz primeiro a revisão da semana, aqui em cima: os objetivos saem melhores depois de olhares para o que aconteceu.\u003c/div>\u003cbutton class=\"sm\" style=\"margin-top:8px\" data-act=\"skiprev\">Definir objetivos sem fazer a revisão\u003c/button>';\n  else h+=(hasPlan(nm)?'':'\u003cdiv class=\"small mut\" style=\"margin-bottom:8px\">Ainda não alteraste nada: se ficar assim, repete os objetivos '+(planOf(nm).from?'da última semana definida':'por omissão')+'.\u003c/div>')+weekEdit(nm);\n  h+='\u003c/div>\u003cdiv class=\"small mut\" style=\"margin-top:10px\">O objetivo de técnicas de cada dia é o limite que o separador Técnicas usa para distribuir as sessões. Os minutos de técnicas contam pela estimativa de cada problema (25 min por reescrita); os do CF Trainer são os medidos.\u003c/div>';\n  return h;\n}\n\n/* ---------- statistics ---------- */\nlet sel=null;\nfunction recessions(R){ // falls of at least C.set.drop points from a peak, until the peak is reached again\n  const out=[];let pk=0,cur=null;\n  for(let i=1;i\u003cR.length;i++){\n    if(R[i].n>=R[pk].n){if(cur){cur.end=i;cur=null}pk=i;continue}\n    if(!cur&&R[pk].n-R[i].n>=C.set.drop){cur={pk,low:i,end:null};out.push(cur)}\n    if(cur&&R[i].n\u003cR[cur.low].n)cur.low=i;\n  }\n  return out;\n}\nfunction lineChart(pts,o){ // pts: [{x(ms),y,title,key}]\n  const W=920,H=o.h||280,L=44,Rm=12,Tp=12,B=26;\n  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);\n  if(x1===x0)x1=x0+1;const pad=Math.max(20,(y1-y0)*.08);y0=Math.floor((y0-pad)/100)*100;y1=Math.ceil((y1+pad)/100)*100;\n  const X=x=>L+(x-x0)/(x1-x0)*(W-L-Rm),Y=y=>Tp+(1-(y-y0)/(y1-y0))*(H-Tp-B);\n  let s='\u003csvg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\">';\n  const step=(y1-y0)\u003c=600?100:200;\n  for(let y=y0;y\u003c=y1;y+=step)s+='\u003cline x1=\"'+L+'\" x2=\"'+(W-Rm)+'\" y1=\"'+Y(y)+'\" y2=\"'+Y(y)+'\" stroke=\"#2a3138\"/>\u003ctext x=\"'+(L-6)+'\" y=\"'+(Y(y)+4)+'\" text-anchor=\"end\">'+y+'\u003c/text>';\n  const d0=new Date(x0),d1=new Date(x1),months=(d1.getFullYear()-d0.getFullYear())*12+d1.getMonth()-d0.getMonth(),ms=Math.max(1,Math.ceil(months/9));\n  for(let d=new Date(d0.getFullYear(),d0.getMonth()+1,1),k=0;d\u003c=d1;d=new Date(d.getFullYear(),d.getMonth()+1,1),k++)if(k%ms===0)\n    s+='\u003cline x1=\"'+X(+d)+'\" x2=\"'+X(+d)+'\" y1=\"'+Tp+'\" y2=\"'+(H-B)+'\" stroke=\"#20262d\"/>\u003ctext x=\"'+X(+d)+'\" y=\"'+(H-8)+'\" text-anchor=\"middle\">'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)+'\u003c/text>';\n  for(const b of o.bands||[]){const a=Math.max(x0,b.a),c=Math.min(x1,b.b);if(c>a)s+='\u003crect x=\"'+X(a)+'\" y=\"'+Tp+'\" width=\"'+Math.max(2,X(c)-X(a))+'\" height=\"'+(H-Tp-B)+'\" fill=\"'+b.c+'\" opacity=\".16\">\u003ctitle>'+esc(b.t||'')+'\u003c/title>\u003c/rect>'}\n  s+='\u003cpolyline fill=\"none\" stroke=\"#6cb0ff\" stroke-width=\"2\" points=\"'+pts.map(p=>X(p.x).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ')+'\"/>';\n  if(o.dots)for(const p of pts)s+='\u003ccircle class=\"pt\" data-key=\"'+esc(p.key)+'\" cx=\"'+X(p.x).toFixed(1)+'\" cy=\"'+Y(p.y).toFixed(1)+'\" r=\"'+(p.key===sel?6:p.mark?5:3.5)+'\" fill=\"'+(p.key===sel?'#fff':p.mark?'#e5a84b':'#6cb0ff')+'\">\u003ctitle>'+esc(p.title)+'\u003c/title>\u003c/circle>';\n  return s+'\u003c/svg>';\n}\n// weekly reviews written during a period, to help explain a recession\nfunction revsIn(a,b){\n  const ws=Object.keys(C.weeks).sort().filter(m=>addD(m,6)>=a&&m\u003c=b&&C.weeks[m].rev&&(C.weeks[m].rev.bad||C.weeks[m].rev.good));\n  return ws.length?'\u003cdetails style=\"margin-top:6px\">\u003csummary class=\"small\">'+ws.length+' revisão(ões) semanais deste período\u003c/summary>'+ws.map(m=>'\u003cdiv class=\"small\" style=\"margin:4px 0 0 10px\">\u003cb>'+fmtL(m)+':\u003c/b> '+esc(C.weeks[m].rev.bad||C.weeks[m].rev.good)+'\u003c/div>').join('')+'\u003c/details>':'';\n}\nfunction vTags(){\n  if(K.h!==handle()||!K.tags)return '';\n  const {rows,avg,weak}=tagRows(),pc=a=>a[0]?a[1]+'/'+a[0]+' \u003cspan class=\"mut\">('+Math.round(100*a[1]/a[0])+'%)\u003c/span>':'\u003cspan class=\"mut\">–\u003c/span>';\n  let h='\u003ch2>Fraquezas por tag \u003cspan class=\"mut small\">em '+(K.nparts||0)+' concursos (oficiais e virtuais)\u003c/span>\u003c/h2>\u003cdiv class=\"card\" style=\"overflow-x:auto\">';\n  if(!rows.length)return h+'\u003cspan class=\"mut\">Ainda sem concursos com problemas classificados.\u003c/span>\u003c/div>';\n  h+='\u003ctable>\u003ctr>\u003cth>Tag\u003c/th>\u003cth title=\"Problemas pelo menos 200 pontos abaixo do teu rating da altura\">Fáceis resolvidos\u003c/th>\u003cth title=\"Problemas entre 200 abaixo e 200 acima do teu rating da altura\">Ao teu nível resolvidos\u003c/th>\u003cth title=\"Tentativas erradas, em média, por problema resolvido em concurso\">Erradas por resolvido\u003c/th>\u003cth>\u003c/th>\u003c/tr>';\n  for(const r of rows.filter(r=>r.n>=3)){const w=weak.includes(r.t);\n    h+='\u003ctr>\u003ctd>'+(w?'\u003cspan class=\"k late\">fraca\u003c/span>':'')+esc(tagPt(r.t))+'\u003c/td>\u003ctd>'+pc(r.e)+'\u003c/td>\u003ctd class=\"'+(w?'bad':'')+'\">'+pc(r.l)+'\u003c/td>\u003ctd>'+r.wa.toFixed(1)+'\u003c/td>'\n      +'\u003ctd style=\"white-space:nowrap\">\u003cbutton class=\"sm\" data-train=\"'+esc(r.t)+'\" title=\"Abre o CF Trainer só com problemas desta tag\">Treinar\u003c/button> \u003cbutton class=\"sm\" data-tech=\"'+esc(r.t)+'\" title=\"Abre as Técnicas com este nome já escrito\">→ Técnicas\u003c/button>\u003c/td>\u003c/tr>'}\n  h+='\u003c/table>\u003cdiv class=\"small mut\" style=\"margin-top:6px\">Conta os problemas dos concursos em que participaste que estavam ao teu alcance (rating até 200 acima do teu na altura) e quantos resolveste durante o concurso. Média ao teu nível: '+Math.round(100*avg)+'%. «Fraca»: as 3 tags com pior taxa ao teu nível, com pelo menos 5 problemas e abaixo da média. As tags do Codeforces são largas e um problema conta em todas as suas tags, por isso lê isto como indicação. Tags com menos de 3 problemas não aparecem.\u003c/div>\u003c/div>';\n  return h;\n}\nfunction vReviews(){\n  const ws=Object.keys(C.weeks).sort().reverse().filter(m=>C.weeks[m].rev&&C.weeks[m].rev.at).slice(0,26);\n  if(!ws.length)return '';\n  return '\u003ch2>Revisões semanais\u003c/h2>'+ws.map(m=>{const r=C.weeks[m].rev;\n    return '\u003cdetails class=\"card\">\u003csummary>\u003cb>'+fmtL(m)+' a '+fmtL(addD(m,6))+'\u003c/b> \u003cspan class=\"mut small\">'+esc((r.bad||r.good||r.next||'').slice(0,90))+'\u003c/span>\u003c/summary>\u003cdiv class=\"small\" style=\"margin-top:6px\">'+weekSummary(m)+'\u003c/div>'\n      +REVQ.filter(q=>r[q[0]]).map(q=>'\u003cdiv class=\"small\" style=\"margin-top:6px\">\u003cb>'+q[1]+':\u003c/b> '+esc(r[q[0]])+'\u003c/div>').join('')+'\u003c/details>'}).join('');\n}\nfunction vStats(){\n  let h='\u003ch1>Estatísticas\u003c/h1>\u003cdiv class=\"mut\">'+(handle()?'Codeforces: '+esc(handle())+(K.at?' · atualizado '+new Date(K.at).toLocaleString('pt-PT'):''):'Escreve o teu handle do Codeforces em Definições para veres o rating. \u003cbutton class=\"sm\" data-go=\"set\">Abrir Definições\u003c/button>')\n    +(fetching?' · a atualizar…':handle()?' \u003cbutton class=\"sm\" data-act=\"sync\">Atualizar\u003c/button>':'')+(ferr?' \u003cspan class=\"bad\">'+esc(ferr)+'\u003c/span>':'')+'\u003c/div>';\n  const R=K.h===handle()&&K.rating||[];\n  h+='\u003ch2>Rating do Codeforces\u003c/h2>';\n  if(R.length){\n    const rec=recessions(R),bands=rec.map(r=>({a:R[r.pk].t*1000,b:(r.end!=null?R[r.end].t:Date.now()/1000)*1000,c:'#ef6b73',t:'Recessão'}));\n    for(const n of C.notes)if(n.from)bands.push({a:+new Date(n.from+'T00:00'),b:+new Date((n.to||n.from)+'T23:59'),c:'#e5a84b',t:n.text});\n    const cur=R[R.length-1],max=Math.max(...R.map(r=>r.n));\n    h+='\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003cdiv class=\"mut small\">Atual\u003c/div>\u003cdiv class=\"big\">'+cur.n+'\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"mut small\">Máximo\u003c/div>\u003cdiv class=\"big\">'+max+'\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"mut small\">Concursos\u003c/div>\u003cdiv class=\"big\">'+R.length+'\u003c/div>\u003c/div>\u003c/div>';\n    h+='\u003cdiv class=\"card\">'+lineChart(R.map(r=>({x:r.t*1000,y:r.n,key:String(r.id),mark:!!C.cnote[r.id],title:r.name+'\\n'+fmtL(ymd(new Date(r.t*1000)))+' · '+r.o+' → '+r.n+' ('+(r.n>=r.o?'+':'')+(r.n-r.o)+') · lugar '+r.rank})),{dots:true,bands})\n      +'\u003cdiv class=\"small mut\">Vermelho: recessões. Amarelo: períodos que anotaste. Clica num ponto para ver o concurso e escrever uma nota.\u003c/div>';\n    const s=R.find(r=>String(r.id)===sel);\n    if(s)h+='\u003cdiv style=\"margin-top:10px;border-top:1px dashed var(--line);padding-top:10px\">\u003cb>\u003ca target=\"_blank\" rel=\"noopener\" href=\"https://codeforces.com/contest/'+s.id+'\">'+esc(s.name)+'\u003c/a>\u003c/b> \u003cspan class=\"mut small\">'+fmtL(ymd(new Date(s.t*1000)))+' · '+s.o+' → '+s.n+' (\u003cspan class=\"'+(s.n>=s.o?'ok':'bad')+'\">'+(s.n>=s.o?'+':'')+(s.n-s.o)+'\u003c/span>) · lugar '+s.rank+'\u003c/span>'\n      +'\u003cspan class=\"fld\">Nota sobre este concurso\u003c/span>\u003ctextarea data-cn=\"'+s.id+'\" placeholder=\"O que correu bem ou mal?\">'+esc(C.cnote[s.id]||'')+'\u003c/textarea>\u003c/div>';\n    h+='\u003c/div>\u003ch2>Recessões \u003cspan class=\"mut small\">quedas de pelo menos \u003cinput type=\"number\" data-set=\"drop\" value=\"'+C.set.drop+'\" style=\"width:64px\"> pontos em relação ao máximo anterior\u003c/span>\u003c/h2>';\n    h+=rec.length?rec.slice().reverse().map(r=>{const a=R[r.pk],l=R[r.low],k=String(a.id);\n      return '\u003cdiv class=\"card\">\u003cb>'+fmtL(ymd(new Date(a.t*1000)))+' → '+(r.end!=null?fmtL(ymd(new Date(R[r.end].t*1000))):'\u003cspan class=\"warn\">em curso\u003c/span>')+'\u003c/b> \u003cspan class=\"mut small\">de '+a.n+' para '+l.n+' (\u003cspan class=\"bad\">−'+(a.n-l.n)+'\u003c/span>) · '+((r.end!=null?r.end:R.length-1)-r.pk)+' concurso(s) '+(r.end!=null?'até recuperar':'desde o máximo')+'\u003c/span>'\n        +revsIn(ymd(new Date(a.t*1000)),r.end!=null?ymd(new Date(R[r.end].t*1000)):today)+'\u003cspan class=\"fld\">Explicação\u003c/span>\u003ctextarea data-rec=\"'+k+'\" placeholder=\"Porque é que o rating desceu? (cansaço, exames, mudança de método, azar em problemas de um tipo…)\">'+esc(C.rec[k]||'')+'\u003c/textarea>\u003c/div>'}).join(''):'\u003cdiv class=\"mut\">Nenhuma queda desse tamanho.\u003c/div>';\n  }else h+='\u003cdiv class=\"card mut\">'+(fetching?'A carregar…':'Sem dados de rating ainda.')+'\u003c/div>';\n  h+=vTags();\n  // annotated periods\n  h+='\u003ch2>Períodos anotados\u003c/h2>\u003cdiv class=\"card\">'+C.notes.slice().sort((a,b)=>a.from\u003cb.from?1:-1).map(n=>'\u003cdiv class=\"row\" style=\"margin-bottom:6px\">\u003cinput type=\"date\" data-n=\"'+n.id+'\" data-f=\"from\" value=\"'+esc(n.from)+'\">\u003cspan class=\"mut\">a\u003c/span>\u003cinput type=\"date\" data-n=\"'+n.id+'\" data-f=\"to\" value=\"'+esc(n.to||'')+'\">\u003cinput type=\"text\" class=\"grow\" data-n=\"'+n.id+'\" data-f=\"text\" value=\"'+esc(n.text)+'\" placeholder=\"ex.: época de exames\">\u003cbutton class=\"sm del\" data-act=\"rmn\" data-id=\"'+n.id+'\">×\u003c/button>\u003c/div>').join('')\n    +'\u003cbutton class=\"sm\" data-act=\"addn\">Adicionar período\u003c/button>\u003cdiv class=\"small mut\" style=\"margin-top:6px\">Aparecem a amarelo nos gráficos (férias, exames, doença, mudança de plano…).\u003c/div>\u003c/div>';\n  // weeks\n  const A=actuals(),m0=monday(today),N=12;\n  h+='\u003ch2>Últimas '+N+' semanas\u003c/h2>\u003cdiv class=\"card\" style=\"overflow-x:auto\">\u003ctable>\u003ctr>\u003cth>Semana\u003c/th>'+FIELDS.map(f=>'\u003cth>'+f[1]+'\u003c/th>').join('')+'\u003cth>Objetivos\u003c/th>\u003cth>Resolvidos no CF\u003c/th>\u003cth>Rating\u003c/th>\u003cth>Revisão\u003c/th>\u003c/tr>';\n  for(let w=0;w\u003cN;w++){const m=addD(m0,-7*w),p=hasPlan(m)?C.weeks[m]:null,u=p?planOf(m).unit:'min';let cf=0,fr=0,nf=0;\n    h+='\u003ctr class=\"'+(w===0?'now':'')+'\">\u003ctd>'+fmtL(m)+'\u003c/td>';\n    for(const f of FIELDS){let d=0,g=0;for(let i=0;i\u003c7;i++){const x=addD(m,i);d+=got(A,f[0],x,u);if(p)g+=+(p.days[i]||{})[f[0]]||0}\n      if(g){fr+=Math.min(1,d/g);nf++}h+='\u003ctd>'+fmtV(d,f[0],u)+(p?'\u003cspan class=\"mut\"> / '+g+'\u003c/span>':'')+'\u003c/td>'}\n    for(let i=0;i\u003c7;i++)cf+=((K.days||{})[addD(m,i)]||[0])[0];\n    const pct=nf?Math.round(100*fr/nf):0,r=ratingIn(m,addD(m,6)),rv=C.weeks[m]&&C.weeks[m].rev&&C.weeks[m].rev.at;\n    h+='\u003ctd>'+(nf?'\u003cspan class=\"'+(pct>=100?'ok':pct>=60?'warn':'bad')+'\">'+pct+'%\u003c/span>':'\u003cspan class=\"mut\">–\u003c/span>')+'\u003c/td>\u003ctd>'+cf+'\u003c/td>'\n      +'\u003ctd>'+(r?'\u003cspan class=\"'+(r.to>=r.from?'ok':'bad')+'\">'+(r.to>=r.from?'+':'')+(r.to-r.from)+'\u003c/span>':'\u003cspan class=\"mut\">–\u003c/span>')+'\u003c/td>\u003ctd>'+(rv?'\u003cspan class=\"ok\">✓\u003c/span>':'\u003cspan class=\"mut\">–\u003c/span>')+'\u003c/td>\u003c/tr>'}\n  h+='\u003c/table>\u003cdiv class=\"small mut\" style=\"margin-top:6px\">«Objetivos» é a média do cumprimento dos objetivos da semana (técnicas, Trainer, simulações); só aparece em semanas com objetivos definidos na página Início.\u003c/div>\u003c/div>';\n  h+=vReviews();\n  // trainer rating\n  const TR=jget('cfTrainerState'),H=TR&&Array.isArray(TR.history)?TR.history.filter(x=>x.ts&&typeof x.newRating==='number').slice().reverse():[];\n  h+='\u003ch2>Rating interno do CF Trainer\u003c/h2>\u003cdiv class=\"card\">'+(H.length>1?lineChart(H.map(x=>({x:x.ts,y:x.newRating})),{h:200,bands:C.notes.filter(n=>n.from).map(n=>({a:+new Date(n.from+'T00:00'),b:+new Date((n.to||n.from)+'T23:59'),c:'#e5a84b',t:n.text}))})+'\u003cdiv class=\"small mut\">'+H.length+' problema(s) · '+H.filter(x=>x.solved).length+' resolvido(s) · rating atual '+TR.rating+'\u003c/div>':'\u003cspan class=\"mut\">Ainda sem histórico suficiente no CF Trainer.\u003c/span>')+'\u003c/div>';\n  // contests\n  const cs=C.contests.slice().sort((a,b)=>(a.date||'9999'+a.name)\u003c(b.date||'9999'+b.name)?-1:1);\n  h+='\u003ch2>Concursos\u003c/h2>\u003cdiv class=\"card\" style=\"overflow-x:auto\">\u003ctable>\u003ctr>\u003cth>Concurso\u003c/th>\u003cth>Data\u003c/th>\u003cth>Resultado\u003c/th>\u003cth style=\"text-align:left\">Notas\u003c/th>\u003cth>\u003c/th>\u003c/tr>'\n    +cs.map(c=>'\u003ctr>\u003ctd>\u003cinput type=\"text\" data-c=\"'+c.id+'\" data-f=\"name\" value=\"'+esc(c.name)+'\" style=\"width:150px\">\u003c/td>\u003ctd>\u003cinput type=\"date\" data-c=\"'+c.id+'\" data-f=\"date\" value=\"'+esc(c.date)+'\">\u003c/td>'\n      +'\u003ctd>\u003cinput type=\"text\" data-c=\"'+c.id+'\" data-f=\"result\" value=\"'+esc(c.result)+'\" placeholder=\"lugar, problemas\" style=\"width:150px\">\u003c/td>\u003ctd>\u003cinput type=\"text\" data-c=\"'+c.id+'\" data-f=\"note\" value=\"'+esc(c.note)+'\" style=\"width:100%\">\u003c/td>'\n      +'\u003ctd>\u003cbutton class=\"sm del\" data-act=\"rmc\" data-id=\"'+c.id+'\">×\u003c/button>\u003c/td>\u003c/tr>').join('')\n    +'\u003c/table>\u003cbutton class=\"sm\" style=\"margin-top:8px\" data-act=\"addc\">Adicionar concurso\u003c/button>\u003cdiv class=\"small mut\" style=\"margin-top:6px\">As rondas do Codeforces entram sozinhas no gráfico. Aqui ficam os outros (nacionais, ICPC…): preenche a data quando for conhecida e o próximo aparece na página Início. Concursos que se repetem todos os anos criam-se de uma vez em Definições.\u003c/div>\u003c/div>';\n  return h;\n}\n\n/* ---------- settings ---------- */\nlet pmsg='',ymsg='';\nfunction vSet(){\n  const R=jget('cfTrainerState')||{},hist=Array.isArray(R.history)?R.history.length:0,sr=R.startRating||1200,cr=typeof R.rating==='number'?R.rating:sr;\n  let h='\u003ch1>Definições\u003c/h1>\u003cdiv class=\"mut\">O que é comum a todos os separadores. O que só diz respeito a uma ferramenta (intervalos das revisões, tempo limite do Trainer, importações do Diário) continua dentro dela.\u003c/div>';\n  h+='\u003ch2>Perfil\u003c/h2>\u003cdiv class=\"card\">\u003cspan class=\"fld\">Handle do Codeforces\u003c/span>\u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"phandle\" value=\"'+esc(handle())+'\" placeholder=\"o teu handle\" style=\"width:220px\">\u003cbutton class=\"pri\" data-act=\"phandle\">Guardar e verificar\u003c/button>\u003cspan class=\"small '+(pmsg[0]==='!'?'bad':'ok')+'\">'+esc(pmsg.replace(/^!/,''))+'\u003c/span>\u003c/div>'\n    +'\u003cdiv class=\"small mut\" style=\"margin-top:6px\">Usado em todo o lado: rating e fraquezas (Estatísticas), upsolving (Início), problemas já resolvidos (Técnicas, CF Trainer) e resolvidos recentes (Diário). Só são lidos dados públicos; não é pedida palavra-passe. O VJudge e o CSES configuram-se no Diário, em «Contas e importação».\u003c/div>\u003c/div>';\n  h+='\u003ch2>Treino diário\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"row\">'\n    +'\u003cdiv>\u003cspan class=\"fld\">Minutos de técnicas por dia, sem objetivos semanais\u003c/span>\u003cinput type=\"number\" min=\"0\" step=\"15\" data-set=\"minDay\" value=\"'+C.set.minDay+'\" style=\"width:110px\">\u003c/div>'\n    +'\u003cdiv>\u003cspan class=\"fld\">Flashcards por dia\u003c/span>\u003cinput type=\"number\" min=\"0\" data-set=\"cards\" value=\"'+C.set.cards+'\" style=\"width:110px\">\u003c/div>'\n    +'\u003cdiv>\u003cspan class=\"fld\">Recessão: queda mínima de rating\u003c/span>\u003cinput type=\"number\" min=\"1\" data-set=\"drop\" value=\"'+C.set.drop+'\" style=\"width:110px\">\u003c/div>\u003c/div>'\n    +'\u003cdiv class=\"small mut\" style=\"margin-top:6px\">Os objetivos de cada semana definem-se na página Início; estes valores valem quando não há nenhum.\u003c/div>\u003c/div>';\n  h+='\u003ch2>CF Trainer\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"small\">Rating interno atual: \u003cb>'+cr+'\u003c/b> · '+hist+' problema(s) no histórico · rating inicial: '+sr+'\u003c/div>'\n    +'\u003cspan class=\"fld\">Rating inicial (o Trainer escolhe problemas à volta do rating interno)\u003c/span>\u003cdiv class=\"row\">\u003cinput type=\"number\" id=\"trate\" min=\"800\" max=\"3500\" step=\"100\" value=\"'+(hist?cr:sr)+'\" style=\"width:110px\">'\n    +(handle()?'\u003cbutton data-act=\"tcf\" title=\"Vai buscar o teu rating atual ao Codeforces\">Usar o meu rating do Codeforces\u003c/button>':'')\n    +(hist?'\u003cbutton data-act=\"tcur\">Mudar o rating atual (mantém o histórico)\u003c/button>\u003cbutton class=\"del\" data-act=\"tnew\">Recomeçar com este rating (apaga o histórico)\u003c/button>':'\u003cbutton class=\"pri\" data-act=\"tcur\">Guardar\u003c/button>')\n    +'\u003cspan class=\"small '+(ymsg[0]==='!'?'bad':'ok')+'\">'+esc(ymsg.replace(/^!/,''))+'\u003c/span>\u003c/div>'\n    +'\u003cdiv class=\"small mut\" style=\"margin-top:6px\">Quem começa deve pôr aqui o seu rating do Codeforces (ou 1200, se ainda não tiver). O botão «Recomeçar» do Trainer volta a este valor.\u003c/div>\u003c/div>';\n  h+='\u003ch2>Concursos anuais\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"row\">\u003cdiv>\u003cspan class=\"fld\">Nomes, separados por vírgulas\u003c/span>\u003cinput type=\"text\" id=\"cnames\" placeholder=\"ex.: MIUP, SWERC\" style=\"width:260px\">\u003c/div>'\n    +'\u003cdiv>\u003cspan class=\"fld\">Durante quantos anos\u003c/span>\u003cinput type=\"number\" id=\"cyears\" min=\"1\" max=\"10\" value=\"5\" style=\"width:110px\">\u003c/div>\u003cbutton data-act=\"cgen\" style=\"align-self:flex-end\">Criar\u003c/button>\u003c/div>'\n    +'\u003cdiv class=\"small mut\" style=\"margin-top:6px\">Cria uma entrada por ano a partir de '+new Date().getFullYear()+', sem data. As datas, os resultados e os concursos avulsos ficam em Estatísticas › Concursos ('+C.contests.length+' registado(s)).\u003c/div>\u003c/div>';\n  h+='\u003ch2>Dados\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"small\">Tudo fica guardado neste browser. Para não perderes os dados e os teres noutros computadores, liga um ficheiro (por exemplo numa pasta do Syncthing, Dropbox ou semelhante): cada alteração é escrita nele e as que vierem de outro computador são juntas às tuas.\u003c/div>\u003cbutton style=\"margin-top:8px\" data-act=\"file\">Ficheiro de dados e cópias…\u003c/button>\u003c/div>';\n  h+='\u003ch2>Como usar\u003c/h2>\u003cdiv class=\"card small\">\u003cp style=\"margin-top:0\">\u003cb>Início\u003c/b> — o que fazer hoje, por ordem: upsolving dos últimos concursos, sessões de técnicas, CF Trainer, simulações, flashcards e diário. Em baixo ficam a revisão da semana e os objetivos, que se definem até ao domingo anterior.\u003c/p>'\n    +'\u003cp>\u003cb>Técnicas\u003c/b> — a lista de técnicas difíceis que queres manter frescas. Cada uma passa por 1.ª passagem, duas revisões e reescritas às cegas cada vez mais espaçadas; a plataforma propõe problemas e encaixa as sessões no tempo de cada dia.\u003c/p>'\n    +'\u003cp>\u003cb>CF Trainer\u003c/b> — problemas aleatórios do Codeforces à volta do teu rating interno, com tempo limite, isolados ou em contests de 3.\u003c/p>'\n    +'\u003cp>\u003cb>Diário e flashcards\u003c/b> — escolhe um problema resolvido nos últimos 14 dias, escreve o que vale a pena lembrar, e revê as ideias-chave em cartões com repetição espaçada.\u003c/p>'\n    +'\u003cp style=\"margin-bottom:0\">\u003cb>Estatísticas\u003c/b> — rating do Codeforces com recessões e as tuas explicações, fraquezas por tag, cumprimento semanal, revisões e concursos.\u003c/p>\u003c/div>';\n  return h;\n}\nfunction trainerSet(v,fresh){\n  const R=jget('cfTrainerState')||{history:[],timeLimit:40};\n  if(fresh||!Array.isArray(R.history)||!R.history.length){R.history=[];R.startRating=v}\n  R.rating=v;if(!R.startRating)R.startRating=v;if(!R.handle)R.handle=handle();\n  localStorage.setItem('cfTrainerState',JSON.stringify(R));parent.postMessage({cptools:'drop',tabs:['trainer']},'*');\n}\nconst cfApi=async q=>{const r=await(await fetch('https://codeforces.com/api/'+q)).json();if(r.status!=='OK')throw new Error(r.comment||'erro');return r.result};\n\n/* ---------- render and events ---------- */\nconst view=document.getElementById('view');\nfunction render(){\n  const y=scrollY,a=document.activeElement,fk=a&&a.dataset?JSON.stringify(a.dataset):null;\n  const open=[...view.querySelectorAll('details[open]')].length;\n  view.innerHTML=VIEW==='home'?vHome():VIEW==='set'?vSet():vStats();\n  if(fk&&fk!=='{}'){const f=[...view.querySelectorAll('input,textarea')].find(e=>JSON.stringify(e.dataset)===fk);if(f)f.focus()}\n  scrollTo(0,y);\n}\nview.addEventListener('click',e=>{\n  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}\n  const sm=e.target.closest('[data-sim]');if(sm){C.sim[today]=Math.max(0,(C.sim[today]||0)+(+sm.dataset.sim));if(!C.sim[today])delete C.sim[today];save();render();return}\n  const tr=e.target.closest('[data-train]');if(tr){trainTag(tr.dataset.train);return}\n  const tc=e.target.closest('[data-tech]');if(tc){addTech(tc.dataset.tech);return}\n  const cd=e.target.closest('[data-cards]');if(cd){go('journal','cptools-cards');return}\n  const up=e.target.closest('[data-up]');if(up){C.upskip[up.dataset.up]=today;save();render();return}\n  const pt=e.target.closest('circle.pt');if(pt){sel=sel===pt.dataset.key?null:pt.dataset.key;render();return}\n  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;\n  if(act==='sync'){sync(true);return}\n  if(act==='started'){C.set.started=1;save();render();return}\n  if(act==='file'){parent.postMessage({cptools:'file'},'*');return}\n  if(act==='phandle'){const v=document.getElementById('phandle').value.trim();setHandle(v);K={};try{localStorage.removeItem(CKEY)}catch(e){}\n    pmsg=v?'A verificar…':'Handle apagado.';render();\n    if(v)cfApi('user.info?handles='+encodeURIComponent(v)).then(r=>{pmsg='Encontrado: '+r[0].handle+(r[0].rating?' · rating '+r[0].rating+' (máx. '+r[0].maxRating+')':' · ainda sem rating');if(r[0].handle!==v)setHandle(r[0].handle)},e=>{pmsg='!O Codeforces não reconhece este handle ('+e.message+').'}).then(render);\n    return}\n  if(act==='tcf'){ymsg='A ler…';render();cfApi('user.info?handles='+encodeURIComponent(handle())).then(r=>{const v=Math.round((r[0].rating||1200)/100)*100;document.getElementById('trate').value=v;ymsg=r[0].rating?'Rating no Codeforces: '+r[0].rating+'. Confirma com o botão ao lado.':'Ainda sem rating no Codeforces: 1200.'},e=>{ymsg='!'+e.message})\n    .then(()=>{const v=document.getElementById('trate').value;render();document.getElementById('trate').value=v});return}\n  if(act==='tcur'||act==='tnew'){const v=parseInt(document.getElementById('trate').value,10);if(!(v>=0&&v\u003c=4000)){ymsg='!Rating inválido.';render();return}\n    if(act==='tnew'&&!confirm('Apagar o histórico do CF Trainer e recomeçar com rating '+v+'?'))return;\n    trainerSet(v,act==='tnew');ymsg='Guardado.';render();return}\n  if(act==='cgen'){const names=document.getElementById('cnames').value.split(',').map(x=>x.trim()).filter(Boolean),ny=Math.min(10,Math.max(1,parseInt(document.getElementById('cyears').value,10)||5)),y=new Date().getFullYear();\n    for(const n of names)for(let i=0;i\u003cny;i++)if(!C.contests.some(c=>c.name===n+' '+(y+i)))C.contests.push({id:uid()+i,name:n+' '+(y+i),date:'',result:'',note:''});\n    save();render();return}\n  if(act==='skiprev'){skipRev=true;render();return}\n  if(act==='editrev'){editRev=true;render();return}\n  if(act==='saverev'){const w=C.weeks[b.dataset.w]=C.weeks[b.dataset.w]||{};w.rev=w.rev||{};\n    for(const ta of view.querySelectorAll('textarea[data-rv]'))w.rev[ta.dataset.f]=ta.value.trim();\n    w.rev.at=today;editRev=false;save();render();return}\n  if(act==='addn')C.notes.push({id:uid(),from:today,to:today,text:''});\n  else if(act==='rmn')C.notes=C.notes.filter(n=>n.id!==b.dataset.id);\n  else if(act==='addc')C.contests.push({id:uid(),name:'',date:'',result:'',note:''});\n  else if(act==='rmc'){const c=C.contests.find(x=>x.id===b.dataset.id);if(c&&(c.result||c.note)&&!confirm('Remover \"'+c.name+'\" e as notas?'))return;C.contests=C.contests.filter(x=>x!==c)}\n  save();render();\n});\nview.addEventListener('change',e=>{\n  const el=e.target,d=el.dataset;\n  if(d.rv){const w=C.weeks[d.rv]=C.weeks[d.rv]||{};w.rev=w.rev||{};w.rev[d.f]=el.value.trim();save();return}\n  if(d.w){if(!editable(d.w))return;const w=own(d.w);\n    if(d.f==='mode'){if(el.value==='normal')delete w.mode;else w.mode=el.value;save();render();return}\n    if(d.f==='unit'){const nu=el.value==='min'?'min':'n';if(nu!==w.unit){const tl=trLimit();\n      for(const x of w.days){x.tec=nu==='min'?(+x.tec||0)*45:Math.round((+x.tec||0)/45);x.tr=nu==='min'?(+x.tr||0)*tl:Math.round((+x.tr||0)/tl)}w.unit=nu}save();render();return}\n    if(d.f==='goal')w.goal=el.value.trim();\n    else if(d.f==='note')w.days[+d.i].note=el.value.trim();\n    else w.days[+d.i][d.f]=Math.max(0,parseInt(el.value,10)||0);\n    save();render();return}\n  if(d.cn){if(el.value.trim())C.cnote[d.cn]=el.va
